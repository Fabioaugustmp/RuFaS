lection; the documentation distinguishes these as *Generation* and *Selection*.\n- \"pre_animal_population\" and \"post_animal_population\" in code refer to the animal pool before and after random selection, respectively.\n- Only calcium and phosphorus mineral requirements are currently implemented.\n- The NASEM growth energy calculation (equations AN.NSM.11–17) is retained as reference but not used in the current model version.\n- Amino acid requirements are implemented for essential amino acids only; non-essential AA requirements are not yet included.","other-docs":"# Other — docs\n\n# Documentation — Sphinx Build Wrappers (`docs/`)\n\n## Overview\n\nThe `docs/` module contains the build tooling for the project's documentation. It consists of two thin wrapper scripts around Sphinx — the standard Python documentation generator:\n\n- `Makefile` — the POSIX/macOS entry point\n- `make.bat` — the Windows entry point\n\nBoth wrappers delegate every real operation to the `sphinx-build` command, as specified by the project's `SPHINXBUILD` environment variable (defaulting to `sphinx-build`). The actual documentation content is not in this module; it lives in the `_src/` source directory that these scripts operate on.\n\n## Purpose\n\nThe module exists to give developers a uniform, platform-independent way to build the documentation without having to invoke `sphinx-build` manually. Both scripts expose Sphinx's standard command set (`html`, `latexpdf`, `doctest`, `clean`, …) so the same workflow works on any operating system.\n\nThere is no logic of its own beyond argument routing — the scripts intentionally stay thin wrappers so that Sphinx remains the single source of truth for build behavior.\n\n## How It Works\n\nBoth scripts define the same set of variables:\n\n| Variable      | Default         | Purpose |\n|---------------|-----------------|---------|\n| `SPHINXOPTS`  | *(empty)*       | Extra flags passed to every `sphinx-build` invocation. Can be supplied on the command line or via the environment. |\n| `SPHINXBUILD` | `sphinx-build`  | The Sphinx executable to use. Set this if Sphinx is not on `PATH`. |\n| `SOURCEDIR`   | `_src`          | Directory containing the RST/Markdown sources and `conf.py`. |\n| `BUILDDIR`    | `_build`        | Directory where Sphinx writes generated output. Safe to delete. |\n\nBoth scripts invoke Sphinx using its \"make mode\" (`sphinx-build -M <TARGET>`), which lets Sphinx's own machinery resolve the target-specific build steps.\n\n### The Catch-All Rule (Makefile)\n\n```make\n%: Makefile\n\t@$(SPHINXBUILD) -M $@ \"$(SOURCEDIR)\" \"$(BUILDDIR)\" $(SPHINXOPTS) $(O)\n```\n\nEvery target that doesn't match an explicit rule is forwarded verbatim to `sphinx-build`. This is what makes arbitrary Sphinx targets such as `singlehtml` or `linkcheck` work without this module needing to know them in advance.\n\nThe two `help` targets — one explicit in the Makefile, one only defined in `make.bat` for the Windows fallback — delegate to `sphinx-build -M help` so the developer navigates Sphinx's own target list.\n\n### Windows-Specific Behavior\n\nThe `make.bat` scripts first checks whether `sphinx-build` is available by running it and inspecting the error level:\n\n```batch\n%SPHINXBUILD% >NUL 2>NUL\nif errorlevel 9009 (\n\techo.The 'sphinx-build' command was not found. ...\n\texit /b 1\n)\n```\n\nIf the CLI cannot be found (errorlevel 9009 means `command not found` on Windows), it prints a friendly message with installation instructions and exits — rather than letting Sphinx error out silently later.\n\n### Flow\n\n```mermaid\ngraph LR\n    Dev[Developer] -->|\"make <target>\"| Make[Makefile]\n    Dev -->|\"make.bat <target>\"| Bat[make.bat]\n    Make --> SB[sphinx-build -M target]\n    Bat --> SB\n    SB --> SRC[_src/]\n    SRC --> OUT[_build/]\n```\n\nBoth entry points converge on the identical `sphinx-build` invocation; there is no divergence between the operating systems' available options.\n\n## Typical Build Targets\n\nAll targets are provided by Sphinx itself — this module only forwards them:\n\n| Target | Purpose |\n|--------|---------|\n| `<none>` | Build HTML output (default). |\n| `clean` | Remove everything under `_build/`. |\n| `html` | Generate HTML in `_build/html/`. |\n| `doctest` | Run code snippets in docstrings/documents. |\n| `linkcheck` | Check all external links. |\n| `latexpdf` | Build the PDF via LaTeX. |\n\nBecause of the catch-all forwarding, any future Sphinx target works without editing the wrapper.\n\n## Extending the Module\n\nWhen adding new documentation, work stays inside the source directory and requires no change to these files:\n\n1. Create `.rst` — or if configured, `.md` — files under `_src/`.\n2. Add them at the appropriate points in the index's toc to tree.\n3. Run `make` html and verify the output in `_build/`.\n\nChanging the Sphinx build configuration (themes, extensions, project metadata) is done in `_src/conf.py`, another no change to the wrappers is required unless the default `_src` / `_build` layout is changed.\n\n## Requirements\n\n- Sphinx must be installed on the system (`pip install sphinx`), and a proper virtualenv active.\n- If Sphinx is not on `PATH`, set `SPHINXBUILD` to the full path to the executable — the both scripts honor overrides on the command line, notably:\n\n  ```sh\n  make SPHINXBUILD=/path/to/sphinx-build html\n  ```\n\n- This module has no runtime dependencies and no internal/external call graph in the codebase — it is an entry-point-only module used by human developers and CI workflows invoked from the repository root or directly within `docs/`.","other-forking-md":"# Other — FORKING.md\n\n# Forking Guidelines (FORKING.md)\n\n## Overview\n\n`FORKING.md` is a governance and policy document for the RuFaS project. It defines the project's official stance on forking: when forking is encouraged, how forks must represent their relationship to upstream, and the operational rules for contributing changes back. While it contains no executable code, it functions as a **policy module** that shapes contribution workflows, CI/CD access requirements, and community norms.\n\nThe document is organized into six policy sections, each addressing a distinct concern:\n\n| Section | Concern |\n|---------|---------|\n| §1 Strategic norms | When forking is appropriate vs. discouraged |\n| §2 Transparency & lineage | Public-facing disclosure requirements for forks |\n| §3 Proprietary collaboration | Rules for closed-source derivatives |\n| §4 Public fork requirement | Operational prerequisite for opening PRs |\n| §5 Endorsement & official status | Who may claim project endorsement |\n| §6 Re-integration mindset | Expectations for contributing insights back |\n\n## Key Policies\n\n### 1. Strategic Norms (§1)\n\nThe document frames forking as a **first-class collaboration mechanism** rather than a last resort. It explicitly encourages forks for experimentation, contextual adaptation, and capability development. Conversely, it discourages forking for trivial configuration changes that could be handled via plugins, adapters, parameterization, or feature flags.\n\nThe guiding principle: *\"Fork to explore and learn—then share what you learn when possible.\"*\n\n### 2. Transparency and Lineage (§2)\n\nPublic forks must maintain clear lineage to upstream RuFaS. Required disclosures include:\n\n- A **\"Fork rationale\"** section in the fork's README\n- The **upstream version or tag** the fork is based on (e.g., \"Forked from RuFaS vX.Y.Z\")\n- A list of **material deviations** (assumptions, datasets, algorithms, validation approaches)\n- A **comparability note** describing which results can be compared to upstream RuFaS\n\n### 3. Proprietary Collaboration (§3)\n\nThe policy explicitly permits private forks for internal development, productization, and compliance work, subject to license terms. The key constraint is **separation of concerns**: proprietary derivatives must clearly distinguish RuFaS-originated work from proprietary IP and must not present themselves as \"RuFaS\" itself.\n\n### 4. Public Fork Requirement for PRs (§4)\n\nThis is the most operationally significant rule. **A fork must be public at the time a pull request is opened.** The stated reasons are:\n\n- RuFaS CI/CD workflows (GitHub Actions) must access the fork to run automated checks\n- GitHub's PR review and merge-conflict workflows require repository access\n\nTwo migration paths exist for private-fork developers:\n\n1. Make the existing fork public before opening the PR\n2. Create a new public fork and cherry-pick the relevant commits\n\n### 5. Endorsement and Official Status (§5)\n\nThe document establishes a **single-category rule**: only the RuFaS Program Management Leadership (PML) can grant \"official\" or \"endorsed\" status to a fork. Maintainer feedback explicitly does **not** constitute endorsement — a deliberate separation of technical stewardship from governance decisions.\n\n### 6. Re-integration Mindset (§6)\n\nThe policy normalizes the reality that not every fork should merge upstream, while establishing a normative expectation to contribute back in *some* form: a PR, a design note, or a \"lessons learned\" issue.\n\n## Operational Impact\n\nFor developers working with RuFaS, this document has three practical consequences:\n\n1. **CI/CD access**: The public-fork requirement (§4) exists because GitHub Actions cannot run against private forks without additional paid plans or workarounds. Plan for this before starting contribution work.\n\n2. **Attribution hygiene**: If you maintain a fork, the disclosure requirements in §2 are non-negotiable for public forks. The version string and deviations list should be updated on every upstream rebase.\n\n3. **Communication boundaries**: If you work with proprietary derivatives, the endorsement rules in §5 mean you should route any public claims about your product's relationship to RuFaS through the `contact@rufas.org` channel when in doubt.\n\n## Relationship to Project Workflows\n\n```\nflowchart TD\n    A[Developer wants to contribute] --> B{Has a fork?}\n    B -->|No| C[Create public fork]\n    B -->|Yes, private| D{Can make public?}\n    D -->|Yes| C\n    D -->|No| E[Create new public fork + cherry-pick]\n    C --> F[Open PR]\n    F --> G[CI/CD runs on public fork]\n    G --> H[Maintainers review]\n    H --> I[Feedback / Merge]\n    E --> F\n```\n\nThe document connects to the broader RuFaS ecosystem in three ways:\n\n- **CI/CD pipeline**: The public-fork rule exists to keep GitHub Actions workflows functional\n- **Governance structure**: References the PML as the authority for endorsement decisions\n- **Community health**: The re-integration norms (§6) feed design discussions and lessons-learned issues back into the project\n\n## Summary\n\n`FORKING.md` is a policy document that balances openness with ecosystem integrity. It permits and even encourages divergence, but requires transparency about it. For contributors, the most important takeaway is operational: **make your fork public before opening a PR**, and keep your README's fork rationale and version lineage current.","other-helpful-scripts-emissions-interpolation":"# Other — helpful_scripts-emissions_interpolation\n\n# emissions_interpolation\n\n## Overview\n\n`emissions_interpolation.py` is a standalone utility script located in `helpful_scripts/emissions_interpolation/`. It was written to support [MASM PR #2067](https://github.com/RuminantFarmSystems/MASM/pull/2067), which required filling gaps in feed emissions factors across U.S. states. The script combines several reference datasets — FIPS-to-ZIP crosswalk data, ZIP-code coordinates, FIPS-to-region mappings, and a feed emissions library — to produce interpolated emissions factors for feed items.\n\nThe module is fully self-contained: it has no internal dependencies, makes no outgoing calls, and is not imported anywhere else in the codebase. It is run directly, and its output files are manually reviewed before being promoted into `input/data/EEE`.\n\n## Background\n\nCertain feed items in the RuFaS feed library lacked emissions factors for entire U.S. states. To build a complete national dataset, the missing values had to be derived from geographically related data. The interpolation relies on the chain of relationships between counties (identified by FIPS codes), ZIP codes, and lat/long coordinates:\n\n1. FIPS codes identify counties.\n2. A crosswalk maps FIPS codes to ZIP codes.\n3. GeoNames data provides coordinates for each ZIP code.\n4. A regional mapping groups FIPS codes into larger regions.\n\nThis chain lets the script aggregate or interpolate emissions factors at state or regional granularity, depending on data availability.\n\n## Files\n\n| File | Source / Purpose |\n|---|---|\n| `emissions_interpolation.py` | The main script. Contains user-defined configuration values at the top, followed by the interpolation logic. |\n| `COUNTY_ZIP_032010.csv` | HUD USPS crosswalk data. Maps FIPS codes to ZIP codes. Uses 2010 census FIPS codes. |\n| `geonames_US.csv` | GeoNames US data. Provides lat/long coordinates per ZIP code. Was opened in Excel and converted to CSV. |\n| `fips_to_region.csv` | Maps FIPS codes to geographic regions. |\n| `Feed Emissions Source RuFaS_Feed_Library_Combined_Final.csv` | Notes the source of emissions factors for each feed item. |\n| `*_wheat_regional_averages.csv` | Regional averages for a specific pair of wheat feeds with identical emissions factors; used to fill statewide gaps. |\n\n## How It Works\n\nThe script executes a geographic interpolation pipeline:\n\n1. **Load configuration** — user-defined values at the top of the script control the methodology (which feeds to process, how to handle missing data, etc.).\n2. **Map FIPS to ZIP** — using `COUNTY_ZIP_032010.csv`.\n3. **Map ZIP to coordinates** — using `geonames_US.csv`.\n4. **Map FIPS to region** — using `fips_to_region.csv`.\n5. **Interpolate emissions factors** — for each feed item, combine the feed library emissions sources with the geographic mappings to fill state-level gaps.\n6. **Write output files** — generated files are written to the `emissions_interpolation` directory for evaluation.\n\n```mermaid\nflowchart LR\n    A[COUNTY_ZIP_032010.csv] --> D[emissions_interpolation.py]\n    B[geonames_US.csv] --> D\n    C[fips_to_region.csv] --> D\n    E[Feed Emissions Source ... csv[\".csv\"]] --> D\n    D --> F[Output CSVs]\n    F --> G[Manual review]\n    G --> H[input/data/EEE]\n```\n\n## Usage\n\nRun the script directly:\n\n```\npython emissions_interpolation.py\n```\n\nBefore running, review the user-defined values in the first section of the file. These parameterize the methodology used in PR #2067 and may need adjustment for future use cases.\n\nOutput files are created in the `emissions_interpolation` directory. They should be evaluated before being added to `input/data/EEE`.\n\n## Special Case: Feeds 193 and 197\n\nFeeds 193 and 197 were not found across entire states. For these feeds, the script falls back to regional averages rather than state-level interpolation. This is why the folder contains the supplementary `*_wheat_regional_averages.csv` files.\n\n## Caveats\n\n- The script was written by Joe Waddell and only tested locally.\n- It contains some hardcoded paths and was primarily exercised on Windows; it may not work on other platforms without modification.\n- FIPS codes are from the 2010 census, not the 2020 census. Some codes have changed, which could affect correctness if the script is reused with newer data.\n\n## Integration with the Codebase\n\nThis module is not imported by any other code and has no runtime dependencies on the rest of the repository. Its outputs feed into `input/data/EEE`, the emissions and energy data directory consumed elsewhere in MASM. The script is therefore a data-generation tool used occasionally during dataset preparation, rather than a runtime dependency.","other-helpful-scripts-soil-crop-evaluation":"# Other — helpful_scripts-soil_crop_evaluation\n\n# helpful_scripts/soil_crop_evaluation\n\n## Overview\n\n`helpful_scripts/soil_crop_evaluation` is a data-only module that supplies the evaluation scenarios for a field-level soil–crop simulation. It contains no executable code and no call graph edges of its own; instead, it provides the JSON inputs that a crop-evaluation runner consumes to simulate multi‑year cropping systems, nutrient management, and tillage regimes.\n\nThe module is organized under `eval_inputs/` and is composed of:\n\n- one shared field definition,\n- three simulation-configuration files,\n- eight crop-schedule definitions,\n- eleven manure schedules,\n- seven tillage schedules,\n- six fertilizer schedules.\n\nThe fixtures are agronomically realistic: 25–28 year runs staring in January 1980, crop rotations built from corn silage, corn grain, soybean, alfalfa, cover crops, and perennial grass, and management options that contrast synthetic fertilizer, broadcast/injected manure, conventional/conservation tillage, and several crop cover treatments. A new scenario in this module is essentially a new combination of one file from each directory.\n\n## Directory layout\n\n```\neval_inputs/\n├── config/                 # simulation control (dates, options, county)\n├── crop/                   # crop planting/harvest schedule definitions\n├── fertilizer_schedule/    # synthetic fertilizer application events\n├── field/                  # shared field and soil/management spec\n├── manure_schedule/        # organic nutrient application events\n└── tillage_schedule/       # tillage operation events\n```\n\n| Directory | Purpose |\n|---|---|\n| `config/` | Per-scenario simulation settings: timeframe, RNG seeding, simulation type, nutrient standard, county. |\n| `crop/` | How often a species is planted and harvested, the day-of-year of each event, whether harvest kills the crop, and how the pattern repeats. |\n| `fertilizer_schedule/` | The available fertilizer mixes and the date, depth, and mass of each synthetic application. |\n| `manure_schedule/` | Application date, mass, depth, coverage, and form (liquid) of each manure application. |\n| `tillage_schedule/` | Date, depth, mixing fraction, and incorporation fraction of each tillage pass. |\n| `field/` | Location, field size, watering parameters, and named references to the soil/crop/management specifications used in the run. |\n\n## How a scenario is assembled\n\nA scenario is assembled from the five directories:\n\n```mermaid\nflowchart LR\n    CFG[config/*.json] --> RUN[evaluation run]\n    CROP[crop/*.json] --> FIELD[crop_evaluation_field.json]\n    FERT[fertilizer_schedule/*.json] --> FIELD\n    MAN[manure_schedule/*.json] --> FIELD\n    TILL[tillage_schedule/*.json] --> FIELD\n    FIELD --> RUN\n```\n\nThe shared `field/crop_evaluation_field.json` declares the overall environment (location, field size) and the names of the specifications that the runner will resolve. The crop, fertilizer, manure, and tillage files are the concrete schedule definitions. The `config` file supplies the run-level controls (start/end, nutrient standard, county). A comparison experiment is formatted by choosing a different crop schedule, or by substituting an alternative fertilizer/manure/tillage file under the same config.\n\n## Simulation config files\n\nEach file in `config/` is a JSON object with the following keys:\n\n| Key | Type | Meaning |\n|---|---|---|\n| `start_date` | string | Simulation start as `\"YEAR:DOY\"` (day-of-year). |\n| `end_date` | string | Simulation end as `\"YEAR:DOY\"`. |\n| `set_seed` | boolean | Whether to seed the random-number generator deterministically. |\n| `simulation_type` | string | Type of simulation to execute; all scenarios use `\"field_and_feed\"`. |\n| `nutrient_standard` | string | Nutrient requirement model; all scenarios use `\"NASEM\"`. |\n| `FIPS_county_code` | integer | U.S. FIPS county code used for location-derived inputs (e.g., weather); all scenarios use `55021`. |\n\nThe three configs differ only in the simulation window:\n\n| Config file | Window |\n|---|---|\n| `con_corn_config.json` | 1980:1 – 2004:365 |\n| `corn_cover_crop_config.json` | 1980:1 – 2005:365 |\n| `corn_alfalfa_config.json` | 1980:1 – 2007:365 |\n\nExample:\n\n```json\n{\n    \"start_date\": \"1980:1\",\n    \"end_date\": \"2004:365\",\n    \"set_seed\": false,\n    \"simulation_type\": \"field_and_feed\",\n    \"nutrient_standard\": \"NASEM\",\n    \"FIPS_county_code\": 55021\n}\n```\n\n## Field definition\n\n`field/crop_evaluation_field.json` is shared by all scenarios. It defines the physical environment and names the specifications that must be resolved externally:\n\n| Key | Value / meaning |\n|---|---|\n| `soil_specification` | Name of the soil specification to load (here `\"soil\"`). |\n| `crop_specification` | Name of the crop specification to load (here `\"crop\"`). |\n| `fertilizer_management_specification` | Name of the fertilizer schedule to use (`\"fertilizer_schedule\"`). |\n| `manure_management_specification` | Name of the manure schedule (`\"manure_schedule\"`). |\n| `tillage_management_specification` | Name of the tillage schedule (`\"tillage_schedule\"`). |\n| `field_size` | Field area (here `1.0`). |\n| `absolute_latitude` / `longitude` | Geographic location of the field. |\n| `minimum_daylength` | Minimum daylength used for photoperiod-aware crop processes. |\n| `seasonal_high_water_table` | Whether a seasonal high water table is simulated. |\n| `watering_amount_in_liters` / `watering_interval` | Irrigation settings (zero/disabled in these scenarios). |\n| `supplement_manure_nutrient_deficiencies` | Whether the model may supplement nutrient deficiencies beyond the manure schedule. |\n\n## Crop schedules\n\nFiles: `eval_inputs/crop/*.json`\n\nA crop schedule defines **one or more crop species** with **planting dates** and **harvest dates** as parallel arrays of explicit events. Because a seedable rotation can involve multiple `crop_schedules` entries, each entry is one species and its associated events.\n\nKey fields:\n\n| Key | Type | Meaning |\n|---|---|---|\n| `crop_species` | string | Species/model crop name, e.g. `\"corn_silage\"`, `\"corn_grain\"`, `\"alfalfa_silage\"`, `\"soybean_grain\"`, `\"cereal_rye_silage\"`, `\"triticale_silage\"`, `\"winter_wheat_silage\"`, `\"tall_fescue_hay\"`. |\n| `planting_years` / `planting_days` | array | Base planting events as year/day pairs. |\n| `harvest_years` / `harvest_days` | array | Harvest events as year/day pairs. For perennial/multi-cut systems, this lists every event within the base cycle, e.g. an alfalfa season is four events `1980:166`, `1980:198`, `1980:230`, `1980:245` etc. |\n| `harvest_operations` | array | One operation for each harvest event. The vocabulary used is:\n- `\"harvest_only\"` — remove biomass without terminating the crop (multi-cut hay/alfalfa);\n- `\"harvest_kill\"` — harvest and terminate the stand (silage corn, final alfalfa cut);\n- `\"kill_only\"` — terminate the crop without a biomass harvest (cover crops, rye/wheat/triticale in spring). |\n| `harvest_type` | string | All scenarios use `\"scheduled\"`; i.e., harvest is exactly the date data, not event-driven by crop state. |\n| `pattern_repeat` | integer | Number of times the pattern is repeated to extend the schedule over the scenario horizon. |\n| `planting_skip` / `harvesting_skip` | integer | Year offset/advance applied to the next repeat of planting (or harvesting) occurrences. These let rotations be interleaved — for example, to plant a cereal cover in fall of one year and harvest it in spring of the following year. |\n\n### How a fixed season composes\n\nRepeated stop, multi-entry rotations are expressed by listing all base event years/days and by setting the repeat and skip fields so the engine can stretch the pattern across the window.\n\n- **Continuous corn silage** — one annual event per year (`corn_silage`, planted at DOY 136, harvested at DOY 259 with `harvest_kill`), `pattern_repeat: 24`, `planting_skip: 0`, `harvesting_skip: 0`.\n- **Corn + winter cover crop** — the same corn silage cycle is alternated with a second schedule: `cereal_rye_silage` (or `triticale_silage`, `winter_wheat_silage`) planted at DOY 263 and killed at DOY 120 of the following year with `\"kill_only\"`. The planting/harvest year shift (planting in year N, harvest in year N+1) is expressed directly in the arrays: `planting_years: [1980]`, `harvest_years: [1981]`.\n- **Corn–alfalfa rotation** — two schedule strings: an alfalfa silage block planted in 1980 with 15 cuts across four years (ending with `harvest_kill` and year 1983), and a corn block (`corn_silage` or `corn_grain`) planted in 1984–1986. Skip values (`planting_skip: 6` / `4`, `harvesting_skip: 3` / `4`) distribute the repeating blocks across the 28-year window.\n- **Corn–soybean** — 4-year cycles of soybean (1980–1981) and corn (1982–1984) interleaved by the skip parameters of each species block.\n- **Tall fescue hay** — A single persistent `tall_fescue_hay` stand: planted in 1980, three or four cuttings per year (via the full harvest-year/day lists), with `harvest_only` majority allowances and a single final `harvest_operations` value (`\"harvest_kill\"`), killed only at the end. `pattern_repeat: 0` (no replication; all events are enumerated explicitly).\n\n## Fertilizer schedules\n\nFiles in `eval_inputs/fertilizer_schedule/` describe synthetic fertilizer applications as parallel arrays: for each application event, one entry in each of `years`, `count`, `days`, `mix_names`, `nitrogen_masses`, `phosphorus_masses`, `potassium_masses`, `application_depths`, and `surface_remainder_fractions`. The number of events in `years`/`days`/`mix_names` equals the number of applications.\n\nStructure:\n\n| Field | Meaning |\n|---|---|\n| `available_fertilizer_mixes` | A mix list, each with a `name` and dry composition stored in the object: `\"N\"`, `\"P\"`, `\"K\"` fractions. Example mixes: `\"15-15-15\"` (0.15/0.15/0.15) and `\"100-0-0\"` (1.0/0/0). |\n| `mix_names` | Per-event name of the mix, matching lists in `available_fertilizer_mixes`. |\n| `years` / `days` | Application dates (start-of-year + day-of-year). |\n| `nitrogen_masses`, `phosphorus_masses`, `potassium_masses` | Per-event application mass in simulation units. `potassium_masses` is frequently a single `0.0` entry in these data for scenarios that do not use potassium. |\n| `application_depths` | Depth of placement; `0.0` means a surface application, nonzero values are injections (e.g. `25.4`, `101.6`). |\n| `surface_remainder_fractions` | Fraction of the nutrient left on the soil surface (`1.0` = broadcast; `0.0` = fully banded below surface). |\n| `pattern_repeat` / `pattern_skip` | Number of times the event list is repeated, and the number of years offset between repetitions. |\n\nExample from `continuous_corn_25_year_fert.json`: two events per year (starter 15-15-15 at DOY 136 and side-dressed N at DOY 183), repeated over 24 years.\n\n## Manure schedules\n\n`eval_inputs/manure_schedule/*.json` uses the same repeated event-array design:\n\n| Field | Meaning |\n|---|---|\n| `years` / `days` | Dates of each manure application. |\n| `nitrogen_masses`, `phosphorus_masses`, `potassium_masses` | Nutrient mass applied per event. |\n| `coverage_fractions` | Fraction of the field surface that the manure covers (typically `0.95`). |\n| `application_depths` | `0.0` for broadcast; `101.6` for injection. |\n| `surface_remainder_fractions` | `1.0` for broadcast (all remaining on the surface), `0.05` for injections (the rest is incorporated). |\n| `manure_types` | always `\"liquid\"` in these inputs. |\n| `pattern_repeat` / `pattern_skip` | Repeats the whole event list over the run window, skipping years as configured. |\n\nThe directory contains targeted experiments:\n\n| File | Treatment |\n|---|---|\n| `continuous_corn_25_year_manure_broadcast.json` | Annual manure, surface-applied, 196 N mass. |\n| `continuous_corn_25_year_manure_injection.json` | Same mass injected at depth. |\n| `continuous_corn_double_manure_broadcast.json` | Double the N/P mass of the standard broadcast. |\n| `continuous_corn_double_manure_injection.json` | Double mass, injected. |\n| `corn_grain_soy_grain_manure.json` | Manure on the corn years of the corn–soybean rotation. |\n| `double_corn_grain_soy_grain_manure.json` | The same crop rotation at double the corn manure mass. |\n| `corn_alfalfa_28year_manure_schedule.json` | Manure after alfalfa cuts and before corn blocks. |\n| `corn_cover_crop_manure.json` | Manure in the spring of the corn year and again after corn harvest for the cover crop. |\n| `tall_fescue_manure.json` | Periodic manure for the long-term grass hay stand. |\n\n## Tillage schedules\n\nTillage files are also event-array strings, but with tillage-specific parallel values:\n\n| Field | Meaning |\n|---|---|\n| `years` / `days` | Date of each tillage pass |\n| `tillage_depths` | Tool depth (e.g. `150`, `100`, `40`; units are model depth units) |\n| `mixing_fractions` | Fraction of the soil mixing in that layer |\n| `incorporation_fractions` | Fraction of surface residue or manure incorporation in that pass |\n| `pattern_repeat` / `pattern_skip` | Repetition / year offset |\n\nMultiple passes are expressed as multiple entries on the same date or consecutive dates:\n\n- `continuous_corn_25_year_conven_till.json` — a two-pass conventional tillage each year (deep pass DOY 123, shallow pass DOY 124).\n- `continuous_corn_25_year_conserv_till.json` — a single pass, lower mixing.\n- `corn_alfalfa_28year_tillage_schedule.json` — pre-seeding seedbed passes plus primary + secondary tillage for corn block cycles.\n- `corn_cover_crop_tillage.json` — spring tillage before corn plus fall tillage after harvest before the cover crop.\n- `tall_fescue_tillage.json` — three final passes at establishment only (`pattern_repeat: 0`).\n\n## Scenarios\n\nThe following treatments can be assembled from the files in this module.\n\n| Scenario | Config | Crop file(s) | Management files |\n|---|---|---|---|\n| Continuous corn silage, 25 years | `con_corn_config.json` | `continuous_corn_25_year.json` | Fertilizer: `continuous_corn_25_year_fert.json` or `con_corn_supplemental_n.json`<br>Manure: one of `continuous_corn_25_year_manure_broadcast_*`, `*_injection`, `*_double_*`<br>Tillage: `continuous_corn_25_year_conven_till.json` or `..._conserv_till.json` |\n| Corn silage + winter cover crop | `corn_cover_crop_config.json` | `corn_rye.json` (cereal rye), `corn_triticale.json` (triticale), or `corn_winter_wheat_cover.json` | Manure: `corn_cover_crop_manure.json`<br>Tillage: `corn_cover_crop_tillage.json` |\n| Corn–alfalfa rotations, 28 years | `corn_alfalfa_config.json` | `corn_alfalfa_rotation_28year.json` (corn silage) or `corn_grain_alfalfa_rotation_28year.json` (corn grain) | Fertilizer: `corn_alfalfa_28year_fertilizer_schedule.json`<br>Manure: `corn_alfalfa_28year_manure_schedule.json`<br>Tillage: `corn_alfalfa_28year_tillage_schedule.json` |\n| Corn grain–soybean rotation | any config covering the planted years (e.g. the 1980–2004 window) | `corn_grain_soy_grain.json` | Manure: `corn_grain_soy_grain_manure.json` or `double_corn_grain_soy_grain_manure.json`<br>Tillage: `corn_grain_soy_grain_tillage.json` |\n| Perennial tall fescue hay | any config covering 1980–2004 | `tall_fescue_eval.json` | Manure: `tall_fescue_manure.json`<br>Tillage: `tall_fescue_tillage.json` |\n\nNo dedicated config file is provided for the corn–soybean or tall-fescue cases; they are intended to be run under the window offered by `con_corn_config.json` (or another config whose dates match the schedule length).\n\n## Conventions to be aware of\n\n- **All arrays in a schedule are parallel.** To add a cutting, fertilizer event, or tillage pass, add one entry to every event array, rather than a separate rule.\n- **Dates are `\"YEAR:DOY\"`** for the config window and plain integers in `years`/`days` arrays within the schedules.\n- **Repeated vs. enumerated**: a heavily repeated crop (e.g., continuous corn) uses `pattern_repeat` to stretch a few base events over the whole window; a highly specified long-term forage like tall fescue instead enumerates every event in the arrays and uses `pattern_repeat: 0`.\n- **Cover-crop kill operations** are `\"kill_only\"` (a kill event with no harvest), while silage/grain termination events are `\"harvest_kill\"`.\n- **Perennial multi-cut harvests** are ordered as arrays of `harvest_days` per year and each event has an entry in `harvest_operations`; only the last cut uses `\"harvest_kill\"`.\n- **Single-value potassium arrays**: several fertilizer/manure files leave `potassium_masses` as `[0.0]`, a valid measure that no potassium is applied by the treatment.\n\n## Integration with the codebase\n\nBecause the module contains only static data, the integration boundary is simple:\n\n- The JSON files are read by the evaluation runner, by specification name (e.g. `field.json` resolves `fertilizer_management_specification: \"fertilizer_schedule\"` to the schedules below that directory).\n- No module code, functions, or classes exist here — adding a scenario is done by adding a new JSON file (or file combination) and referring to it — or by altering the specification names through the field file.\n\nAll numbers (masses, depths, fractions) are in the units used by the downstream model; where they represent agronomic material (masses of N/P/K), the levels are designed to be internally comparable (e.g., standard vs. double manure, broadcast vs. injected, synthetic vs. manure-only) across the same crop and config.","other-helpful-scripts":"# Other — helpful_scripts\n\n# Other — helpful_scripts\n\n## Overview\n\nThe `helpful_scripts` module is a loose collection of utility scripts and support files used when working with the RuFaS codebase. Where the rest of RuFaS is structured as a cohesive framework, this folder exists as a scratch drawer: it holds one-off tooling, convenience scripts, and manual setup files that developers use during day-to-day work.\n\nThe module is deliberately kept separate from the main codebase. It is not imported by RuFaS modules, and none of its files are part of the runtime or core build. It exists purely as developer-facing tooling.\n\n## Purpose\n\nThese scripts solve practical, recurring problems that come up when working with RuFaS:\n\n- Setup and configuration tasks\n- Data preparation or conversion tools\n- Development-environment conveniences\n- Scripts for inspecting or exercising parts of the codebase manually\n\nThe folder is organized into subfolders, where each subfolder groups scripts/files around a specific task or workflow area.\n\n## Important Caveats\n\nThe README is explicit about the maintenance status of this module:\n\n- **Not held to the same standard** — These files do not follow the same quality guidelines, testing practices, or code-review rigor as the rest of the RuFaS codebase.\n- **Not regularly updated** — The scripts may lag behind changes to RuFaS. They are not continuously validated against the current codebase.\n- **Use with care** — Many scripts will require manual adjustment to work with your current environment, your local configuration, or the current state of the RuFaS source tree.\n\nTreat these scripts as **starting points**, not as reliable, maintained tools. Before using one, read it, understand it, and expect to alter it.\n\n## How It Fits Into the Codebase\n\nFrom an integration standpoint, `helpful_scripts` is entirely standalone:\n\n- **No incoming calls** — no RuFaS module or package imports from this folder.\n- **No outgoing calls** — these scripts do not call into RuFaS modules through a stable API; any interaction with the codebase is ad hoc and script-specific.\n- **No execution flows** — since the module is not part of the application's runtime path, there is no execution flow that passes through it during builds or normal operation.\n\nAdditionally these are run by a developer from the command line, not by the application.\n\n```mermaid\nflowchart LR\n    subgraph RuFaS Codebase\n        A[Framework modules]\n        B[Runtime pipeline]\n    end\n\n    subgraph helpful_scripts\n        C[Setup & utility scripts]\n        D[Subfolder-organized tooling]\n    end\n\n    E[Developer / user]\n\n    E -->|runs manually from CLI| C\n    C -->|ad hoc operations, not API calls| A\n    B -.->|no runtime dependency| D\n\n    style D fill:#f9f9f9,stroke:#999,stroke-dasharray: 5 5\n    style C fill:#f9f9f9,stroke:#999,stroke-dasharray: 5 5\n```\n\nThe scripts may touch files, invoke commands, or manipulate configuration in the RuFaS workspace, but they do so as external tooling rather than as an integrated component of the system.\n\n## Working With This Module\n\nWhen contributing to or using `helpful_scripts`, keep the following in mind:\n\n- **Don't expect it to work as-is.** Read each script and adapt it to your setup.\n- **Don't assume current correctness.** If you are using a script with the current RuFaS codebase, be prepared to update it. Verify it reflects the current configuration formats, file paths, and command interfaces.\n- **Don't let quality drift in.** If you add a script here, you are not required to meet the framework's QA bar — but you should still leave the script in a working state and documented in the comments.\n- **Improve the module.** The best contributions are scripts that solve a real, repeated problem and save future developers time. If you fix or modernize an existing script, note it so the next person benefits.\n\n## Key Components\n\nThe module has no exposed APIs or named entry points. Its only guaranteed structure is:\n\n| Component | Description |\n|---|---|\n| `readme.md` | Module overview and usage warning (this source you are reading) |\n| Subfolders | Each contains a set of related helper scripts/files. There is no guaranteed naming convention or shared interface between subfolders; each subfolder is self-contained. |\n\nThere is no formal registration, packaging, or test coverage for this module. It is automatically present in the repository but is invisible to the RuFaS build — a good thing, because this is exactly the kind of tooling that should stay out of the production pipeline.","other-input-data":"# Other — input-data\n\n# Other — input-data Module\n\n## Overview\n\nThe `input/data` directory is the static data backbone of the dairy farm simulation. It contains all JSON parameter files that define simulation scenarios, animal herd configurations, crop rotations, equipment constants, and end-to-end test expectations. This module contains no executable code — it is consumed by the simulation's input-loading layer at startup.\n\nThe data is organized into seven subdirectories, each serving a distinct domain:\n\n```\ninput/data/\n├── EEE/                    # Equipment & energy constants\n├── animal/                 # Herd, reproduction, and lactation parameters\n├── animal_health/          # Disease incidence and effect definitions\n├── config/                 # Simulation run configuration\n├── crop/                   # Crop rotation schedules\n├── crop_configurations/    # Crop species growth and harvest parameters\n└── end_to_end_testing/     # Expected results for regression testing\n```\n\n## Directory Breakdown\n\n### EEE/constants.json\n\nEquipment and energy efficiency constants used by the field operations and machinery modules. Each entry is a named constant with an ID, value, unit, and optional notes.\n\nKey constants include:\n\n| Constant | Value | Unit | Purpose |\n|---|---|---|---|\n| Field Speed | 10 | km/hr | Default field operation speed |\n| Field Efficiency | 0.9 | unitless | Proportion of field time spent working |\n| Small/Medium/Large Tractor PTO | 55.93 / 208.42 / 328.11 | kW | Tractor power ratings |\n| Small/Medium/Large Tractor Power Available | 39.95 / 148.87 / 234.36 | kW | PTO ÷ 1.4 |\n| Small/Medium/Large Tractor Mass | 8400 / 12700 / 20856 | kg | Tractor weights |\n| Tractor Speed | 10 | km/hr | Default tractor speed |\n| Conversion to kWh | 0.75 | — | Energy conversion factor |\n\nThe `Notes and remarks` field documents derivation rules (e.g., \"power available is PTO/1.4\").\n\n### animal/\n\nContains herd-level configuration files. Two full example configurations are provided — one for freestall housing and one for open-lot housing — plus supporting parameter files.\n\n#### example_freestall_animal.json / example_open_lot_animal.json\n\nThese are the primary herd configuration files. Both share the same top-level schema:\n\n- **`herd_information`** — herd composition (calf, heifer, cow counts), breed (`\"HO\"` for Holstein), parity fractions, milking cow fraction, and optional `annual_milk_yield`. The `herd_size_adjustment_period`, `herd_size_sell_threshold`, and `herd_size_buy_threshold` fields control dynamic herd-size management during simulation.\n- **`herd_initialization`** — `initial_animal_num` and `simulation_days` for the animal population warm-up.\n- **`animal_config`** — three nested blocks:\n  - **`management_decisions`** — breeding start day, reproduction method (`\"SynchED\"`, `\"TAI\"`, `\"ED\"`, `\"ED-TAI\"`), semen type, culling criteria, milking frequency, and milk composition targets.\n  - **`farm_level`** — calf management (sexed semen rates, weaning), reproduction protocols (voluntary waiting period, estrus detection rates, OvSynch programs, gestation parameters), and bodyweight distributions (birth weight by breed, mature weight).\n  - **`from_literature`** — literature-derived parameters: pregnancy check timing and loss rates, estrus cycle statistics, culling probability curves by day-in-milk, parity-specific death/cull probabilities, and stillbirth rate.\n- **`methane_mitigation`** — mitigation method (`\"None\"` or additive types) and additive amounts (3-NOP, monensin, essential oils, seaweed).\n- **`housing`** — `\"barn\"` or open-lot indicator.\n- **`methane_model`** — which methane estimation model to use per animal class (`\"Pattanaik\"` for calves, `\"IPCC\"` for heifers and cows).\n- **`ration`** — ration formulation settings: phosphorus buffer, user-input flag, formulation interval, and max reformulation attempts.\n- **`pen_information`** — array of pen definitions. Each pen specifies:\n  - `animal_combination` (`\"CALF\"`, `\"GROWING\"`, `\"CLOSE_UP\"`, `\"LAC_COW\"`)\n  - `housing_type` and `pen_type` (`\"freestall\"` vs `\"open lot\"`)\n  - `number_of_stalls`, `max_stocking_density`\n  - Distance to milking parlor (vertical/horizontal)\n  - `manure_streams` — array linking the pen to manure processing streams, each with a `stream_name`, `bedding_name`, `stream_proportion`, and `first_processor`\n  - For lactating pens: `minutes_away_for_milking`, `first_parlor_processor`, and `parlor_stream_name`\n- **`bedding_configs`** — reusable bedding definitions referenced by `manure_streams`. Each entry defines `bedding_type`, `bedding_mass_per_day`, `bedding_density`, `bedding_dry_matter_content`, `bedding_carbon_fraction`, `bedding_phosphorus_content`, and `sand_removal_efficiency`. The `\"none (no bedding)\"` entry is the zero-mass default for open-lot pens.\n\nThe freestall and open-lot examples differ primarily in herd scale, pen layout, and manure stream routing. Open-lot pens split manure across multiple streams (e.g., lot vs. feed alley) with different proportions.\n\n#### lactation_curve_adjustment_inputs.json\n\nAdjustment coefficients for the lactation curve model. The `adjustments` object contains correction factors (`l`, `m`, `n`) keyed by:\n\n- **`parity`** — parity 1, 2, 3\n- **`year`** — 2006 through 2016\n- **`month`** — 1 through 12\n- **`region`** — USDA production regions plus `\"None\"` (zero adjustment)\n- **`milking_frequency`** — `twice_daily` / `thrice_daily`\n\nThe `state_to_region_mapping` maps FIPS state codes (1–56) to the region names used above. Additional fields provide parity-based 305-day milk yield multipliers (`parity_2_305_day_milk_yield_adjustment`, `parity_3_305_day_milk_yield_adjustment`), and the mean/standard deviation of the Wood curve parameters (`parameter_l_mean`, `parameter_m_mean`, `parameter_n_mean`, plus per-parity standard deviations).\n\n#### no_animal.json\n\nA sentinel file: `{\"exclude_from_pool\": true}`. When present, it signals the input loader to exclude the animal domain entirely from the simulation (used for field-only runs).\n\n### animal_health/example_animal_health.json\n\nDefines the disease model schema. Each disease key (`disease1`, `disease2`, ...) contains:\n\n- **`incidence`** — `baseline_incidence_rate`\n- **`immediate_effects`** — short-term effects, each with a `name` (e.g., `\"milk_production_decrease\"`, `\"miscarriage_likelihood_increase\"`) and a `percent` magnitude\n- **`intermediate_effects`** — medium-term effects (e.g., `\"weightloss\"`)\n- **`lasting_effects`** — long-term effects (empty object in the example)\n- **`risk_factors`** — list of risk factor identifiers\n\nThe example file is a template; empty disease objects (`{}`) are valid and represent diseases with no modeled effects.\n\n### config/\n\nSimulation run configuration files. Each config specifies:\n\n| Field | Example Value | Purpose |\n|---|---|---|\n| `start_date` / `end_date` | `\"2013:1\"` / `\"2019:365\"` | Simulation window as `year:day` |\n| `set_seed` | `true` | Whether to use a fixed RNG seed |\n| `simulation_type` | `\"full_farm\"`, `\"animals_only\"`, `\"field_only\"`, `\"field_and_feed\"` | Which domains to simulate |\n| `nutrient_standard` | `\"NASEM\"` | Ration nutrient standard |\n| `FIPS_county_code` | `55025` | County for weather/soil data |\n| `include_detailed_values` | `false` | Output verbosity flag |\n\nThe `end_to_end_testing_*` configs are short-duration runs (one year) used by the regression test suite.\n\n### crop/\n\nCrop rotation schedule files. Each file contains a `crop_schedules` array. A schedule entry defines:\n\n- **`crop_species`** — e.g., `\"corn_grain\"`, `\"corn_silage\"`, `\"alfalfa_silage\"`, `\"alfalfa_hay\"`, `\"triticale_silage\"`\n- **`planting_years`** / **`planting_days`** — parallel arrays of planting dates\n- **`harvest_years`** / **`harvest_days`** — parallel arrays of harvest dates (multiple harvests per year for alfalfa)\n- **`harvest_operations`** — per-harvest operation type: `\"harvest_kill\"` (harvest then terminate crop), `\"harvest_only\"`, or `\"kill_only\"`\n- **`harvest_type`** — `\"scheduled\"` (the only supported value in these files)\n- **`pattern_repeat`** — number of times to repeat the rotation pattern\n- **`planting_skip`** / **`harvesting_skip`** — skip counts for staggered rotations\n\nExample rotations included:\n\n- `corn_rotation.json` — single-crop corn grain with `pattern_repeat: 10`\n- `example_alf_corn_silage_rotation.json` — 2-year corn silage / alfalfa silage rotation\n- `example_alf_hay_corn_grain_rotation.json` — 2-year corn grain / alfalfa hay rotation\n- `example_corn_silage_trit_cover_crop.json` — corn silage followed by triticale cover crop, repeated 7 times\n\n`no_crop.json` is the sentinel that excludes the crop domain.\n\n### crop_configurations/default_crop_configs.json\n\nSpecies-level growth and harvest parameters for every crop the model supports. Each crop configuration includes:\n\n- **Plant category** — `\"warm_annual\"`, `\"cool_annual\"`, `\"perennial\"`, `\"perennial_legume\"`, `\"warm_annual_legume\"`\n- **`is_nitrogen_fixer`** — legume flag\n- **Temperature and heat unit parameters** — `minimum_temperature`, `optimal_temperature`, `potential_heat_units`\n- **Growth curve points** — `first_heat_fraction_point`, `first_leaf_fraction_point`, `second_heat_fraction_point`, `second_leaf_fraction_point`, `senescent_heat_fraction`, `max_leaf_area_index`, `light_use_efficiency`\n- **Nutrient fractions** — nitrogen and phosphorus fractions at emergence, half-maturity, and maturity; plus `yield_nitrogen_fraction` and `yield_phosphorus_fraction`\n- **Root parameters** — `max_root_depth`, `root_distribution_param_da`, `root_distribution_param_c`\n- **Harvest indices** — `optimal_harvest_index`, `minimum_harvest_index`\n- **Forage quality at harvest** — `dry_matter_percentage`, `lignin_dry_matter_percentage`, `crude_protein_percent_at_harvest`, `non_protein_nitrogen_at_harvest`, `starch_at_harvest`, `adf_at_harvest`, `ndf_at_harvest`, `sugar_at_harvest`, `ash_at_harvest`\n\nSupported species: alfalfa (silage, baleage, hay), cereal rye (grain, silage, baleage, hay), corn (grain, silage), soybean (grain, hay), tall fescue (silage, baleage, hay), pasture, triticale (grain, silage, baleage, hay), and winter wheat (grain, silage, baleage, hay).\n\n`no_crop_configs.json` is the sentinel for excluding crop configurations.\n\n### end_to_end_testing/\n\nRegression test infrastructure. Contains:\n\n- **`end_to_end_testing_result_paths.json`** — maps each test scenario (`freestall_e2e`, `open_lot_e2e`, `field_and_feed_e2e`, `animals_only_e2e`) to a list of domain-level comparisons. Each comparison specifies:\n  - `domain` — `\"CropAndSoil\"`, `\"Animal\"`, `\"Manure\"`, or `\"Feed\"`\n  - `expected_results_path` — path to the JSON file with expected values\n  - `actual_results_path` — prefix of the saved-variables file produced by the run\n  - `tolerance` — acceptable relative difference (0.1 in all entries)\n- **`e2e_json_*_filter.json`** — expected results files. Each contains a `name`, a `filters` array (regex patterns like `\"Feed.*\"`, `\"Animal.*\"`, `\"CropAndSoil.*\"`), and an `expected_results` object mapping fully-qualified output variable paths to arrays of expected values. The feed filter file also includes `expected_results_last_updated` timestamps.\n- **`e2e_comparison_*_differences.json`** — comparison descriptors with a `name` and `filters` array used to select which output variables to diff.\n\n## How the Data Is Consumed\n\nThe input-loading layer reads these files at simulation startup. The general flow:\n\n```mermaid\nflowchart LR\n    A[config/*.json] --> B[Simulation Controller]\n    B --> C[Domain Loaders]\n    C --> D[Animal Loader]\n    C --> E[Crop Loader]\n    C --> F[Equipment Loader]\n    D --> G[animal/*.json]\n    D --> H[animal_health/*.json]\n    E --> I[crop/*.json]\n    E --> J[crop_configurations/*.json]\n    F --> K[EEE/constants.json]\n    B --> L[E2E Test Harness]\n    L --> M[end_to_end_testing/*.json]\n```\n\n1. A **config file** selects the `simulation_type`, which determines which domain loaders are invoked.\n2. Each domain loader reads its corresponding data files. The `exclude_from_pool` sentinel in `no_animal.json`, `no_crop.json`, and `no_crop_configs.json` tells the loader to skip that domain entirely.\n3. **Animal data** is cross-referenced: `example_*_animal.json` provides herd and pen structure, `lactation_curve_adjustment_inputs.json` provides milk curve coefficients, and `animal_health/*.json` provides disease parameters.\n4. **Crop data** pairs rotation schedules (`crop/*.json`) with species parameters (`crop_configurations/*.json`). The `crop_species` string in a schedule must match a `name` in the configurations file.\n5. **Pen manure streams** reference `bedding_name` values that must exist in the same file's `bedding_configs` array, and `first_processor` names that must be defined in the manure processing module.\n6. **EEE constants** are referenced by field operation and machinery calculations by their `Name` field.\n\n## Key Design Patterns\n\n### Sentinel Files\n\nFiles named `no_*.json` with `{\"exclude_from_pool\": true}` act as domain exclusion flags. Their presence tells the loader to skip that domain, enabling partial simulations (`field_only`, `animals_only`, `field_and_feed`).\n\n### Cross-File Referencing\n\nSeveral files reference each other by string keys:\n\n- `crop_species` in rotation schedules → `name` in crop configurations\n- `bedding_name` in pen manure streams → `name` in `bedding_configs`\n- `first_processor` in manure streams → processor names defined in the manure module\n- `state_to_region_mapping` in lactation adjustments → region keys in the `adjustments.region` object\n\nA mismatch in any of these references will fail at load time, so new scenarios must keep these keys consistent.\n\n### Parallel Arrays for Schedules\n\nCrop schedules use parallel arrays (`planting_years` / `planting_days`, `harvest_years` / `harvest_days`, `harvest_operations`) rather than objects. The index position links the entries — e.g., the third harvest of an alfalfa crop is `harvest_days[2]`, `harvest_years[2]`, `harvest_operations[2]`.\n\n### E2E Test Tolerance\n\nExpected results are compared against actual simulation output with a relative tolerance of 0.1. The `filters` arrays use regex patterns to select output variables by domain prefix, so new output variables matching an existing prefix are automatically included in the comparison.\n\n## Adding a New Scenario\n\nTo add a new simulation scenario:\n\n1. Create a config file in `config/` specifying the simulation window and type.\n2. If the scenario uses animals, create an animal JSON file (or reuse an example) with matching `pen_information` and `bedding_configs`.\n3. If the scenario uses crops, create a rotation schedule in `crop/` whose `crop_species` values exist in `crop_configurations/default_crop_configs.json`.\n4. If the scenario is a new housing type (e.g., a different open-lot layout), ensure the `first_processor` names in `manure_streams` are registered in the manure processing module.\n5. For regression testing, add an entry to `end_to_end_testing_result_paths.json` and generate expected results files.","other-input-metadata":"# Other — input-metadata\n\n# Input Metadata\n\n## Overview\n\nThe `input-metadata` module is a static, declarative metadata corpus. It contains no executable code; instead it publishes machine-readable descriptions that other parts of the pipeline consume. The module covers two distinct responsibilities:\n\n1. **Data cataloging** — mapping logical input names to physical files. Economic time series and simulation task configuration are described in `econ_metadata.json` and `available_simulations_metadata.json`.\n2. **Cross-field validation** — encoding the input configuration rules, expressed as a small rule DSL, for the animal, crop/soil, and feed-storage subsystems. The rule files describe *what* must be true of a valid run; a consumer evaluates them against the user configuration.\n\nBecause the module is data rather than code, the documentation below is a contract for the runtime that interprets it.\n\n## Module Layout\n\n```text\ninput/metadata/\n├── EEE/\n│   └── econ_metadata.json                    # economic CSV definitions\n├── available_simulations_metadata.json       # simulation task definition\n└── cross_validation/\n    ├── animal_cross_validation.json\n    ├── corn_alf_silage_cross_validation.json\n    ├── corn_cross_validation.json\n    ├── corn_grain_alf_hay_cross_validation.json\n    ├── corn_silage_cover_crop_cross_validation.json\n    ├── crop_and_soil_cross_validation.json\n    └── feed_storage_cross_validation.json\n```\n\nNone of these files make calls to other modules, and no execution flow originates here. They are ingested at configuration or validation time.\n\n## Economic Data Catalog\n\n**File:** `input/metadata/EEE/econ_metadata.json`\n\nThe file is a single `files` map. Each key is a logical identifier for an economic input series; each value describes that series.\n\n```json\n{\n  \"files\": {\n    \"commodity_prices.milk_class_3.dollar_per_liter\": {\n      \"title\": \"Commodity prices\",\n      \"description\": \"Class 3 Milk (Used for cheese production)\",\n      \"path\": \"input/data/EEE/econ/commodity_prices.milk_class_3.dollar_per_liter.csv\",\n      \"type\": \"csv\",\n      \"properties\": \"commodity_prices_milk_class_3_dollar_per_liter_csv_properties\"\n    }\n  }\n}\n```\n\n### Entry fields\n\n| Field | Purpose |\n|---|---|\n| `title` | Human-readable grouping label (e.g., `\"Feed prices\"`, `\"Cattle\"`). For a few entries the title is intentionally empty `\"\"`. |\n| `description` | Unambiguous semantics — a price for the same commodity with a different unit appears twice, so the description is the authority on meaning. |\n| `path` | Location of the data file, relative to the repository root. |\n| `type` | Format of the data file; all econ entries are `\"csv\"`. |\n| `properties` | Take the identifier of the column/parsing specification for this CSV (e.g., `\"commodity_prices_milk_class_3_dollar_per_liter_csv_properties\"`). The actual property definitions live outside this file. |\n\n### Logical identifier conventions\n\nIdentifiers follow a dotted `<domain>.<item>.<unit>` form so the unit is part of the key:\n\n| Domain | Examples |\n|---|---|\n| `commodity_prices.*` | crop, feed, bedding, cattle, milk, fertilizer, energy, semen, water prices |\n| `capital_costs.*` | land value per hectare |\n| `farm_services.*` | labor, machinery, land-rent, grain transport |\n\nImportant distinctions encoded in the identifiers and descriptions:\n\n- Price basis: `dollar_per_kilogram`, `dollar_per_liter`, `dollar_per_head`, `dollar_per_square_meter`, `dollar_per_animal`, `dollar_per_straw`, `dollar_per_tonne_CO2e`, `dollar_per_megajoule`, `dollar_per_cubic_meter`, `dollar_per_kwh`, `dollar_per_hour`, `dollar_per_hectare`, `dollars_per_tonne_km` — always preserve these units.\n- Milk classes: `milk_all`, `milk_class_2`, `milk_class_3`, `milk_class_4`, `milk_nonfat_dry`, `milk_retail`.\n- Fertilizer nutrient series are prefixed `net_fertilizer_`, and the duplicate `anhydrous-ammonia`/`anhydrous_ammonia` files both exist.\n- `_default_values` is special: it is the fallback series for \"localized economic data is unavailable.\n\nIdentifiers are manually curated; the catalog contains an entry `commodity_prices.calf_ heifer_2.dollar_per_kilogram` (with a space between `calf_` and `heifer`), so consumers should treat identifiers as opaque.\n\n## Simulation Task Metadata\n\n**File:** `input/metadata/available_simulations_metadata.json`\n\nA one-entry catalog defining the general simulation parameter file:\n\n```json\n{\n  \"files\": {\n    \"tasks\": {\n      \"title\": \"Task manager data\",\n      \"description\": \"Configuration file for general simulation parameters.\",\n      \"path\": \"input/data/tasks/available_simulation_tasks.json\",\n      \"type\": \"json\",\n      \"properties\": \"tasks_properties\"\n    }\n  }\n}\n```\n\nThe schema mirrors the econ catalog entry, except `\"type\": \"json\"`. The `path` points to the actual tasks configuration consumed at run time.\n\n## Cross-Validation Metadata\n\nThe files under `cross_validation/` define **cross-field invariants** of a correct simulation configuration. They matter because individual configuration keys may be locally valid; its combination can be impossible or contradictory (e.g., a gestation shorter than the dry period, or a crop schedule where planting and harvest arrays are not the same length). Each file scopes its rules to a subsystem:\n\n| File | Scope |\n|---|---|\n| `animal_cross_validation.json` | herd, reproduction, bodyweight, culling, and parity |\n| `crop_and_soil_cross_validation.json` | crop configs, field watering, soil layers, manure daily spreading |\n| `corn_cross_validation.json` | corn schedule |\n| `corn_alf_silage_cross_validation.json` | corn-alfalfa-silage schedules |\n| `corn_grain_alf_hay_cross_validation.json` | corn-grain/alfalfa-hay schedules |\n| `corn_silage_cover_crop_cross_validation.json` | corn-silage/cover-crop schedules |\n| `feed_storage_cross_validation.json` | feed storage configuration |\n\n### Rule File Shape\n\n```json\n{\n  \"cross_validation\": [\n    {\n      \"description\": \"…\",\n      \"aliases\": { \"variables\": { \"…\": \"…\" }, \"constants\": { \"…\": … } },\n      \"apply_when\": [ \"…condition…\" ],\n      \"rules\": [\n        {\n          \"left_hand\": { \"…\" },\n          \"right_hand\": { \"…\" },\n          \"relationship\": \"…\"\n        }\n      ]\n    }\n  ]\n}\n```\n\n### Aliases\n\nEach validation entry aliases short variable names to configuration paths. A value such as:\n\n```json\n\"avg_gestation_len\": \"animal.animal_config.farm_level.repro.avg_gestation_len\"\n```\n\nresolves `avg_gestation_len` against the user configuration at the dotted path. Constant aliases also exist in the same `aliases` object:\n\n```json\n\"constants\": { \"one\": 1.0, \"ED\": \"ED\", \"true_constant\": true }\n```\n\nNumeric `boolean` constants are used in rules like `\"is_null\"` / `\"is_not_null\"` checks, where the right-hand side is only a marker and isn't compared numerically (e.g., `relationship: \"is_not_null\"` with `operands: [\"true_constant\"]`).\n\n### Expressions\n\nExpressions appear as `left_hand` and `right_hand` of a rule.\n\n**Aggregation expressions** wrap one or more operands:\n\n```json\n{\n  \"aggregation\": {\n    \"operation\": \"no_op\",\n    \"operands\": [\"avg_gestation_len\"]\n  }\n}\n{\n  \"aggregation\": {\n    \"operation\": \"sum\",\n    \"operands\": [\"p1\", \"p2\", \"p3\", \"p4\", \"p5\"]\n  }\n}\n{\n  \"aggregation\": {\n    \"operation\": \"product\",\n    \"operands\": [\"twenty_percent\", \"birth_weight_avg_ho\"]\n  }\n}\n{\n  \"aggregation\": {\n    \"operation\": \"difference\",\n    \"operands\": [\"avg_gestation_len\", \"days_in_preg_when_dry\"]\n  }\n}\n```\n\nSupported operations: `no_op`, `sum`, `product`, `difference`.\n\n**Element-wise mode.** When fields are arrays (for example, yearly planting/harvest arrays shared across a crop schedule, or per-day culling distributions), the expression often uses:\n\n```json\n\"aggregation\": { \"operation\": \"no_op\", \"mode\": \"element_wise\", \"operands\": [\"planting_years\"] }\n```\n\nThe same mode appears on both sides consistently; the relationship should then read as an element-wise or length check (e.g., `is_equal_length`).\n\n**`for_each` expressions.** Two modes are used:\n\n- `\"mode\": \"enforce\"` — iterate over a collection and assert a pair of fields in each element satisfies the given relationship. Used for constraint ordering across soil layers and crop configs, e.g. field capacity ≥ wilting point.\n- `\"mode\": \"filter\"` — select a collection subset and assert membership. Used by the daily-spread rule to require a `DailySpread` processor in `manure_management.storage`.\n\n### Conditions\n\n`apply_when` is an optional list of conditions. If present, the rule gets applied only when *all* conditions hold. Conditions reuse the same expression/relationship structure (e.g., the repro method with `\"ED\", \"ED-TAI\"`).\n\n### Relationships\n\n| Relationship | Meaning |\n|---|---|\n| `equal` | operands (or aggregate of operands) equal |\n| `greater` | left > right |\n| `greater_or_equal_to` | left ≥ right |\n| `is_in` | arrays/values containment |\n| `is_null`, `is_not_null` | null-marker check |\n| `is_equal_length` | array/vector equality of lengths |\n\n### Two Representative Rules\n\n**1. Cull-assignment distributions must be the same length as cull day count** — ensures that uniform probabilities distributed across cull days:\n\n```json\n{\n  \"relationship\": \"is_equal_length\",\n  \"left_hand\": { \"aggregation\": { \"operation\": \"no_op\", \"mode\": \"element_wise\", \"operands\": [\"cull_day_count\"] } },\n  \"right_hand\": { \"aggregation\": { \"operation\": \"no_op\", \"mode\": \"element_wise\", \"operands\": [\"death_day_prob\"] } }\n}\n```\n\n**2. Repro method selects sub-protocol options** — condition on the chosen method, then require a matching sub-protocol:\n\n```json\n{\n  \"description\": \"When heifer repro method is SynchED, repro_sub_protocol must be in [2P, CP]\",\n  \"apply_when\": [ { \"…\": \"heifer_repro_method == SynchED\" } ],\n  \"rules\": [ { \"…\": \"heifer_repro_sub_protocol in ['2P','CP']\" } ]\n}\n```\n\n### Cross-Validation Coverage by Example\n\nThe rule catalog encodes domain statements such as:\n\n- Sum of parity fractions for animals must equal `1.0`.\n- `days_in_preg_when_dry < avg_gestation_len`.\n- For an Ear Detection (ED) protocol, the `do_not_breed_time` must be greater than the voluntary waiting period.\n- Holstein birth-weight standard deviation may not exceed 20% of the mean birth weight.\n- Pregnancy check days must be strictly ascending, and the final check must occur before both calving and dry-off.\n- Culling reason probabilities sum to `1.0`.\n- Corn and alfalfa scheduling groups: planting_years / planting_days and harvest_years / harvest_days arrays must have equal length for each schedule index.\n- On every crop config: `optimal_temperature ≥ minimum_temperature`, `optimal_harvest_index ≥ minimum_harvest_index`.\n- Fields involved in irrigation: either everything is zero (no irrigation) or both interval and amount are positive.\n- Each soil layer ordering: `wilting_point ≤ field capacity ≤ saturation`.\n- With no direct animals, `tractor_size` must be introduced for each field.\n- Daily spreading requires a `DailySpread` manure storage entry.\n\n## How The Module Connects To The Codebase\n\n```mermaid\nflowchart LR\n    CFG[user configuration]\n    CV[cross_validation/*.json]\n    ECON[econ_metadata.json]\n    CSV[(data/EEE/econ/*.csv)]\n    SIM[available_simulations_metadata.json]\n    TASK[(data/tasks/available_simulation_tasks.json)]\n```\n\n- `cross_validation/*.json` rules are evaluated **against a complete user configuration**. The dotted variable paths are all config paths: `config.simulation_type`, `animal.herd_information.parity_fractions`, `field_1.tractor_size`, `soil_2.soil_layers`, `manure_management.storage`, and the stationary crop schedule stores co-located like `Corn.crop_schedules.0.*`. bly one of many modules. Mention \"Other\" can be excluded. Title \"Input metadata\" is fine.\n\nNeed to ensure the code names are correct: e.g., `commodity_prices.calf_ heifer_2.dollar_per_kilogram` includes the space. I'll mention that to be accurate. Good.\n\nAlso the `_default_values` path is alongside `input/data/EEE/econ/_default_values.csv`. Good.\n\nWrite now# Input Metadata\n\n## Overview\n\nThis module is a **static, declarative metadata catalog**. It defines no executable code or runtime calls; instead it describes the data and rules other components rely on. It has two distinct responsibilities:\n\n1. **File cataloging** — mapping logical data names to physical files (economic CSV inputs, simulation task configuration).\n2. **Cross-field validation** — a rule-based description of valid input configurations, used to validate the user-supplied configuration before a simulation run proceeds.\n\nThe files are designed to be consumed at configuration time and validation time. Consumers must be tolerant of manually authored identifiers and should treat each file as a contract, not as an implementation.\n\n## Module Layout\n\n```\ninput/metadata/\n├── EEE/\n│   └── econ_metadata.json                  # Economic CSV definitions\n├── available_simulations_metadata.json     # Task/simulation configuration file\n└── cross_validation/\n    ├── animal_cross_validation.json\n    ├── corn_alf_silage_cross_validation.json\n    ├── corn_cross_validation.json\n    ├── corn_grain_alf_hay_cross_validation.json\n    ├── corn_silage_cover_crop_cross_validation.json\n    ├── crop_and_soil_cross_validation.json\n    └── feed_storage_cross_validation.json\n```\n\n---\n\n## Economic Data Catalog\n\n**File:** `input/metadata/EEE/econ_metadata.json`\n\nThis file is a map of logical data identifiers to CSV file descriptions. Each entry describes one economic input series; the CSV files themselves are used to look up values (e.g., prices, labor, land rent) at runtime.\n\nEach key in `files` is a dotted identifier, such as `commodity_prices.milk_class_3.dollar_per_liter`. The value is an object:\n\n```json\n{\n  \"files\": {\n    \"commodity_prices.milk_class_3.dollar_per_liter\": {\n      \"title\": \"Commodity prices\",\n      \"description\": \"Class 3 Milk (Used for cheese production)\",\n      \"path\": \"input/data/EEE/econ/commodity_prices.milk_class_3.dollar_per_liter.csv\",\n      \"type\": \"csv\",\n      \"properties\": \"commodity_prices_milk_class_3_dollar_per_liter_csv_properties\"\n    }\n  }\n}\n```\n\n### Entry Fields\n\n| Field | Purpose |\n|---|---|\n| `title` | Human-readable grouping label (e.g., `\"Feed prices\"`, `\"Cattle\"`, `\"Fertilizer\"`, `\"Machinery\"`). Some entries have an intentionally empty title (`\"\"`). |\n| `description` | The authoritative semantic explanation of the series, including units and meaning. |\n| `path` | Physical path to the CSV file, relative to the repository root. |\n| `type` | File format. All entries are CSV. |\n| `properties` | Identifier of the column/parsing schema for this CSV. The definition itself lives in a CSV properties registry, referenced by this key (e.g., `commodity_prices_cartesian_..._csv_properties`). |\n\n### Identifier Conventions\n\nIdentifiers encode the **measure** in their suffix:\n\n- `dollar_per_kilogram` — mass-based commodity/feed prices\n- `dollar_per_liter` — milk, water, gasoline, propane\n- `dollar_per_head` — bedding and animal-labor costs\n- `dollar_per_animal` — purchased/sold animal values\n- `dollar_per_tonne_CO2e` — carbon credit prices\n- `dollar_per_kwh` / `dollar_per_megajoule` — energy\n- `dollar_per_square_meter` — seed prices\n- `dollar_per_hour`, `dollar_per_hectare`, `dollars_per_tonne_km`, `dollars_per_kg_bedding`, `hours_per_head_per_year` — farm services\n\n### Notable Details\n\n- `_default_values` is a fallback series used when localized data is unavailable.\n- Cattle prices are divided by category: calves, heifers, steers (by weight class), cows, dairy bred, milk cows.\n- Milk is broken out into classes (`milk_class_2`, `milk_class_3`, `milk_class_4`) as well as `milk_all` and `milk_retail`.\n- Fertilizer entries use the `net_fertilizer_` prefix and include both hyphenated and underscore variants for anhydrous ammonia (e.g., `anhydrous-ammonia` and `anhydrous_ammonia`).\n- The identical identifier-in-whitespace is not accidental; `commodity_prices.calf_ heifer_2.dollar_per_kilogram` has a space after `calf_`. Consumers should treat identifiers as opaque strings.\n\n---\n\n## Simulation Task Metadata\n\n**File:** `input/metadata/available_simulations_metadata.json`\n\nA minimal catalog describing the general simulation parameters file:\n\n```json\n{\n  \"files\": {\n    \"tasks\": {\n      \"title\": \"Task manager data\",\n      \"description\": \"Configuration file for general simulation parameters.\",\n      \"path\": \"input/data/tasks/available_simulation_tasks.json\",\n      \"type\": \"json\",\n      \"properties\": \"tasks_properties\"\n    }\n  }\n}\n```\n\nThe structure is identical to the econ catalog, except the `type` is `json` and the path points to the runtime task configuration.\n\n---\n\n## Cross-Validation Rules\n\nThe files under `cross_validation/` define **rules about the user's configuration data** — not implementation logic. They describe which configurations are internally consistent, and would be consumed by a validation engine after the configuration is loaded but before a simulation is run.\n\n### Scope of Each File\n\n| File | Validates |\n|---|---|\n| `animal_cross_validation.json` | Animal reproduction, body weight, animal culling, parity, and pregnancy-timing constraints |\n| `crop_and_soil_cross_validation.json` | Crop temperature/harvest settings, watering, soil-layer ordering, field equipment, and manure-spreading schedules |\n| `corn_cross_validation.json` | Corn schedule consistency (planting and harvest arrays) |\n| `corn_alf_silage_cross_validation.json` | All crop schedules for the corn-and-alfalfa-silage system |\n| `corn_grain_alf_hay_cross_validation.json` | All crop schedules for the corn-grain-and-alfalfa-hay system |\n| `corn_silage_cover_crop_cross_validation.json` | All crop schedules for the corn-silage and cover-crop system |\n| `feed_storage_cross_validation.json` | Feed-storage invariants (e.g., hay dry-matter targets) |\n\n### Rule File Schema\n\nEach file has a top-level key, `cross_validation`, which is an array of rule entries.\n\n```json\n{\n  \"cross_validation\": [\n    {\n      \"description\": \"…\",\n      \"aliases\": {\n        \"variables\": {\n          \"p1\": \"animal.herd_information.parity_fractions.1\"\n        },\n        \"constants\": {\n          \"one\": 1.0\n        }\n      },\n      \"apply_when\": [\n        {\n          \"left_hand\": { \"aggregation\": { \"operation\": \"no_op\", \"operands\": [\"…\"] } },\n          \"right_hand\": { \"aggregation\": { \"operation\": \"no_op\", \"operands\": [\"…\"] } },\n          \"relationship\": \"is_in\"\n        }\n      ],\n      \"rules\": [\n        {\n          \"left_hand\": {\n            \"aggregation\": {\n              \"operation\": \"sum\",\n              \"operands\": [\"p1\", \"p2\", \"p3\", \"p4\", \"p5\"]\n            }\n          },\n          \"right_hand\": {\n            \"aggregation\": {\n              \"operation\": \"no_op\",\n              \"operands\": [\"one\"]\n            }\n          },\n          \"relationship\": \"equal\"\n        }\n      ]\n    }\n  ]\n}\n```\n\n### Rule Entry Structure\n\n- **`description`** — Human-readable explanation of the invariant. Used for diagnostics and auditability.\n- **`aliases`** — Two sub-maps:\n  - `variables`: maps a short name to a dotted path in the user’s configuration tree (e.g., `\"animal.animal_config.farm_level.repro.avg_gestation_len\"`).\n  - `constants`: maps a short name to a literal comparison value (number, string, array, or boolean). Several rules use `true_constant` as a sentinel for null-checks.\n- **`apply_when`** — An optional list of conditions. The rule is *active* only when all conditions evaluate. This allows method/protocol-specific validation.\n- **`rules`** — A list of assertions. Each rule contains `left_hand`, `right_hand`, and a `relationship` operator. A rule passes when the left-hand side relates to the right-hand side in the specified way.\n\n### Expressions\n\nExpressions appear in `left_hand` or `right_hand`. Three expression forms exist:\n\n#### 1. Aggregation\n\n```json\n{\n  \"aggregation\": {\n    \"operation\": \"no_op\",\n    \"operands\": [\"avg_gestation_len\"]\n  }\n}\n```\n\nSupported operations include:\n\n- `no_op` — a direct operand value (possibly a list)\n- `sum` — sum of all operands\n- `product` — product of all operands\n- `difference` — first operand minus the second\n\n#### 2. Element-Wise Aggregation\n\nWhen an operand is an array (e.g., a schedule of planting years), the expression may be marked `\"element_wise\"`:\n\n```json\n{\n  \"aggregation\": {\n    \"operation\": \"no_op\",\n    \"mode\": \"element_wise\",\n    \"operands\": [\"planting_years\"]\n  }\n}\n```\n\nWith `element_wise`, relationships compare corresponding elements or — when paired with `is_equal_length` — compare only the lengths of the operand arrays.\n\n#### 3. `for_each` (Collection Validation)\n\n```json\n{\n  \"for_each\": {\n    \"mode\": \"enforce\",\n    \"in\": \"crop_configurations\",\n    \"field\": \"optimal_temperature\",\n    \"field_to_compare\": \"minimum_temperature\",\n    \"relationship\": \"greater_or_equal_to\"\n  }\n}\n```\n\nTwo modes are used:\n\n- `enforce` — assert that inside collection, for every element, `field`’s relationship to `field_to_compare` holds.\n- `filter` — filter the collection, then assert membership. For example, select all manure storage elements whose `processor_type` equals `DailySpread`, then require that a `DailySpread` processor exists (`is_in`).\n\n### Relationship Operators\n\n| Operator | Meaning |\n|---|---|\n| `equal` | left == right |\n| `greater` | left > right |\n| `greater_or_equal_to` | left >= right |\n| `is_in` | left is contained in the right-hand set |\n| `is_null` | left is null |\n| `is_not_null` | left is not null |\n| `is_equal_length` | left and right arrays have equal length |\n\n### Condition Gate (`apply_when`)\n\n`apply_when` can be used to make a rule dependent on another part of the config. For example:\n\n- When `cow_repro_method` is `ED` or `ED-TAI`\n- When `simulation_type` is `field_only` or `field_and_feed`\n- When a certain manure management flag is `true`\n\nOnly if all `apply_when` conditions pass should the validator apply the entries’ `rules`. Note that `apply_when` entries reuse the same expression structure.\n\n### Rules in Practice\n\nThe `animal_cross_validation.json` file shows rules like:\n\n- Sum of parity fractions equals `1.0`.\n- Dry-off before calving: `days_in_preg_when_dry < calving_gestation_interval`.\n- Heifer culling must start after breeding starts.\n- Estrus-detection (`ED`) protocols require the waiting period and detection rate to be positive; timed-AI (`TAI`) protocols require an ovsynch program.\n- Pregnancy check days are increasing and occur before both calving and dry-off.\n- Sum of all cull reason probabilities equals `1.0`.\n- The lengths of `cull_day_prob` arrays must equal the length of `cull_day_count` arrays.\n\nSimilarly, the crop/soil rules include checks that:\n\n- Watering amount must be `0` if watering interval is `0`, and `interval > 0` if the amount is positive.\n- Soil layers obey `wilting_point ≤ field_capacity_vertical ≤ saturation`.\n- When simulating a field-only or field-and-feed system, `tractor_size` is required on each field.\n- Daily spreading requires a `DailySpread` manure storage; `spread_all_available_manure` requires daily spreading.\n\nThe crop-schedule files uniformly enforce **equal length of year/day arrays** for planting and harvest.\n\n---\n\n## How This Module Fits Into the Codebase\n\n```mermaid\nflowchart LR\n    CFG[User configuration]\n    CV[cross_validation/*.json]\n    EP[econ_metadata.json]\n    SIM[available_simulations_metadata.json]\n\n    CFG --> VAL[validation runtime]\n    CV --> VAL\n    VAL --> PASS[allowed / rejected]\n\n    EP --> RW[economic data install]\n    DATA[(input/data/EEE/econ/*.csv)]\n    DATA --> RW\n\n    SIM --> TASKS[available_simulation_tasks.json]\n```\n\n- **The validation runtime** is the consumer of `cross_validation/*.json`. It reads the `aliases`, resolves them against the user-config tree, evaluates the `rules`, and reports failures using the entry descriptions.\n- **The economic loader** is the consumer of `econ_metadata.json`. It uses `path` to find the CSV and its `properties` reference to interpret the columns.\n- **The simulation renderer task** stays separate: `available_simulations_metadata.json` points to the actual JSON parameters it uses for a task run.\n\nBecause this module is data-only, modifying it does not affect runtime logic by itself — but it does change the contract that downstream loaders and validators must honor.\n\n## Contributing a New Entry\n\nWhen adding a new rule or catalog entry:\n\n1. Ensure the `description` is self-explanatory; it will be used directly in diagnostics.\n2. Prefer unique identifiers; do not rely on whitespace in identifiers.\n3. For cross-validation entries, expose the configuration path(s) via `aliases.variables` and all constants via `aliases.constants`.\n4. Use `apply_when` only when the rule is conditional on another configuration value; adding it affects “default” rules.\n5. For new feed or crop schedule, list the rule in the corresponding crop-schedule metadata file.\n6. For new econ series, use the existing `domain.item.unit` naming convention and set the `title` to an existing group whenever possible, since it is used for aggregation.","other-input":"# Other — input\n\n# Other — Input Module\n\n##
