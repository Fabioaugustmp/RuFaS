.\n- **End-to-end testing** — `OutputManager` supports an end-to-end testing mode (`is_end_to_end_testing_run`) that swaps filter prefixes to `e2e_json_` / `e2e_comparison_`, and `is_first_post_processing` tracks which filters apply during successive post-processing runs.\n\n## Error handling patterns\n\nThe module consistently uses the `OutputManager` as the logging sink:\n\n- Every public method builds an `info_map` with `class` and `function` keys for provenance.\n- Errors are logged via `om.add_error()` before exceptions are raised, so the error pool contains a complete record even when an exception propagates.\n- `data_validator.event_logs` are routed to the `OutputManager` via `om.route_logs()` after validation phases.\n- File loading methods (`_load_data_from_json`, `_load_data_from_csv`, `_load_cross_validation`, `_load_properties`) catch `FileNotFoundError`, `json.JSONDecodeError`, and `pd.errors` variants, log them, and re-raise.","manure":"# Manure\n\n# Manure Module\n\n## Overview\n\nThe Manure module simulates the complete on-farm manure management system: collection from animal housing, processing through a configurable network of handlers, digesters, separators, and storages, and eventual application to fields as fertilizer. It is the biophysical counterpart to the animal and crop/soil modules, receiving daily manure streams from animals and fulfilling nutrient requests from fields.\n\nThe module is built around a directed graph of **processors**. Each processor receives a `ManureStream`, transforms it (adding water, destroying volatile solids, emitting gases), and passes it downstream. The graph topology is defined in configuration files and validated at startup.\n\n## Architecture\n\n```\n┌─────────────────────────────────────────────────────────────────────┐\n│                         ManureManager                               │\n│                                                                     │\n│  ┌─────────────┐  ┌──────────────┐  ┌───────────────────────────┐  │\n│  │ Processor   │  │ Adjacency    │  │ Topological sort          │  │\n│  │ registry    │  │ matrix       │  │ (processing order)        │  │\n│  └─────────────┘  └──────────────┘  └───────────────────────────┘  │\n│                                                                     │\n│  ┌─────────────────────────────────────────────────────────────┐   │\n│  │ run_daily_update()                                          │   │\n│  │  • receive manure from animal module                        │   │\n│  │  • process each processor in topological order              │   │\n│  │  • route outputs to downstream processors                   │   │\n│  └─────────────────────────────────────────────────────────────┘   │\n│                                                                     │\n│  ┌─────────────────────────────────────────────────────────────┐   │\n│  │ request_nutrients()                                         │   │\n│  │  • fulfill field nutrient requests from storage pools       │   │\n│  │  • handle daily-spread and supplemental manure paths        │   │\n│  └─────────────────────────────────────────────────────────────┘   │\n└─────────────────────────────────────────────────────────────────────┘\n                              │\n        ┌─────────────────────┼──────────────────────┐\n        ▼                     ▼                      ▼\n   ┌─────────┐          ┌──────────┐           ┌──────────┐\n   │ Handler │          │ Digester │           │ Storage  │\n   │         │          │          │           │          │\n   │ • Manual│          │ • Conti- │           │ • Anaero-│\n   │   Scraper│         │   nuous  │           │   bic    │\n   │ • Alley │          │   Mix    │           │   Lagoon │\n   │   Scraper│         │   (CSTR) │           │ • Slurry │\n   │ • Flush │          │          │           │   Outdoor│\n   │   System│          │          │           │ • Slurry │\n   │ • Parlor│          │          │           │   Under- │\n   │   Clean-│          │          │           │   floor  │\n   │   ing   │          │          │           │ • Bedded │\n   │         │          │          │           │   Pack   │\n   │         │          │          │           │ • Compost│\n   │         │          │          │           │ • Open   │\n   │         │          │          │           │   Lot    │\n   │         │          │          │           │ • Daily  │\n   │         │          │          │           │   Spread │\n   └─────────┘          └──────────┘           └──────────┘\n        │                      │                      │\n        └──────────────────────┼──────────────────────┘\n                               ▼\n                        ┌────────────┐\n                        │ Separator  │\n                        │ (optional) │\n                        └────────────┘\n```\n\n## Core Components\n\n### `ManureManager`\n\nThe `ManureManager` is the module's entry point and orchestrator. It is constructed once per simulation with weather-derived temperature parameters (`intercept_mean_temp`, `phase_shift`, `amplitude`).\n\n**Initialization sequence:**\n\n1. **Load configuration** — reads `manure_management` and `manure_processor_connection` from the `InputManager`.\n2. **Validate processor definitions** — checks for duplicate names and unknown references.\n3. **Instantiate processors** — uses `ProcessorType.get_processor_class()` to map config `processor_type` strings to concrete classes. Temperature-sensitive storages (`AnaerobicLagoon`, `SlurryStorageOutdoor`) receive the weather parameters.\n4. **Build adjacency matrix** — a `dict[str, dict[str, float]]` mapping each origin (processor or separator output port) to destination processors with flow proportions. Separators get three rows: `{name}_input`, `{name}_solid_output`, `{name}_liquid_output`.\n5. **Validate the matrix** — rejects self-loops and columns whose proportions do not sum to 0 or 1.\n6. **Topological sort** — merges separator rows, computes in-degrees, and runs Kahn's algorithm to produce a valid processing order. Cycles raise a `ValueError`.\n\n**Daily update** (`run_daily_update`):\n\n1. Receives a `dict[str, ManureStream]` from the animal module. Each stream carries `pen_manure_data.first_processor`, naming the processor that should receive it.\n2. Dispatches each stream to its first processor via `receive_manure()`.\n3. Iterates processors in topological order, calling `process_manure()` on each.\n4. Routes each output stream to downstream destinations, splitting streams when a connection proportion is not 1.0.\n5. Rebuilds the aggregated nutrient pools for field application.\n\n**Nutrient requests** (`request_nutrients`):\n\nThe crop/soil module calls this method to obtain manure for field application. The method supports three paths:\n\n- **`spread_all_available_manure`** — pools everything in `DailySpread` storages and clears them.\n- **`use_daily_spread_source`** — fulfills the request from `DailySpread` storages only, using a temporary `ManureNutrientManager` so the farm-wide pool is untouched.\n- **Default** — fulfills from the aggregated stored-manure pool via `ManureNutrientManager.handle_nutrient_request()`.\n\nAfter a request is fulfilled, `_remove_nutrients_from_storage()` draws down the matching storages proportionally. The limiting nutrient (nitrogen or phosphorus) determines the removal proportion; non-limiting nutrients are removed at the same proportion. If the request cannot be fully met and `use_supplemental_manure` is set, the shortfall is sourced from `FieldManureSupplier`.\n\n### `Processor` (base class)\n\nAll manure processors inherit from `Processor`. It provides:\n\n- `check_manure_stream_compatibility()` — validates that a stream is non-empty and has valid `pen_manure_data`.\n- `_report_manure_stream()` / `_report_processor_output()` — write daily outputs to the `OutputManager`.\n- `_calculate_ammonia_emissions()` — shared ammonia emission calculation used by handlers and storages.\n- `_determine_barn_temperature()` — converts ambient temperature to barn temperature.\n\n### `Handler`\n\nHandlers represent manure collection at the housing level. The base `Handler` class implements the common processing logic:\n\n1. Computes cleaning water volume (`determine_handler_cleaning_water_volume`), which depends on handler type and whether a parlor flush is used.\n2. Determines barn temperature from ambient conditions.\n3. Calculates ammonia emissions for pen-based handlers (`ManualScraper`, `AlleyScraper`, `FlushSystem`) using a resistance model.\n4. Adds cleaning water and milking water to the manure stream.\n5. Subtracts ammonia-N from the nitrogen pools.\n6. Emits the processed stream with `pen_manure_data` set to `None` (housing data is no longer needed downstream).\n\nTwo concrete handler subclasses exist:\n\n- **`SingleStreamHandler`** — base for handlers that accept exactly one stream per day. Raises `ValueError` if a second stream arrives. Adds housing CO₂ and CH₄ emissions (temperature- and surface-area-dependent) and applies volatile-solid loss proportional to methane emissions.\n- **`ParlorCleaningHandler`** — accepts multiple streams (accumulates them via `+=`), reports zero CO₂/CH₄ housing emissions, and adds fresh water used for milking.\n\n### `Digester`\n\nThe `Digester` base class is a thin marker subclass of `Processor`. The only concrete implementation is `ContinuousMix`, a continuously-stirred tank reactor (CSTR) anaerobic digester.\n\n**Processing flow** (`process_manure`):\n\n1. If no manure was received, reports zero outputs and returns an empty dict.\n2. Increases ammoniacal nitrogen by `TAN_INCREASE_FACTOR` (capped at total nitrogen).\n3. Calculates generated methane mass and volume using the CSTR equation:\n\n   ```\n   methane_volume = total_volatile_solids × methane_production_potential\n   ```\n\n   Methane density is computed from the ideal gas law at the digester's temperature set point.\n\n4. Calculates generated CO₂ from the methane volume using the volumetric ratio `CO₂:CH₄ = 4:6`.\n5. Destroys volatile solids proportional to the combined gas mass, distributing the loss across degradable, non-degradable, and bedding non-degradable VS pools.\n6. Computes methane leakage (a configurable fraction of generated methane) and captured biogas/methane volumes.\n7. Reports outputs (`captured_biogas_volume`, `captured_methane_volume`, `methane_leakage_mass`) and returns the digested manure stream.\n\nThe `_destroy_volatile_solids` method guards against over-destruction: if the calculated destruction exceeds available VS, it logs an error and zeroes all VS pools rather than producing negative values.\n\n### `Storage`\n\nStorage processors accumulate manure over time and are the source for field application. The module includes:\n\n| Class | Manure type | Notes |\n|---|---|---|\n| `AnaerobicLagoon` | Liquid | Temperature-modelled via sine wave; minimum temperature 1°C |\n| `SlurryStorageOutdoor` | Liquid | Minimum temperature −20°C |\n| `SlurryStorageUnderfloor` | Liquid | Uses barn temperature |\n| `BeddedPack` | Solid | Tilled/untilled bedding options |\n| `Composting` | Solid | Static pile or windrow; MCF depends on temperature |\n| `OpenLot` | Solid | MCF from IPCC regression |\n| `DailySpread` | Solid | Manure available for immediate field application |\n\nLiquid storages share methane emission logic in the `Storage` base class, using an Arrhenius temperature response:\n\n```\nmethane_emission = VS × exp(ln(A) − Ea / (R × T))\n```\n\nAmmonia emissions from storage use a resistance model with `STORAGE_RESISTANCE` and a default pH of 7.5.\n\n### `Separator`\n\nSeparators split a manure stream into solid and liquid fractions. They are special in the graph: a separator has three ports (`_input`, `_solid_output`, `_liquid_output`), and the adjacency matrix tracks them separately. The topological sort merges these into a single node for ordering, but routing at runtime uses the individual ports.\n\n### `ManureConstants`\n\nA central constants class covering:\n\n- Manure densities (liquid, slurry, solid)\n- Handler parameters (housing resistance constant, default pH, milking water rate)\n- Digester parameters (molar masses, CO₂:CH₄ ratio, TAN increase factor)\n- Storage parameters (VS-to-methane loss ratio, activation energy, Arrhenius constant, storage resistance)\n- Solid storage parameters (MCF values, emission coefficients, decomposition rates)\n- Temperature modelling parameters (damping factor, lag, minimum temperatures)\n\n## Data Structures\n\n### `ManureStream`\n\nThe core data object flowing through the system. Fields include:\n\n- `water`, `ammoniacal_nitrogen`, `nitrogen`, `phosphorus`, `potassium`\n- `ash`, `degradable_volatile_solids`, `non_degradable_volatile_solids`, `bedding_non_degradable_volatile_solids`\n- `volume`, `total_solids`, `methane_production_potential`\n- `pen_manure_data` — housing metadata (animal count, surface area, urine mass, first processor); set to `None` once manure leaves the housing system\n\nThe class supports `+=` accumulation and `split_stream(proportion)` for routing.\n\n### `ManureNutrients`\n\nAggregated nutrient pool used for field application requests. Tracks nitrogen, phosphorus, potassium, total mass, and dry matter for a given `ManureType`.\n\n## Configuration\n\nThe module is configured through two input groups:\n\n**`manure_management`** — a dict keyed by processor category (`anaerobic_digester`, `separator`, `storage`, `handler`), each a list of processor configs. Each config requires a unique `name` and a `processor_type` string that maps to a class via `ProcessorType`. Additional keys are passed as constructor arguments.\n\n**`manure_processor_connection`** — a dict with `processor_connections` and `separator_connections` lists. Each connection specifies a `processor_name` and either `destinations` (for standard processors) or `solid_output_destinations` / `liquid_output_destinations` (for separators). Each destination has a `receiving_processor_name` and a `proportion` (must sum to 0 or 1 per origin).\n\n## Integration with Other Modules\n\n- **Animal module** — produces daily `ManureStream` objects with `pen_manure_data` indicating the first processor. The `ManureManager.run_daily_update()` receives these and routes them.\n- **Crop/soil module** — calls `ManureManager.request_nutrients()` with a `NutrientRequest`. The manager returns a `NutrientRequestResults` object (or `None` if no manure is available) and records the application in the `OutputManager` under `on_farm_manure`.\n- **OutputManager** — all processors report daily outputs (gas emissions, water volumes, manure stream composition) through `_report_processor_output` and `_report_manure_stream`. Errors and warnings are logged with structured info maps.\n- **InputManager** — supplies the configuration dicts at construction time.\n- **`FieldManureSupplier`** — external source for supplemental manure when on-farm supply is insufficient.\n\n## Error Handling\n\nThe module uses a consistent pattern: log a structured error via `OutputManager.add_error()` and raise an exception. Key failure modes:\n\n| Condition | Exception |\n|---|---|\n| Duplicate processor names in config | `ValueError` |\n| Unknown processor referenced in connections | `ValueError` |\n| Processor missing connection definition | `ValueError` |\n| Cycle in processor graph | `ValueError` |\n| Self-loop or non-normalized proportions in adjacency matrix | `ValueError` |\n| Invalid manure stream received by handler/digester | `ValueError` |\n| `None`-type `ManureStream` during processing | `TypeError` |\n| Multiple streams to a `SingleStreamHandler` | `ValueError` |\n| Destination receiving both solid and liquid separator output | `ValueError` |\n| VS destruction exceeding available VS | Logs error, zeroes VS pools (no exception) |","other-changelog-md":"# Other — changelog.md\n\n# changelog.md\n\n## Overview\n\n`changelog.md` is the project-level changelog for the RuFaS (Ruminant Farm Systems) model. It provides a structured, human-readable record of all changes made to the codebase across releases. The file is intended for both developers and users: it documents new features, bug fixes, improvements, and dependency updates, and it makes the evolution of the model transparent and auditable.\n\nThis module is a static Markdown document. It contains no executable code, no functions, and no runtime behavior. Its \"interface\" is the set of conventions it defines for describing changes, and its primary consumers are developers who need to understand what changed in a given release and contributors who need to add new entries.\n\n## File Location and Role\n\nThe file lives at the repository root as `changelog.md`. It is referenced by the project's contribution workflow and release process. The changelog is manually maintained: every pull request that introduces a user-visible or code-structure change is expected to add an entry under the appropriate version heading.\n\nThe changelog is not generated from Git history. It is curated so that entries can carry additional context—impact area, input/output change flags, and a concise description—that a raw commit log does not provide.\n\n## Document Structure\n\nThe file is divided into two top-level sections:\n\n1. **Readme** – explains what a changelog is, why RuFaS maintains one, and the required format for each entry.\n2. **Changelog Entries** – the actual list of changes, grouped by version number.\n\n### Readme Section\n\nThe Readme section defines the purpose of the changelog and the mandatory components of every entry. It emphasizes that each entry must include:\n\n- **PR number** – the numeric GitHub pull request number, without the `PR` prefix or `#` symbol.\n- **PR link** – a Markdown link to the pull request, formatted as `[<PR #>](<link to PR>)`.\n- **Change magnitude** – either `[Major change]` or `[minor change]`, indicating whether the PR warrants a major version bump.\n- **Impact area** – one or more bracketed tags describing which part of the codebase or which inputs/outputs are affected (e.g., `[Animal]`, `[Manure]`, `[OutputManager]`, `[NoInputChange]`).\n- **Description** – a brief, specific sentence or two explaining what changed and why. Vague descriptions such as \"update xyz\" are discouraged; the description should state the concrete change, e.g., \"update xyz to abc\".\n\nThe Readme also includes a canonical example entry:\n\n```\n- [123](https://github.com/RuminantFarmSystems/RuFaS/pull/123) - [Major change/ minor change] [Impact Area] Short description of the change or feature.\n```\n\n### Changelog Entries Section\n\nThe entries are organized under version headings in descending order (newest first). Each version heading is an `###` Markdown heading, and the current release is also listed under a `### Current version` heading immediately above the newest version block.\n\nExample:\n\n```\n### Current version\n\nv1.0.3\n\n### v1.0.3\n\n- [3121](https://github.com/RuminantFarmSystems/RuFaS/pull/3121) - [minor change] [Animal] [NoInputChange] [OutputChange] Adds separate tracking for unmitigated vs. mitigated enteric methane for cows.\n```\n\n## Entry Format\n\nEvery entry is a single bullet point with the following structure:\n\n```\n- [<PR number>](<PR URL>) - [<change magnitude>] [<impact area>]... <description>\n```\n\nThe fields are separated by spaces and hyphens. The impact area tags are repeatable, so an entry can affect multiple modules or explicitly state that inputs or outputs did not change.\n\nCommon impact area tags observed in the changelog include:\n\n- `[Animal]`\n- `[Manure]`\n- `[Crop & Soil]` / `[Crop and Soil]` / `[Soil]`\n- `[Feed]` / `[Feed Storage]` / `[FeedManager]`\n- `[OutputManager]` / `[ReportGenerator]` / `[GraphGenerator]`\n- `[InputManager]` / `[DataValidator]`\n- `[TaskManager]`\n- `[EEE]` (Energy and Emissions Evaluation)\n- `[Weather]`\n- `[Testing]` / `[E2E Testing]`\n- `[Documentation]` / `[Readme]` / `[Wiki]`\n- `[GitHub Actions]` / `[Github action]`\n- `[Metadata]`\n- `[Formatting]`\n- `[NoInputChange]` / `[InputChange]`\n- `[NoOutputChange]` / `[OutputChange]`\n\nThe `[NoInputChange]` and `[NoOutputChange]` tags are used to explicitly communicate that a PR does not alter the model's input schema or output structure. This is important for users who need to know whether a version upgrade will require changes to their input files or downstream output processing.\n\n## Versioning Scheme\n\nThe changelog tracks semantic version numbers (`v1.0.3`, `v1.0.2`, etc.). The `### Current version` heading identifies the latest release. The version numbers correspond to tags or releases in the RuFaS repository and are also reflected in `pyproject.toml`.\n\nThe distinction between `[Major change]` and `[minor change]` in an entry is the signal used to decide whether a release should increment the major or minor version component. Most entries in the changelog are marked `[minor change]`; a `[major change]` tag is reserved for substantial architectural shifts or user-facing overhauls, such as the integration of the Data Collection App or the refresh of the Animal module.\n\n## Relationship to the Codebase\n\nAlthough `changelog.md` is not code, it is tightly coupled to the development workflow:\n\n- **Pull requests** – every entry references a GitHub pull request. The PR number and link are the traceability mechanism back to the actual diff, discussion, and review history.\n- **Release process** – the changelog is the authoritative list of changes included in a release. When a new version is cut, the entries are grouped under a new version heading and the `Current version` line is updated.\n- **Contribution guidelines** – the Readme section acts as a lightweight specification for contributors. It is referenced by the PR template and by `CONTRIBUTING.md` to ensure that all changes are documented consistently.\n- **Documentation ecosystem** – the changelog complements the Sphinx-generated API documentation and the scientific documentation. It provides the \"what changed over time\" view that API docs cannot.\n\nThe changelog has no runtime dependencies and is not imported by any module. It is a documentation artifact, not a data source.\n\n## Maintenance Guidelines\n\nTo keep the changelog useful and accurate, contributors should follow these practices:\n\n1. **Add an entry for every user-relevant PR.** If a PR changes inputs, outputs, module behavior, or project infrastructure, it belongs in the changelog.\n2. **Place the entry under the correct version.** If the change is part of an unreleased version, add it to the top version block. If a new version is being started, create a new `### vX.Y.Z` heading and update `### Current version`.\n3. **Use the exact entry format.** Include the PR number, link, change magnitude, impact area tags, and a specific description.\n4. **Be precise in descriptions.** Avoid generic phrases. State what was changed and, where relevant, why.\n5. **Use `[NoInputChange]` and `[NoOutputChange]` deliberately.** These tags are valuable to downstream users and should be included whenever a PR does not affect the input schema or output reporting.\n6. **Keep the changelog in sync with release metadata.** When the version in `pyproject.toml` is updated, the changelog's `Current version` and version headings should match.\n\n## Summary\n\n`changelog.md` is the project's memory. It records the rationale and scope of every significant change in a format that is easy to scan, linkable to the underlying PRs, and aligned with the project's versioning strategy. For developers, it is the first place to look when investigating when a behavior changed or why a particular module was refactored. For users, it is the definitive list of what a new version brings.","other-changelog-wip-md":"# Other — changelog_WIP.md\n\n# WIP Changelog (changelog_WIP.md)\n\n## Overview\n\n`changelog_WIP.md` is the work-in-progress changelog for the RuFaS (Ruminant Farm Systems) codebase. It records development changes that have been merged but are **not yet included in a version release**. Once a version is tagged, the entries in this file are moved into the release changelog and the WIP file is reset for the next development cycle.\n\nThe file serves two audiences:\n\n- **Developers** — a running record of what changed, why, and where, so that team members can track the evolution of the codebase between releases.\n- **Release managers** — a curated list of changes that feeds directly into version release notes.\n\n## Entry Format\n\nEvery changelog entry must follow a strict format:\n\n```\n- [<PR #>](<link to PR>) - [Major change|minor change] [Impact Area] [Additional Impact Areas...] Description of the change.\n```\n\n### Required Fields\n\n| Field | Requirement |\n|---|---|\n| **PR number** | The pull request number only — omit \"PR\" and \"#\". Must be a hyperlink to the PR using the format `[<PR #>](<link to PR>)`. |\n| **Change magnitude** | Either `[Major change]` or `[minor change]`. A major change is one that would warrant a major version upgrade. |\n| **Impact area** | One or more bracketed tags describing which parts of the codebase, inputs, or outputs are affected. Multiple impact areas are allowed (e.g., `[Animal] [InputChange] [OutputChange]`). |\n| **Description** | A brief, concise description of the change. Avoid vague statements like \"update xyz\" — instead say \"update xyz to abc\". |\n\n### Example\n\n```\n- [123](https://github.com/RuminantFarmSystems/RuFaS/pull/123) - [Major change] [Animal] [InputChange] [OutputChange] Adds a new user input for calf mortality rate and applies it to pre-wean survival calculations.\n```\n\n## Impact Area Tags\n\nThe changelog uses a controlled vocabulary of impact area tags. The most common ones observed in the current entries:\n\n| Tag | Meaning |\n|---|---|\n| `[Animal]` | Animal module (herd management, reproduction, growth, rations) |\n| `[Manure]` | Manure module |\n| `[Crop and Soil]` | Crop and Soil module |\n| `[Feed]` / `[Feeds]` | Feed module or feed input structure |\n| `[Feed Storage]` | Feed storage inputs and validation |\n| `[SimulationEngine]` | Core simulation loop and orchestration |\n| `[OutputManager]` | Output data management and padding |\n| `[GraphGenerator]` | Graph/report generation |\n| `[ReportGenerator]` | Report generation |\n| `[DataValidator]` | Input validation logic |\n| `[Cross Validation]` | Cross-validation rules between modules |\n| `[InputChange]` | Changes user input structure or adds new inputs |\n| `[OutputChange]` | Changes output structure, variable names, or units |\n| `[NoInputChange]` | No change to user inputs |\n| `[NoOutputChange]` | No change to outputs |\n| `[Docs]` | Documentation updates |\n| `[Tests]` / `[Testing]` / `[E2ETesting]` | Test changes |\n| `[pyproject.toml]` | Dependency or packaging changes |\n| `[Properties]` | Properties/config file changes |\n| `[Weather]` | Weather data handling |\n| `[EEE]` | EEE module |\n| `[Utility]` | Utility functions |\n| `[Config]` | Configuration files |\n| `[Dependabot]` | Dependency automation |\n| `[Dependency - Black]` | Black formatter version |\n| `[Verbosity]` | CLI verbosity controls |\n| `[main.py]` | Entry point changes |\n| `[Maintenance]` | General maintenance |\n| `[TractorDataset]` | Tractor dataset input |\n| `[Output]` | Output structure (general) |\n\n## Structure\n\nThe file is organized into two sections:\n\n### 1. Readme\n\nExplains what a changelog is and why it matters. It documents the four required fields for each entry and provides a concrete example. This section is intended for contributors who are adding entries for the first time.\n\n### 2. Changelog Entries\n\nThe actual list of changes, grouped under the heading **Next Version Updates**. Each entry is a single bullet line. The list is ordered by PR number (roughly chronological), with the most recent entries at the bottom.\n\n## How It Connects to the Codebase\n\nThe changelog is a **documentation artifact**, not a code module. It has no runtime behavior, no imports, and no execution flow. Its connection to the codebase is through the PRs it references:\n\n- Each entry links to a GitHub pull request in the `RuminantFarmSystems/RuFaS` repository.\n- The impact tags map to actual modules and subsystems in the codebase (e.g., `[Animal]` corresponds to the Animal module, `[SimulationEngine]` to the simulation orchestration code).\n- The file is maintained as part of the development workflow — contributors add entries when their PRs are merged, and release managers consume the entries when preparing version notes.\n\nThe changelog also references specific code artifacts by name, such as:\n\n- `SimulationEngine._daily_simulation()`\n- `Reproduction.execute_cow_ed_protocol()`\n- `HerdManager.formulate_rations()`\n- `Pen.formulate_optimized_ration`\n- `Growth._calculate_pregnant_heifer_target_daily_growth()`\n- `MineralizationDecomposition._calculate_nutrient_cycling_residue_composition_factor`\n- `GraphGenerator._draw_graph()`\n- `tractor_dataset.csv`\n- `pyproject.toml`\n- `constraints-release.txt`\n\n## Contributing\n\nWhen adding a new entry:\n\n1. Use the PR number and link for the merged pull request.\n2. Classify the change as `[Major change]` or `[minor change]` — most changes are minor; reserve major for breaking changes or significant new features.\n3. Tag all impact areas that apply. Use multiple bracketed tags when the change spans multiple areas.\n4. Write a description that is specific enough for a reader to understand what changed and why, without needing to open the PR.\n5. Add the entry under the **Next Version Updates** heading, at the bottom of the list.\n\n## Relationship to Release Changelog\n\nWhen a version is released, the entries in this file are moved into the release changelog (e.g., `v1.0.0` release notes). The WIP file is then reset to an empty state for the next development cycle. This workflow is described in the project's branching and versioning policy documentation (see PR #2813).","other-check-changes-bat":"# Other — check_changes.bat\n\n# check_changes.bat — Branch Change Linter\n\n## Overview\n\n`check_changes.bat` is a Windows batch script that lints Python files modified on the current Git branch relative to a base branch. It identifies changed files via Git, filters for Python files, and runs **Flake8** (style/lint checker) and **MyPy** (static type checker) on them.\n\nThe script is designed for developer workflows where code quality checks should run only on files actually touched in a feature branch, rather than the entire codebase.\n\n## Usage\n\n```\ncheck_changes.bat [BASEBRANCH]\n```\n\n- **`BASEBRANCH`** (optional) — the branch to compare against. Defaults to `dev` if omitted.\n- If more than one argument is provided, the script prints usage instructions and exits with code `1`.\n\n**Example:**\n\n```bat\ncheck_changes.bat            :: compares against dev\ncheck_changes.bat main       :: compares against main\n```\n\n## How It Works\n\nThe script executes a linear pipeline of operations:\n\n1. **Resolve base branch** — Determines the comparison branch from arguments or defaults to `dev`.\n2. **Find merge base** — Uses `git merge-base` to locate the common ancestor commit between the base branch and `HEAD`.\n3. **Collect changed files** — Runs `git diff --name-only --diff-filter=AM` to list files added or modified since the merge base.\n4. **Filter Python files** — Uses `findstr` to keep only files ending in `.py`.\n5. **Run linters** — Executes `flake8` and `mypy` on the filtered Python file list.\n6. **Cleanup** — Deletes temporary files used during execution.\n\n```mermaid\nflowchart TD\n    A[Parse arguments] --> B[Get merge base commit]\n    B --> C[git diff: list changed files]\n    C --> D[Filter .py files]\n    D --> E{Any Python files?}\n    E -->|Yes| F[Run flake8 + mypy]\n    E -->|No| G[Print message]\n    F --> H[Cleanup temp files]\n    G --> H\n```\n\n## Key Components\n\n### Argument Parsing\n\nThe script accepts zero or one argument. The logic uses nested `IF` checks:\n\n- No arguments → `base_branch = dev`\n- One argument → `base_branch = <arg>`\n- Two or more → display usage and exit with code `1`\n\n### Git Integration\n\nTwo Git commands drive the change detection:\n\n- **`git merge-base <base_branch> HEAD`** — finds the common ancestor commit. The result is stored in `BASEBRANCHHEAD`.\n- **`git diff --name-only --diff-filter=AM %BASEBRANCHHEAD%`** — lists files that were **A**dded or **M**odified relative to the merge base. The `--diff-filter=AM` excludes deleted files, which is important because deleted files cannot be linted.\n\n### Temporary Files\n\nThe script uses two temporary files in the current directory:\n\n| File | Purpose |\n|------|---------|\n| `.changed_files.txt` | Full list of changed files (all extensions) |\n| `.changed_python_files.txt` | Space-separated list of changed `.py` files |\n\nThese are created at the start (after removing stale copies) and deleted at the end, both on success and on the \"no Python files\" path.\n\n### Linting Execution\n\nThe Python file list is read into the `changed_python_files` variable, then passed to both tools:\n\n```bat\nflake8 %changed_python_files%\nmypy %changed_python_files%\n```\n\nIf no Python files were changed, the script prints `No Python files modified on this branch yet.` and skips the linting step.\n\n## Dependencies\n\nThe script assumes the following are available on the system:\n\n- **Git** — for branch comparison and diff operations\n- **Flake8** — Python style guide enforcement\n- **MyPy** — Python static type checker\n\nThese tools must be installed and accessible via the system `PATH`.\n\n## Integration with the Codebase\n\nThis script is a standalone developer utility. It has no internal dependencies on other modules and is not called by any other code. It is intended to be run manually by developers, typically as part of a pre-commit workflow or before pushing a branch.\n\nThe script is Windows-specific (uses `.bat` extension, `@echo off`, and Windows-style file paths). A Unix equivalent would need to use `#!/bin/sh` syntax and different path separators.\n\n## Exit Codes\n\n| Code | Meaning |\n|------|---------|\n| `0` | Success (including the \"no Python files\" case) |\n| `1` | Invalid usage (more than one argument) |\n\nNote: The exit code does **not** reflect the results of Flake8 or MyPy. If those tools report linting errors, the script still exits with `0`. The linting output is printed to stdout/stderr for the developer to review.","other-check-changes-sh":"# Other — check_changes.sh\n\n# check_changes.sh — Lint and Type-Check Modified Python Files\n\n## Overview\n\n`check_changes.sh` is a lightweight shell script that runs **Flake8** (linting) and **MyPy** (type checking) on all Python files that have been added or modified on the current Git branch, relative to a base branch. It is designed to give developers fast, targeted feedback on only the code they have actually changed, rather than running checks against the entire codebase.\n\nThe script is intended to be run manually or as part of a pre-commit / CI workflow.\n\n## Usage\n\n```\n./check_changes.sh [BASEBRANCH]\n```\n\n- `BASEBRANCH` — the branch to compare against. Defaults to `dev` if omitted.\n- If more than one argument is provided, the script prints usage information and exits with code `1`.\n\n### Examples\n\n```sh\n# Compare against dev (default)\n./check_changes.sh\n\n# Compare against main\n./check_changes.sh main\n```\n\n## How It Works\n\nThe script performs three steps:\n\n1. **Determine the base branch** — uses the provided argument, or defaults to `dev`.\n2. **Find changed Python files** — uses `git diff` to list files that were added or modified between the merge base of the current branch and the base branch, then filters for `.py` files.\n3. **Run linting and type checking** — executes `flake8` and `mypy` on the resulting file list.\n\n### Step-by-Step Breakdown\n\n#### 1. Base Branch Resolution\n\n```sh\nif [ $# -eq 0 ]; then\n    base_branch=\"dev\"\nelif [ $# -gt 1 ]; then\n    display_usage\n    exit 1\nelse\n    base_branch=$1\nfi\n```\n\nThe script accepts zero or one argument. With zero arguments, it compares against `dev`. With more than one, it prints usage and exits.\n\n#### 2. Finding Changed Python Files\n\n```sh\nchanged_files=$(git diff --name-only --diff-filter=AM \"$(git merge-base ${base_branch} HEAD)\" | grep -E '\\.py$')\n```\n\nThis is the core of the script. It works as follows:\n\n- `git merge-base <base_branch> HEAD` — finds the common ancestor commit between the base branch and the current branch. This is the point where the current branch diverged.\n- `git diff --name-only --diff-filter=AM <merge_base>` — lists the names of files that differ between the merge base and the current working tree. The `--diff-filter=AM` restricts the output to files that were **A**dded or **M**odified. Deleted files are excluded because they cannot be linted.\n- `grep -E '\\.py$'` — filters the list to only files ending in `.py`.\n\nThe result is stored in the `changed_files` variable as a newline-separated list.\n\n#### 3. Early Exit for No Changes\n\n```sh\nif [ -z \"$changed_files\" ]; then\n    echo \"No Python files modified on this branch yet.\"\n    exit 0\nfi\n```\n\nIf no Python files were changed, the script prints a message and exits successfully. This avoids invoking `flake8` and `mypy` with an empty argument list.\n\n#### 4. Running the Checks\n\n```sh\nflake8 $changed_files\nmypy $changed_files\n```\n\nBoth tools are invoked with the full list of changed Python files. The script does not capture or suppress their output — it simply passes the file list through. The exit code of the script is the exit code of the last tool run (`mypy`), which means the script will report failure if either tool reports issues (since `mypy` runs last, its exit code takes precedence).\n\n## Flow Diagram\n\n```mermaid\ngraph TD\n    A[Start] --> B{Arguments provided?}\n    B -->|0 args| C[base_branch = dev]\n    B -->|1 arg| D[base_branch = arg]\n    B -->|\">1 arg\"| E[Print usage, exit 1]\n    C --> F[git merge-base base_branch HEAD]\n    D --> F\n    F --> G[git diff --name-only --diff-filter=AM]\n    G --> H[Filter for .py files]\n    H --> I{Any .py files?}\n    I -->|No| J[Print message, exit 0]\n    I -->|Yes| K[Run flake8 on files]\n    K --> L[Run mypy on files]\n    L --> M[Exit with mypy's code]\n```\n\n## Integration with the Codebase\n\nThis script is a developer tool rather than a runtime component. It is intended to be invoked:\n\n- **Manually** by developers before pushing a branch, to catch lint and type errors early.\n- **In a pre-commit hook** or CI pipeline, to enforce code quality on a per-branch basis.\n\nBecause it only checks changed files, it is significantly faster than running `flake8` and `mypy` on the entire repository, making it suitable for frequent use during development.\n\n## Edge Cases and Limitations\n\n- **Deleted files** are excluded via `--diff-filter=AM`, so a file that was removed on the current branch will not be checked. This is intentional — there is nothing to lint.\n- **Renamed files** are treated as add/delete pairs by Git. The added file will be included in the diff and checked.\n- **Non-Python files** are filtered out by the `.py` extension check.\n- **The script uses `sh`**, not `bash`, so it relies on standard shell features only. It does not use any bash-specific syntax.\n- **Exit code behavior**: The script's exit code is that of the last command (`mypy`). If `flake8` fails but `mypy` succeeds, the script will still exit with code `0`. If this is undesirable, the script would need to be modified to aggregate exit codes explicitly.\n- **The `changed_files` variable** is a single string containing newline-separated paths. When passed to `flake8` and `mypy`, the shell splits it on whitespace, which works correctly for paths without spaces. Paths containing spaces would break this behavior.","other-constraints-release-txt":"# Other — constraints-release.txt\n\n# constraints-release.txt — RuFaS 1.0.0 Release Dependency Constraints\n\n## Overview\n\n`constraints-release.txt` is a fully pinned dependency manifest for the RuFaS 1.0.0 release. It records the exact versions of every third-party package that were resolved from `pyproject.toml`, installed, and validated through the test suite at release time. The file serves as a known-good environment snapshot: any developer or CI pipeline that installs from this file gets byte-for-byte the same dependency set that shipped with the release.\n\nThis is a **constraints file**, not a conventional `requirements.txt`. It is consumed by pip's `-c` flag, which applies the pinned versions as constraints on top of a package's declared dependencies.\n\n## How It Works\n\nThe file is a plain-text list of `package==version` entries. Each line is a hard equality constraint — pip will refuse to install a version that does not match exactly. This is stricter than `>=` or `~=` constraints and guarantees reproducibility.\n\nThe intended usage is:\n\n```bash\npip install -c constraints-release.txt -e \".[dev]\"\n```\n\nThis command does two things simultaneously:\n\n1. **Installs the RuFaS package** with its development extras (the `.[dev]` extra), pulling in the dependency graph declared in `pyproject.toml`.\n2. **Applies the constraints file** so that every dependency in that graph is forced to the exact version listed here.\n\nIf a dependency in `pyproject.toml` is not present in the constraints file, it is installed at whatever version pip resolves — but for the RuFaS 1.0.0 release, all direct dependencies are covered.\n\n## Dependency Inventory\n\nThe 20 pinned packages fall into four functional groups:\n\n### Scientific Computing Stack\n\n| Package | Version | Role |\n|---|---|---|\n| `numpy` | 2.2.0 | Core array and numerical primitives |\n| `scipy` | 1.16.2 | Scientific algorithms, optimization, statistics |\n| `pandas` | 2.3.2 | Tabular data structures and analysis |\n| `matplotlib` | 3.10.5 | Plotting and visualization |\n| `numba` | 0.61.2 | JIT compilation for performance-critical paths |\n| `SALib` | 1.5.1 | Sensitivity analysis (likely used for parameter studies) |\n| `psutil` | 7.0.0 | System and process monitoring |\n\n### Testing & Quality Tooling\n\n| Package | Version | Role |\n|---|---|---|\n| `pytest` | 7.4.4 | Test framework |\n| `pytest-mock` | 3.14.1 | Mocking utilities for pytest |\n| `pytest-lazy-fixture` | 0.6.3 | Lazy fixture evaluation |\n| `freezegun` | 1.5.5 | Time-travel for tests (freezing `datetime`/`time`) |\n| `coverage` | 7.10.4 | Code coverage measurement |\n| `deepdiff` | 8.6.1 | Deep comparison of nested structures in test assertions |\n\n### Code Quality & Static Analysis\n\n| Package | Version | Role |\n|---|---|---|\n| `black` | 25.1.0 | Code formatter |\n| `flake8` | 7.3.0 | Style guide enforcement |\n| `mypy` | 1.17.1 | Static type checking |\n\n### Documentation & Utilities\n\n| Package | Version | Role |\n|---|---|---|\n| `Sphinx` | 9.1.0 | Documentation generator |\n| `sphinxawesome-theme` | 5.3.2 | Sphinx theme |\n| `tqdm` | 4.67.1 | Progress bars for long-running operations |\n| `typing_extensions` | 4.14.1 | Backported typing features |\n\n## Relationship to the Codebase\n\nThe file sits at the boundary between the project's declared dependencies and its validated release state:\n\n```\npyproject.toml  (declared dependency ranges)\n       │\n       ▼\nconstraints-release.txt  (exact versions, validated)\n       │\n       ▼\npip install -c constraints-release.txt -e \".[dev]\"\n       │\n       ▼\nTest suite runs against pinned environment\n```\n\n```mermaid\ngraph LR\n    A[pyproject.toml] -->|resolved at release time| B[constraints-release.txt]\n    B -->|pip install -c| C[Installed environment]\n    C -->|validated by| D[Test suite]\n    D -->|passes| E[RuFaS 1.0.0 release]\n```\n\nThe file is **generated**, not hand-maintained. It was produced on 2026-03-30 by resolving the dependency graph from `pyproject.toml`, installing the resulting versions, and running the full test suite to confirm compatibility. The header comment explicitly warns that newer versions may exist but are not guaranteed to work — the file is a frozen contract, not a recommendation of latest versions.\n\n## Maintenance Notes\n\n- **Do not edit this file casually.** It represents a validated state. If a dependency must be bumped, the change should go through `pyproject.toml` first, followed by a fresh resolution, installation, and test run.\n- **The file is release-specific.** A future release (e.g., 1.1.0) will have its own constraints file with a different set of pinned versions.\n- **The `-c` flag is pip-specific.** If you are using a different package manager (e.g., `uv`), you will need to translate these constraints into that tool's format.\n\n## Limitations\n\n- The file pins **direct dependencies only**. It does not enumerate transitive dependencies (packages pulled in by these packages). For full reproducibility, a complete environment snapshot (e.g., a `requirements.txt` with all transitive deps, or a container image) would be needed.\n- The file is **platform-agnostic** — it does not record platform-specific wheels or build flags. If a dependency ships different binaries per platform, the exact binary is determined by the platform at install time, not by this file.","other-datacollectionapp-css":"# Other — DataCollectionApp-css\n\n# DataCollectionApp — font-awesome.css\n\n## Overview\n\n`font-awesome.css` is a vendored copy of **Font Awesome 4.0.3**, a classic icon font stylesheet. It provides the DataCollectionApp's UI with a scalable icon system driven by a custom web font. The file defines the `@font-face` declaration that loads the icon font, the base `.fa` class that activates icon rendering, and roughly 400 icon glyph mappings that map CSS class names (e.g., `fa-save`, `fa-trash-o`) to Unicode private-use-area code points in the font.\n\nThis is a static asset — it has no JavaScript, no runtime logic, and no dependencies on other modules. It is consumed by the application's HTML templates and other stylesheets.\n\n## File Structure\n\nThe stylesheet is organized into five logical sections:\n\n| Section | Purpose |\n|---|---|\n| `@font-face` declaration | Registers the `FontAwesome` font family and points to the font files in `../fonts/` |\n| Base `.fa` class | Sets the font family, inline-block display, and text rendering hints |\n| Sizing & layout utilities | `.fa-lg`, `.fa-2x` … `.fa-5x`, `.fa-fw`, `.fa-ul`, `.fa-li`, `.fa-border`, `.pull-left`/`.pull-right` |\n| Animation & transforms | `.fa-spin`, `.fa-rotate-*`, `.fa-flip-*`, `.fa-stack*` |\n| Icon glyph definitions | ~400 `.fa-*:before` rules mapping class names to font code points |\n\n## Key Components\n\n### Font Loading\n\nThe `@font-face` rule registers the `FontAwesome` family and provides four font formats for cross-browser compatibility:\n\n```css\n@font-face {\n  font-family: 'FontAwesome';\n  src: url('../fonts/fontawesome-webfont.eot?v=4.0.3');\n  src: url('../fonts/fontawesome-webfont.eot?#iefix&v=4.0.3') format('embedded-opentype'),\n       url('../fonts/fontawesome-webfont.woff?v=4.0.3') format('woff'),\n       url('../fonts/fontawesome-webfont.ttf?v=4.0.3') format('truetype'),\n       url('../fonts/fontawesome-webfont.svg?v=4.0.3#fontawesomeregular') format('svg');\n  font-weight: normal;\n  font-style: normal;\n}\n```\n\nThe `?v=4.0.3` query string is a cache-busting mechanism — bumping the version forces browsers to re-download the font after an upgrade. The font files themselves live in `DataCollectionApp/fonts/`, one directory up from this stylesheet.\n\n### Base Icon Class\n\nEvery icon is rendered by applying the `.fa` class to an element (typically an `<i>` or `<span>`), followed by a specific icon class:\n\n```html\n<i class=\"fa fa-save\"><\/i>\n```\n\nThe `.fa` class sets:\n\n- `display: inline-block` — allows the icon to be sized and transformed like a block element while remaining inline\n- `font-family: FontAwesome` — activates the icon font\n- `font-style: normal` and `font-weight: normal` — prevents inherited italics/bold from distorting glyphs\n- `-webkit-font-smoothing: antialiased` and `-moz-osx-font-smoothing: grayscale` — improves glyph rendering on macOS\n\n### Sizing Utilities\n\nIcons scale relative to the surrounding font size:\n\n| Class | Effect |\n|---|---|\n| `.fa-lg` | 1.33× with adjusted line-height and vertical alignment |\n| `.fa-1_25x` | 1.25× |\n| `.fa-1_5x` | 1.5× |\n| `.fa-2x` … `.fa-5x` | 2× through 5× |\n\nNote the underscore in `.fa-1_25x` and `.fa-1_5x` — CSS class names cannot contain a literal dot, so the decimal point is replaced with an underscore.\n\nAdditional layout helpers:\n\n- `.fa-fw` — fixed width (1.2857em) for aligning icons in vertical lists\n- `.fa-ul` / `.fa-li` — replaces standard list bullets with icons\n- `.fa-border` — adds a subtle border and padding for a \"badge\" look\n- `.pull-left` / `.pull-right` — floats the icon with appropriate margin\n\n### Animation and Transforms\n\n- `.fa-spin` — infinite 2-second linear rotation, with `@keyframes spin` defined for all major browsers (including `-webkit-`, `-moz-`, `-o-`, and `-ms-` prefixes)\n- `.fa-rotate-90` / `-180` / `-270` — fixed rotation, with an IE `filter` fallback\n- `.fa-flip-horizontal` / `.fa-flip-vertical` — mirror transforms, also with IE filter fallbacks\n- `.fa-stack` / `.fa-stack-1x` / `.fa-stack-2x` — overlays two icons (e.g., a small icon on a larger circle/square background); `.fa-inverse` turns the foreground icon white\n\n### Icon Glyph Definitions\n\nThe bulk of the file consists of rules like:\n\n```css\n.fa-save:before,\n.fa-floppy-o:before {\n  content: \"\\f0c7\";\n}\n```\n\nEach rule uses the `:before` pseudo-element to inject a character from the font's **Private Use Area** (Unicode range `\\f000`–`\\f196`). Screen readers ignore these code points, so the icons are purely decorative and do not pollute accessibility trees.\n\nMany icons have aliases — for example, `fa-gear` and `fa-cog` map to the same glyph, as do `fa-save`/`fa-floppy-o` and `fa-rotate-left`/`fa-undo`. This preserves backward compatibility with older class names.\n\n## Usage in the Application\n\nIcons are used throughout the DataCollectionApp's HTML templates. Typical patterns:\n\n```html\n<!-- Action button -->\n<button class=\"btn btn-primary\">\n  <i class=\"fa fa-save\"><\/i> Save Record\n<\/button>\n\n<!-- Navigation -->\n<a href=\"/dashboard\"><i class=\"fa fa-home\"><\/i> Dashboard<\/a>\n\n<!-- Status indicator -->\n<span class=\"fa-stack\">\n  <i class=\"fa fa-circle fa-stack-2x\"><\/i>\n  <i class=\"fa fa-check fa-stack-1x fa-inverse\"><\/i>\n<\/span>\n```\n\nBecause the file is a static stylesheet, it has no call graph, execution flow, or runtime entry points. It is loaded once via a `<link>` tag (or bundled by the app's build pipeline) and applies globally.\n\n## Integration Notes\n\n- **Font files required**: The stylesheet will not render icons unless the four font files (`fontawesome-webfont.eot`, `.woff`, `.ttf`, `.svg`) are present in `DataCollectionApp/fonts/`. If icons appear as empty boxes or \"tofu\" characters, the font files are missing or the relative path is broken.\n- **Version pinning**: This is Font Awesome 4.0.3, an older major version. The class naming scheme (`fa-*`) differs from Font Awesome 5+ (which uses `fas`/`far`/`fab` prefixes). Do not mix class names from different major versions.\n- **No JavaScript dependency**: Unlike Font Awesome 5's SVG/JS mode, this CSS-only approach requires no script tags and works in any environment that loads the stylesheet.\n- **IE compatibility**: The file includes `filter` fallbacks for IE's `BasicImage` transform, and the `@-ms-keyframes` block for the spin animation, indicating the app still targets legacy browsers.","other-datacollectionapp-js":"# Other — DataCollectionApp-js\n\n# Object.assign Polyfill\n\n## Overview\n\n`assign.js` is a standalone polyfill that provides a standards-compliant implementation of [`Object.assign()`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/assign) for JavaScript environments that lack native support (notably older browsers such as Internet Explorer 11 and earlier). The module is self-contained, has zero dependencies, and performs no action when `Object.assign` is already available.\n\n## Usage\n\nInclude the script before any code that depends on `Object.assign`:\n\n```html\n<script src=\"js/assign.js\"><\/script>\n<script>\n  // Safe to use Object.assign from this point forward\n  const config = Object.assign({}, defaults, overrides);\n<\/script>\n```\n\nThe polyfill is **idempotent** — loading it multiple times or in an environment that already supports `Object.assign` has no side effects.\n\n## How It Works\n\nThe polyfill guards its installation with a feature check:\n\n```js\nif (typeof Object.assign !== 'function') {\n  // ... install polyfill\n}\n```\n\nIf `Object.assign` is already defined as a function, the module exits immediately. Otherwise, it defines the method on `Object` using `Object.defineProperty` with the following descriptor:\n\n| Attribute     | Value  | Rationale                                                                 |\n| ------------- | ------ | ------------------------------------------------------------------------- |\n| `writable`    | `true` | Matches the native property descriptor; allows reassignment.              |\n| `configurable`| `true` | Matches the native property descriptor; allows future redefinition.       |\n| `enumerable`  | `false`| **Not set** — defaults to `false`, so the polyfill never appears in `for...in` iteration over `Object`. |\n\n## Implementation Details\n\n### Signature\n\n```js\nObject.assign(target, ...sources)\n```\n\n### Algorithm\n\n1. **Validate the target.** Throws a `TypeError` if `target` is `null` or `undefined`, matching the native behavior.\n2. **Box the target.** `Object(target)` coerces primitives (e.g., strings, numbers) into wrapper objects so properties can be assigned.\n3. **Iterate sources.** For each source argument, skip `null`/`undefined` values (they are ignored per spec).\n4. **Copy properties.** For each source, iterate with `for...in` and copy only **own enumerable** properties. The check uses `Object.prototype.hasOwnProperty.call(nextSource, nextKey)` rather than `nextSource.hasOwnProperty(nextKey)` to guard against a shadowed `hasOwnProperty` on the source object.\n5. **Return** the modified target object.\n\n### Key Implementation Choices\n\n**`for...in` + `hasOwnProperty` instead of `Object.keys`:** The polyfill targets environments without ES2015 features. `Object.keys` exists in ES5, but `for...in` with an own-property check is the more conservative choice and works in ES3+ engines.\n\n**`Object.defineProperty` for installation:** Using `Object.defineProperty` with an explicit descriptor ensures the polyfilled method is non-enumerable, mirroring the native property's attributes. A naive `Object.assign = function () {}` would create an enumerable property, which could break `for...in` loops over `Object` in some code.\n\n**Strict mode inside the polyfill function:** The `'use strict'` directive ensures that assignments to a read-only target property throw instead of failing silently, matching native behavior in strict mode.\n\n## Edge Cases Handled\n\n| Input | Behavior |\n| ----- | -------- |\n| `Object.assign(null)` | Throws `TypeError` |\n| `Object.assign(undefined)` | Throws `TypeError` |\n| `Object.assign({}, null, undefined)` | Returns `{}` — nullish sources are skipped |\n| `Object.assign(\"str\")` | Returns `String {\"str\"}` — primitive target is boxed |\n| Source with shadowed `hasOwnProperty` | Works correctly — uses `Object.prototype.hasOwnProperty.call` |\n| `Object.assign({}, {a: 1}, {a: 2})` | Later sources overwrite earlier ones: `{a: 2}` |\n\n## Integration with the Codebase\n\nThis module is a **dependency-free utility** with no imports and no exports. It is loaded purely for its side effect of installing the polyfill globally. It does not reference other modules and is not referenced by them at the source level — it exists to normalize the runtime environment before application code executes.\n\n### Load Order\n\nBecause the polyfill must be installed before any code calls `Object.assign`, ensure the `<script>` tag for `assign.js` appears **before** other application scripts in the HTML:\n\n```html\n<!-- Polyfills first -->\n<script src=\"js/assign.js\"><\/script>\n<!-- Application code -->\n<script src=\"js/app.js\"><\/script>\n```\n\n### Compatibility\n\n- **Works on:** Any environment where `Object.defineProperty` is available (IE9+).\n- **Not needed on:** Modern evergreen browsers, Node.js 4+, and any environment with native ES2015 support — the feature check short-circuits immediately.\n\n## Limitations\n\n- Does **not** polyfill `Object.assign` in environments lacking `Object.defineProperty` (IE8 and below). This is an intentional trade-off; supporting those engines would require a fundamentally different approach (e.g., a shim that pollutes `Object.prototype`).\n- Does not copy **symbol-keyed properties** (irrelevant for the target environments, but worth noting).\n- Does not trigger **setters** on the target — it uses `to[nextKey] = ...` assignment, which is consistent with the spec's `Set` semantics.","other-datacollectionapp":"# Other — DataCollectionApp\n\n# DataCollectionApp Module\n\n## Overview\n\nThe DataCollectionApp is a client-side, single-page web application for structured agricultural data collection in the RuFaS (Rural Farm Sustainability) project. It renders dynamic JSON-schema-driven forms, validates user input in real time, and exports completed entries as individual JSON files.\n\nThe application is entirely self-contained in a single HTML file (`index.html`) with no build step or server-side component. All logic runs in the browser, and all data persists only through user-initiated file downloads or URL-encoded state.\n\n## Architecture\n\nThe application is built around the [JSON Editor](https://github.com/json-editor/json-editor) library, which generates HTML forms from JSON Schema definitions. The app layers the following on top:\n\n- **Schema aggregation** — twelve domain-specific schemas are combined into a single `oneOf` array, letting users create heterogeneous data entries (e.g., a field record followed by a crop schedule record) within one session.\n- **Ace editor integration** — the JSON output pane is an Ace editor instance configured for JSON mode, allowing users to inspect and directly edit the generated JSON.\n- **URL state loading** — a compressed, base64-encoded JSON payload can be passed via the `?data=` query parameter to pre-populate the form.\n- **Per-entry file export** — the \"Save Results\" button writes each data entry to its own JSON file, using a `fileName` property from the entry as the filename.\n\n### Component Diagram\n\n```mermaid\ngraph TD\n    A[index.html] --> B[parseUrl]\n    B --> C[mergeOptions]\n    C --> D[refreshUI]\n    D --> E[initJsoneditor]\n    E --> F[JSONEditor instance]\n    F --> G[change event]\n    G --> H[outputTextarea / Ace]\n    G --> I[validate]\n    I --> J[stringifyRelevantErrorObjects]\n    F --> K[Save Results click]\n    K --> L[saveJsonFile per entry]\n    M[Update Form click] --> F\n    N[Schema files x12] --> A\n```\n\n## Key Components\n\n### Schema Loading\n\nThe page loads twelve schema files from the `./schema/` directory via `<script>` tags. Each file defines a global variable (e.g., `config_schema`, `animal_schema`, `field_schema`) containing a JSON Schema object. The schemas cover:\n\n| Schema | Purpose |\n|---|---|\n| `config_schema` | General configuration data |\n| `animal_schema` | Animal/livestock records |\n| `crop_schedule_schema` | Crop planting/harvest timing |\n| `crop_configuration_schema` | Crop setup parameters |\n| `fertilizer_schedule_schema` | Fertilizer application timing |\n| `manure_schedule_schema` | Manure application timing |\n| `tillage_schedule_schema` | Tillage operations |\n| `feed_schema` | Feed composition/ration data |\n| `manure_management_schema` | Manure handling/storage |\n| `field_schema` | Field geometry and properties |\n| `tractor_dataset_schema` | Tractor/machinery data |\n| `tasks_schema` | General task records |\n\nThese are combined into the root `mySchema` object:\n\n```javascript\nvar mySchema = {\n    \"title\": \"Data Collection Schema\",\n    \"type\": \"array\",\n    \"format\": \"tabs-top\",\n    \"items\": {\n        \"type\": \"object\",\n        \"title\": \"Data Entry\",\n        \"oneOf\": [config_schema, animal_schema, /* ... */ tasks_schema]\n    }\n}\n```\n\nThe `format: \"tabs-top\"` renders each data entry as a tab, and the `oneOf` construct lets the user pick which schema type each entry should conform to.\n\n### Initialization Flow\n\nThe page bootstraps through a chain of function calls:\n\n1. **`parseUrl()`** — parses `window.location.search` for a `data` parameter. If present, it decompresses the value with `LZString.decompressFromBase64()` and parses it as JSON into the `data` variable. Any parse failure is silently swallowed.\n2. **`mergeOptions()`** — merges the default editor options with any options provided in the URL-loaded data. It forces `show_opt_in` and `required_by_default` to `true`, then calls `refreshUI()`.\n3. **`refreshUI()`** — sets the theme and icon library CSS links (Bootstrap 4 and Font Awesome 4), then calls `initJsoneditor()`.\n4. **`initJsoneditor()`** — destroys any existing editor instance, creates a new `JSONEditor` bound to the `#json-editor-form` div, and attaches the change handler.\n\n### Editor Change Handling\n\nThe `change` event fires on every form mutation. The handler:\n\n1. Retrieves the current form value via `jsoneditor.getValue()`.\n2. Writes it, pretty-printed, into the Ace editor (`outputTextarea`).\n3. Runs `jsoneditor.validate()`.\n4. If validation errors exist, maps them to human-readable strings via `stringifyRelevantErrorObjects()` and writes them to the validation textarea. Otherwise, writes `\"valid\"`.\n\nThe `keep_oneof_values` option is set to `false` after editor creation, which prevents stale values from persisting when the user switches a data entry between schema types.\n\n### JSON Output and Update Form\n\nThe Ace editor (`#output-textarea`) is initialized with:\n\n```javascript\nvar aceConfig = {\n    mode: 'ace/mode/json',\n    selection: false,\n    maxLines: Infinity,\n    minLines: 5\n}\n```\n\nUsers can edit the JSON directly. Clicking **Update Form** (`#setvalue`) parses the textarea content and pushes it back into the form via `jsoneditor.setValue()`. This round-trip is useful for bulk edits or for loading data from an external source.\n\n### Save Results\n\nThe **Save Results** button (`#save_results`) iterates over the array of data entries. For each entry:\n\n1. Extracts the `fileName` property.\n2. Destructures it out of the entry so it is not included in the exported JSON.\n3. Stringifies the remaining data with 2-space indentation.\n4. Triggers a browser download via `saveJsonFile()`.\n\nIf the top-level value is not an array, the entire object is saved as `data.json` and the user is alerted. Otherwise, an alert reports how many files were saved.\n\n```javascript\nfunction saveJsonFile(content, fileName, contentType) {\n    var a = document.createElement(\"a\");\n    var file = new Blob([content], { type: contentType });\n    a.href = URL.createObjectURL(file);\n    a.download = fileName;\n    a.click();\n}\n```\n\n### Validation Error Formatting\n\nRaw JSON Editor validation errors are verbose and reference schema paths like `root.0.oneOf[3].cropName`. Two helper functions transform these into readable messages:\n\n- **`mapSchemaIndexToPropertyNames(schema)`** — builds a lookup object mapping each schema's index in the `oneOf` array to its `title`.\n- **`stringifyRelevantErrorObjects(errors, schemaIndexesToNames)`** — filters out two classes of noise:\n  - Errors with message `\"Property must be set\"` (generic required-field noise).\n  - Errors whose path matches `/^root\\.(\\d+)$/` (whole-entry errors).\n\n  Remaining errors are matched against `/^root\\.(\\d+)\\.oneOf\\[(\\d+)\\]\\.(.+)$/` to extract the data entry index, schema index, and offending property name. The output format is:\n\n  ```\n  Data Entry 2 has invalid value for \"cropName\" against \"Crop Schedule\": ...\n  ```\n\n  Duplicate `fileName` errors for the same data entry are collapsed into a single message.\n\n## URL Parameter Loading\n\nThe app supports pre-population via a compressed URL parameter. The expected format is:\n\n```\n?data=<LZString-base64-encoded-JSON>\n```\n\nThe JSON payload can contain:\n\n- `options` — overrides for the JSON Editor options (merged over `defaultOptions`).\n- Any data entries — the actual form values.\n\nThis mechanism is useful for sharing partially completed forms or for deep-linking from other RuFaS tools.\n\n## Template File\n\nThe repository also contains a `template` file — a copy of `index.html` with two placeholders:\n\n- `<!-- Schema imports go here-->` — where additional `<script>` tags for new schemas are inserted.\n- `// List of available schema goes here` — where new schema variables are added to the `oneOf` array.\n\nThis template is intended for generating new versions of the app when the schema set changes.\n\n## Integration with the Broader Codebase\n\nThe DataCollectionApp is a standalone front-end tool. It has no internal or external function calls beyond the libraries it loads (`jsoneditor.min.js`, `ace.js`, `assign.js`, `lz-string.min.js`). Its integration points with the rest of the RuFaS system are:\n\n- **Schema files** — the `./schema/` directory is shared with other RuFaS components; the schemas define the canonical data shapes for the domain.\n- **URL state** — the `?data=` parameter allows other RuFaS tools to launch the app with pre-filled data.\n- **File output** — the exported JSON files are consumed downstream by RuFaS simulation or analysis pipelines.\n\n## Development Notes\n\n- The app uses global variables throughout (e.g., `data`, `jsoneditor`, `mySchema`) — there is no module system or bundler.\n- The `assign.js` script is loaded but not referenced in the visible code; it may be a polyfill for `Object.assign` for older browsers.\n- The `directLink`, `head`, and `setSchema` variables are declared but unused in the current version.\n- Error handling in `parseUrl()` silently ignores malformed URL data, which means a bad `data` parameter results in an empty form rather than a user-facing error.","other-docs-scientific":"# Other — docs-scientific\n\n# Animal Module — Scientific Documentation\n\n## Overview\n\nThe Animal Module is the core biological simulation component of the RuFaS (Ruminant Farm Systems) model. It simulates individual dairy cattle on a daily basis from birth until removal from the herd, using a hybrid approach that combines **Monte Carlo stochastic event simulation** with **process-based, dynamic models** for growth, reproduction, nutrition, and environmental outputs.\n\nThe module is responsible for:\n\n- Individual animal growth and bodyweight dynamics\n- Gestation, reproduction, and milk production\n- Estimation of nutrient requirements and feed intake\n- Ration formulation (least-cost or user-defined)\n- Enteric methane emission and manure excretion\n- Herd-level management: pen assignment, culling, and replacement purchasing\n\n## Architecture\n\nThe Animal Module is organized into two management layers that execute in sequence each simulation day:\n\n```mermaid\ngraph TD\n    A[Simulation Start] --> B[HerdFactory]\n    B --> C[Generate/Load pre-animal-population]\n    C --> D[Random sample with replacement]\n    D --> E[post-animal-population / Initial Herd]\n    E --> F[Daily Loop]\n    F --> G[AnimalManager - per-animal updates]\n    G --> H[HerdManager - herd-level updates]\n    H --> I{Time to formulate ration?}\n    I -->|Yes| J[Ration Formulation]\n    I -->|No| K[Summarize & report]\n    J --> K\n    K --> L[Pass manure to Manure Module]\n    L --> F\n```\n\n**HerdManager** handles herd-level daily routines: cycling through all animals to invoke their daily update functions, changing life stages, moving animals between pens, removing sold/dead animals, purchasing replacements, and triggering ration formulation at user-specified intervals.\n\n**AnimalManager** handles per-animal daily routines: growth, reproduction, lactation, and nutrient requirement calculations.\n\n## Herd Initialization\n\nHerd initialization is a two-step process, distinguished in the code as *Generation* and *Selection*.\n\n### Generation (pre-animal-population)\n\nThe `HerdFactory` class generates a large pool of animals (default 10,000) via the `_generate_animals()` method. This is a stand-alone simulation that runs for a user-specified number of days (default 5,000), during which animals progress through growth, reproduction, and life-stage transitions. Two notable behaviors during generation:\n\n- After 3,000 days, a copy of each heifer III is saved to the replacement herd on the day she is ready to calve, so purchased replacements give birth the day after entering the herd.\n- Cows reaching parity six are removed; the maximum parity in the generated herd is five.\n\nAlternatively, a pre-existing animal population file can be loaded instead of generating a new one.\n\n### Selection (post-animal-population)\n\nThe `_random_sample_with_replacement()` method selects animals from the pre-animal-population to form the initial herd. Sampling is stratified by group — calf, heifer I, heifer II, heifer III, replacement, and lactating/dry cows by parity 1–5 — using user-specified counts, parity fractions, and lactating-cow fraction.\n\nKey user inputs for initialization:\n\n| Input | Description | Default |\n|---|---|---|\n| `Initial_animal_num` | Starting population size for generation | 10,000 |\n| `Simulation_days` | Duration of generation simulation | 5,000 |\n| `Calf_num` / `HeiferI_num` / `HeiferII_num` / `HeiferIII_num_springers` / `Cow_num` | Initial head counts per class | 8 / 44 / 38 / 5 / 100 |\n| `Replace_num` | Replacement animals available in market | 5,000 |\n| `Lactating_fraction` | Fraction of cows lactating at start | 0.8356 |\n| `Parity_fractions` | Distribution of parity 1–5+ (must sum to 1.0) | 0.36, 0.26, 0.18, 0.11, 0.09 |\n\nPopulation statistics for both the pre- and post-selection pools are reported via `AnimalModuleReporter.report_animal_population_statistics`, producing `.population_*` and `.initial_*` output variables covering breed, class counts, age/bodyweight distributions, days in milk, days pregnant, and calving interval.\n\n## Pens and Animal Grouping\n\nEvery animal is assigned to a pen, which aggregates nutrient requirements for diet formulation, tracks stocking density, and collects manure and methane outputs for reporting to the Manure Module.\n\n### AnimalCombination mapping\n\nAnimals are grouped into pens using an `AnimalCombination` enum (defined in `enums.py`) that maps life-stage `AnimalTypes` to pen-compatible groups:\n\n| AnimalCombination | AnimalTypes |\n|---|---|\n| `CALF` | Calves |\n| `GROWING` | Heifer I, Heifer II |\n| `CLOSE_UP` | Heifer III, non-lactating cows |\n| `LAC_COW` | Lactating cows |\n\nTwo pen configurations are supported: one pen per combination (4 pens minimum), or a combined `GROWING_AND_CLOSE_UP` pen for small farms (3 pens minimum).\n\n### Pen class\n\nPens are instantiated by the HerdManager at simulation start. Key per-pen inputs include pen type (freestall, tiestall, open lot, compost bedded pack barn), number of stalls, maximum stocking density, distances to the milking parlor, and the manure management scenario ID.\n\nNoteworthy methods:\n\n- **`Remove_animals_by_ids`** — removes an animal from the pen and its ID from the pen's ID map; called via `HerdManager.remove_animal_from_pen_and_id_map`.\n- **`_add_new_animals`** — executes pen-level addition of animals; called via `Pen.update_animals`, which is invoked by `HerdManager._add_animal_to_pen_and_id_map`.\n- **`Set_animal_nutritional_requirements`** — updates the pen's aggregate nutrient requirement state.\n\n## Ration Formulation\n\nRations are either formulated through least-cost optimization or provided directly by the user, for each of four animal categories: calves, growing heifers, dry/close-up cows, and lactating cows. The feed library is adapted from the NASEM 2021 feed composition tables.\n\n### Nutrient Requirements\n\nRequirements are calculated for energy, protein, minerals (calcium and phosphorus), dry matter intake, and (NASEM only) amino acids. Two standards are implemented:\n\n**NRC 2001** — Energy requirements are partitioned into maintenance, activity, growth, pregnancy, and lactation. Maintenance is based on metabolic body weight (BW^0.75) with adjustments for conceptus weight and body condition score. Protein requirements are expressed in metabolizable protein (MP) with components for maintenance, growth, pregnancy, and lactation. DMI estimation differs for lactating cows (based on fat-corrected milk and week of lactation), dry cows (based on days pregnant), and heifers (based on age and diet NE concentration).\n\n**NASEM 2021** — Uses a similar partitioning but with updated coefficients and additional adjustments: maintenance energy accounts for gravid uterine weight and uterine involution; growth distinguishes frame growth from body-reserve change; protein requirements are expressed in true protein with explicit scurf, endogenous urinary, and metabolic fecal protein components. Amino acid requirements are calculated per essential amino acid (arginine, histidine, isoleucine, leucine, lysine, methionine, phenylalanine, threonine, tryptophan, valine) using fixed AA composition tables from NASEM Table 6-2 and target efficiencies from Table 6-4. The AA calculations live in `amino_acid.py`.\n\n### Energy and Nutrient Supply\n\nFeed energy values are corrected from standard book values. The NRC 2001 supply calculation applies a discount factor to TDN and DE based on intake level relative to maintenance, then converts to ME and NE (maintenance, lactation, growth) with feed-type-specific equations. The NASEM 2021 supply follows a similar structure with updated coefficients.\n\n### Formulation Methods\n\n- **Least-cost formulation** — RuFaS uses all available ingredients (subject to cost and homegrown inventory) to meet animal class requirements at minimum cost. Requires feed costs in $/kg DM.\n- **User-defined ration** — The user provides ingredient lists and relative % dry matter intake per animal class in the `user_defined_ration_percentages` section of the feed input file.\n\nCurrently, only one diet per animal category is supported, even if multiple pens of that category exist.\n\n## Animal Life Cycle\n\nAnimals progress through five life stages plus a culling stage:\n\n```mermaid\ngraph LR\n    A[Calf] -->|weaning day| B[Heifer I]\n    B -->|breeding start day| C[Heifer II]\n    C -->|conception + prefresh days| D[Heifer III]\n    D -->|calving| E[Cow]\n    E -->|failure to conceive / sale / death| F[Culled]\n```\n\nTransitions are driven by Monte Carlo processes:\n\n- **Event-based** — a uniform random draw U(0,1) is compared to an event probability (e.g., conception, sale).\n- **Population-based** — attribute values (e.g., birthweight, mature body weight) are drawn from Normal or Empirical distributions at instantiation.\n\nAt calving, a new calf object is created with a birthweight drawn from a user-informed distribution. Male calves are removed on day 1; female calves are kept or sold based on a user-defined retention fraction.\n\n### Bodyweight and Growth\n\nGrowth is simulated with parity-specific equations. Parity 1 and 2 animals continue growing toward mature body weight; parity 2+ animals have growth requirements that taper to zero. The growth model feeds into energy and protein requirement calculations.\n\n### Reproduction\n\nReproduction is simulated separately for heifers and cows:\n\n- **Heifers** — breeding begins at a user-defined breeding start day. Conception is an event-based Monte Carlo draw. Successful conception transitions the heifer to Heifer III when days-left-in-pregnancy equals the prefresh days input (default 21).\n- **Cows** — cows cycle through lactating and non-lactating phases. Conception rate can be modulated by parity and rebreeding attempt number via user inputs. Failure to conceive within the breeding window triggers culling.\n\nKey functions for the reproduction section are summarized in the documentation's Table 27.\n\n### Milk Production\n\nMilk yield is estimated from a customized herd-level lactation curve (Wood's curve) with parameters derived from Li et al. (2022) and adjusted by geographical, temporal, management, and parity factors. Farm-specific 305-day milk production targets tailor the curve to the modeled herd.\n\nMilk fat and protein percentages are determined per lactating cow from user inputs. If the formulated ration is inadequate, daily milk production is reduced according to constraint inputs; the reduction logic flows from ration formulation back into the milk production estimate.\n\n### Culling\n\nCulling is driven by:\n\n- Failure to conceive within the breeding window\n- User-provided sale and death probabilities per parity\n- A cumulative distribution function (CDF) over time, defined by `cull_day_count` segments and per-reason probability values in the animal input JSON\n\nThe CDF determines the conditional probability that a sold animal is removed for each issue group, and the conditional probability of death over time.\n\n## Environmental Outputs\n\n### Manure Excretion\n\nManure excretion is calculated from nutrient intake and diet properties, with outputs for total manure, manure nutrient composition (including phosphorus), and class-specific excretion rates. Inputs include basic animal and diet properties, with additional inputs for lactating cows. Outputs are aggregated by pen and passed to the Manure Module.\n\n### Enteric Methane Emission\n\nThree methane emission models are implemented:\n\n- **Mutian model** — a process-based model\n- **Mills model** — an empirical model\n- **IPCC model** — the Intergovernmental Panel on Climate Change tiered approach\n\nInputs include animal and diet properties, plus model-specific parameters. Mitigation strategies are supported via feed-based additives (e.g., dosage inputs for methane-mitigating feed additives) and dietary fiber/fat concentration adjustments.\n\n## Connection to the Rest of the Codebase\n\nThe Animal Module interfaces with other RuFaS components as follows:\n\n- **Manure Module** — receives daily aggregated manure excretion data from the HerdManager.\n- **Task Manager** — orchestrates animal population generation as a stand-alone task or as the first step of a full simulation.\n- **Output Manager** — receives reports at multiple scales: individual animal event histories, animal-class averages (e.g., DMI for Heifer II), pen-level summaries (e.g., average net energy requirement), and herd-level counts (e.g., animals sold per day).\n- **Feed Library** — supplies ingredient composition data (NASEM/NRC) used by the ration formulation logic.\n\n## Key Implementation Notes\n\n- The term \"herd initialization\" in code refers to both population generation and herd se
