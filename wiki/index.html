var PAGES = {"animal":"# Animal\n\n# RUFAS Animal Module\n\n## Module Overview\n\nThe `RUFAS.biophysical.animal` module is the core representation of individual animals within the Ruminant Farm Systems (RUFAS) simulation. It models the full lifecycle of dairy cattle — from newborn calf through heifer growth stages to lactating and dry cows — including growth, reproduction, milk production, nutrition, genetics, and mortality/culling events.\n\nThe module is organized as a package with the following structure:\n\n```\nbiophysical/animal/\n├── animal.py              # The Animal class (primary entity)\n├── animal_config.py       # AnimalConfig: user-supplied simulation parameters\n├── animal_module_constants.py\n├── animal_genetics/       # Genetics simulation (TBV, EBV, phenotype)\n├── data_types/            # Enums, TypedDicts, event/history records\n├── digestive_system/      # Manure excretion modeling\n├── growth/                # Body weight and growth curves\n├── herd_factory.py        # Herd creation and animal updates\n├── herd_manager.py        # Herd-level orchestration\n├── milk/                  # Lactation curve and milk production\n├── nutrients/             # Nutrient requirements (NASEM/NRC)\n├── ration/                # Ration formulation and optimization\n├── reproduction/          # Estrus, AI, pregnancy, calving\n└── calf_retention_policy.py\n```\n\n## Core Architecture\n\nThe module centers on the `Animal` class, which composes several sub-systems. Each sub-system is a dedicated class responsible for a specific biological or management process.\n\n```mermaid\nclassDiagram\n    class Animal {\n        +id: int\n        +breed: Breed\n        +animal_type: AnimalType\n        +body_weight: float\n        +days_in_milk: int\n        +days_in_pregnancy: int\n        +growth: Growth\n        +digestive_system: DigestiveSystem\n        +milk_production: MilkProduction\n        +nutrients: Nutrients\n        +reproduction: Reproduction\n        +nutrition_requirements: NutritionRequirements\n        +nutrition_supply: NutritionSupply\n        +genetics: Genetics\n    }\n    Animal *-- Growth\n    Animal *-- DigestiveSystem\n    Animal *-- MilkProduction\n    Animal *-- Nutrients\n    Animal *-- Reproduction\n    Animal *-- Genetics\n    Animal --> AnimalConfig : reads\n    Animal --> NutrientStandard : uses\n    Animal --> AnimalEvents : records\n    Animal --> BodyWeightHistory\n    Animal --> PenHistory\n    Animal --> GeneticHistory\n```\n\n## The Animal Class\n\n### Initialization\n\nThe `Animal.__init__` method accepts a `TypedDict` of initialization values and a `RufasTime` object. The initialization path depends on the animal type:\n\n| Animal Type | Initialization Method | Notes |\n|---|---|---|\n| `CALF` (newborn) | `_initialize_newborn_calf` | Special path; no `body_weight` key present |\n| `CALF` / `HEIFER_I` | `_initialize_calf_or_heiferI` | Shared youngstock initialization |\n| `HEIFER_II` / `HEIFER_III` | `_initialize_heiferII_or_heiferIII` | Includes reproduction program setup |\n| `LAC_COW` / `DRY_COW` | `_initialize_cow` | Full reproductive and lactation state |\n\nNewborn calves additionally receive genetics initialization via `_initialize_newborn_calf_genetics`, which uses dam true breeding values (TBV) for fat and protein when available.\n\n### Key Properties\n\nThe `Animal` class exposes several properties that enforce type-specific invariants:\n\n- **`days_in_milk`** — Returns 0 for non-cow animal types; only cows can have a positive value.\n- **`days_in_pregnancy`** — Always 0 for `CALF` and `HEIFER_I`; setting a positive value on these types raises a `TypeError`.\n- **`is_pregnant`** — True when `days_in_pregnancy > 0` and the animal is not a calf or heifer I.\n- **`is_milking`** — True when the animal is a cow with `days_in_milk > 0`.\n- **`future_cull_date`** — Returns `sys.maxsize` for non-cows (they are not culled via the cow culling mechanism).\n- **`daily_horizontal_distance` / `daily_vertical_distance` / `daily_distance`** — Only valid for cows; accessing on other types raises `TypeError`.\n- **`calves`** — Number of calves born; only meaningful for cows.\n- **`calving_interval`** — Days between calvings; only for cows.\n\n### Lifecycle Updates\n\nThe `Animal` class provides daily update methods invoked by the herd manager:\n\n| Method | Purpose |\n|---|---|\n| `daily_growth_update` | Updates body weight based on growth curves |\n| `_daily_digestive_system_update` | Computes manure excretion |\n| `daily_milking_update` | Updates milk production for lactating cows |\n| `daily_reproduction_update` | Advances estrus, AI, pregnancy state |\n| `_daily_nutrients_update` | Updates nutrient supply and requirements |\n| `_calf_life_stage_update` | Calf-specific daily logic (mortality, weaning) |\n| `_heiferI_life_stage_update` | Heifer I logic, including transition to Heifer II |\n| `_heiferII_life_stage_update` | Heifer II logic, including culling and transition |\n| `_heiferIII_life_stage_update` | Heifer III logic, including transition to cow |\n| `_cow_life_stage_update` | Cow logic (calving, drying off, culling) |\n\n### Mortality and Culling\n\nTwo probabilistic methods determine when an animal leaves the herd:\n\n**`determine_future_death_date()`** — Uses parity-specific death probabilities from `AnimalConfig.parity_death_probability`. If a death event occurs, a day is sampled from `AnimalConfig.death_day_probability` using linear interpolation. Returns `sys.maxsize` if no death is scheduled.\n\n**`determine_future_cull_date()`** — Uses parity-specific cull probabilities and reason-specific probabilities (lameness, injury, mastitis, disease, udder, unknown). Returns a tuple of `(future_cull_date, cull_reason)`.\n\nBoth methods follow the pattern of:\n1. Sample a uniform random number\n2. Compare against cumulative probability thresholds\n3. If triggered, sample a day from the corresponding day-distribution using inverse interpolation\n\n## Nutrition System\n\nThe `Animal` class delegates nutrition calculations to either `NASEMRequirementsCalculator` or `NRCRequirementsCalculator`, selected by the class-level `nutrient_standard` attribute (set via `Animal.set_nutrient_standard`).\n\n### `calculate_nutrition_requirements`\n\nThis method computes a `NutritionRequirements` object containing:\n\n- Maintenance, growth, pregnancy, lactation, and activity energy\n- Metabolizable protein\n- Calcium and phosphorus (process-based)\n- Dry matter intake\n- Essential amino acids (histidine, isoleucine, leucine, lysine, methionine, phenylalanine, threonine, tryptophan, valine)\n\n**Calf special case:** Calves use `CalfRationManager` for intake and requirement calculations, with dummy calcium/phosphorus values (noted as a TODO in the source).\n\n**Cow/heifer path:** The method uses previous-day nutrition supply (dry matter intake, NDF%, TDN%, net energy concentration) as inputs to the NASEM or NRC equations. If no previous supply exists, defaults from `AnimalModuleConstants` are used.\n\n### Nutrition Supply\n\nThe `nutrition_supply` attribute holds the actual nutrients provided by the formulated ration. The `previous_nutrition_supply` attribute stores the prior day's supply, enabling day-to-day continuity in requirement calculations.\n\n## Reproduction System\n\nThe `Reproduction` class (accessed via the `reproduction` property) manages:\n\n- Estrus detection and cycle tracking\n- Artificial insemination (AI) scheduling\n- Pregnancy checks and pregnancy loss\n- Gestation length and calving\n- Reproduction programs (heifer: TAI or SynchED; cow: Presynch/Ovsynch/Resynch)\n\nThe `reproduction` property setter raises a `TypeError` if assigned to a `CALF` or `HEIFER_I` animal, enforcing that only reproductively mature animals have reproduction state.\n\n## Genetics\n\nWhen `AnimalConfig.simulate_genetics` is enabled, each animal carries a `Genetics` object that models:\n\n- **True breeding values (TBV)** — genetic merit for fat and protein\n- **Estimated breeding values (EBV)** — predicted merit from phenotype\n- **Phenotype values** — observed trait values\n- **Ranking index** — selection index for management decisions\n\nNewborn calves inherit dam TBV values when available; otherwise genetics are initialized without parental information. The `update_genetic_history` method records changes to an animal's genetics over time, appending a new `GeneticHistory` entry when the genetic representation changes.\n\n## Configuration\n\n`AnimalConfig` is a static class holding all user-supplied parameters. Key categories:\n\n| Category | Example Parameters |\n|---|---|\n| **Weaning** | `wean_day`, `wean_length` |\n| **Reproduction** | `heifer_reproduction_program`, `cow_reproduction_program`, `voluntary_waiting_period`, conception rates |\n| **Calving** | `still_birth_rate`, `average_gestation_length`, `std_gestation_length` |\n| **Growth** | `birth_weight_avg_ho`, `birth_weight_std_ho`, `average_mature_body_weight` |\n| **Milk** | `milk_fat_percent`, `true_protein_percent`, `cow_times_milked_per_day` |\n| **Culling** | `parity_cull_probability`, `parity_death_probability`, reason-specific probabilities |\n| **Calf retention** | `calf_retention_method` (`\"rate\"` or `\"count\"`), `keep_female_calf_rate` |\n| **Genetics** | `simulate_genetics` flag |\n\nConfiguration is loaded from user input via `InputManager.get_data` in `initialize_animal_config`.\n\n## Integration with the Broader Codebase\n\nThe Animal module interacts with several other RUFAS subsystems:\n\n```mermaid\nflowchart LR\n    subgraph Input\n        IM[InputManager]\n    end\n    subgraph AnimalModule\n        AC[AnimalConfig]\n        A[Animal]\n        HM[HerdManager]\n        HF[HerdFactory]\n    end\n    subgraph Output\n        OM[OutputManager]\n        AR[AnimalModuleReporter]\n    end\n    subgraph OtherModules\n        PEN[Pen]\n        RATION[RationOptimizer]\n        MANURE[ManureConnection]\n    end\n\n    IM --> AC\n    AC --> A\n    HM --> A\n    HF --> A\n    A --> AR\n    AR --> OM\n    A --> PEN\n    PEN --> RATION\n    A --> MANURE\n```\n\n- **HerdManager / HerdFactory** — Orchestrate daily updates across all animals, create new animals at calving, and manage pen assignments.\n- **Pen** — Animals are assigned to pens; `update_pen_history` tracks pen changes. Pens handle manure stream splitting and bedding.\n- **RationOptimizer** — Uses animal nutrition requirements to formulate rations; the resulting supply is stored back on the animal.\n- **OutputManager / AnimalModuleReporter** — Report daily milk yield, reproduction statistics, manure excretions, genetic history, and sold/culled animal information.\n- **InputManager** — Supplies configuration values and lactation curve data.\n\n## Key Design Patterns\n\n1. **Composition over inheritance** — The `Animal` class composes specialized sub-system objects rather than using deep inheritance hierarchies.\n\n2. **TypedDict-based initialization** — Animal creation uses `TypedDict` variants (`NewBornCalfValuesTypedDict`, `CowValuesTypedDict`, etc.) that are type-checked at the interface boundary.\n\n3. **Property-based invariant enforcement** — Properties like `days_in_milk` and `future_cull_date` enforce animal-type constraints, raising `TypeError` with descriptive messages when violated.\n\n4. **Probabilistic event scheduling** — Death, culling, and reproduction events use random sampling against cumulative probability distributions, with linear interpolation for day selection.\n\n5. **Class-level configuration** — `AnimalConfig` and `nutrient_standard` are class-level, ensuring all animals share consistent simulation parameters.\n\n6. **Error reporting via OutputManager** — All invariant violations and warnings are routed through `OutputManager.add_error` / `add_warning`, centralizing diagnostic output.","crop-and-soil":"# Crop and Soil\n\n# Crop Subsystem (`RUFAS/biophysical/field/crop`)\n\n## Overview\n\nThe crop subsystem simulates the growth, development, and harvest of a single crop on a field. It is a component-based implementation of the plant-growth routines from the SWAT model, primarily following the Biomass Production (SWAT 5:2.1.1), Crop Yield (SWAT 5:2.4), and Growth Constraints (SWAT 5:3.1) sections.\n\nThe subsystem is organized around a single orchestrator class, `Crop`, which composes a set of process components. Each component owns one aspect of crop physiology — heat accumulation, canopy growth, nutrient uptake, water dynamics, biomass allocation, etc. — and operates on a shared `CropData` state object. This design keeps the individual processes isolated and testable while giving the `Crop` class a single, uniform interface for the rest of the simulation.\n\n## Architecture\n\nThe `Crop` class is the public entry point. It is constructed with (or internally creates) a `CropData` instance, then instantiates each process component with a reference to that same `CropData`. Because every component mutates the shared `CropData`, the daily update sequence is order-dependent: each step consumes state produced by the previous step.\n\n```mermaid\ngraph TD\n    A[perform_daily_crop_update] --> B[HeatUnits.absorb_heat_units]\n    A --> C[RootDevelopment.develop_roots]\n    A --> D[NitrogenUptake.uptake]\n    A --> E[PhosphorusUptake.uptake]\n    A --> F[GrowthConstraints.constrain_growth]\n    A --> G[LeafAreaIndex.grow_canopy]\n    A --> H[BiomassAllocation.allocate_biomass]\n```\n\nThe daily update is skipped entirely if the crop is mature or dormant (`CropData.is_mature` / `is_dormant`).\n\n### Component inventory\n\n| Component | Responsibility |\n|---|---|\n| `Crop` | Orchestration; daily update, water cycling, dormancy, harvest dispatch |\n| `CropData` | Dataclass holding all crop state and configuration |\n| `CropDataFactory` | Builds validated `CropData` instances from user input |\n| `HeatUnits` | Heat-unit accumulation and growing-season status |\n| `RootDevelopment` | Root depth growth and root/shoot biomass fraction |\n| `NitrogenUptake` / `PhosphorusUptake` | Nutrient uptake from soil layers |\n| `GrowthConstraints` | Water/temperature/nutrient stress and the daily growth factor |\n| `LeafAreaIndex` | Canopy development, senescence, and canopy height |\n| `BiomassAllocation` | Radiation interception, photosynthesis, biomass partitioning |\n| `WaterUptake` / `WaterDynamics` | Soil water extraction, transpiration, canopy evaporation |\n| `CropManagement` | Harvest-index calculation, cutting, killing, residue transfer |\n| `Dormancy` | Dormancy entry/exit and associated biomass loss |\n\n## Core Data Model: `CropData`\n\n`CropData` is a `@dataclass(kw_only=True)` that serves as both the configuration record and the runtime state for a crop. It is the single object passed between all process components.\n\nKey state groups:\n\n- **Identity and classification** — `name`, `id`, `plant_category` (a `PlantCategory` enum: `WARM_ANNUAL`, `COOL_ANNUAL`, `PERENNIAL`, `WARM_ANNUAL_LEGUME`, `COOL_ANNUAL_LEGUME`, `PERENNIAL_LEGUME`, `TREE`), `is_perennial`, `is_nitrogen_fixer`.\n- **Planting/management** — `planting_year`, `planting_day`, `use_heat_scheduling`, `harvest_efficiency`, `harvest_heat_fraction`, `optimal_harvest_index`, `minimum_harvest_index`.\n- **Growth parameters** — `minimum_temperature`, `optimal_temperature`, `potential_heat_units`, `max_leaf_area_index`, `light_use_efficiency`, leaf-development curve points (`first_heat_fraction_point`, `first_leaf_fraction_point`, etc.).\n- **Live state** — `biomass`, `leaf_area_index`, `root_fraction`, `above_ground_biomass`, `root_biomass`, `accumulated_heat_units`, `growth_factor`, `root_depth`.\n- **Nutrient state** — `nitrogen`, `phosphorus`, `optimal_nitrogen`, `optimal_phosphorus`, plus emergence/half-mature/mature nutrient fractions.\n- **Water state** — `canopy_water`, `water_uptake`, `max_transpiration`, `water_deficiency`, and cumulative evaporation/transpiration/uptake totals.\n- **Harvest quality attributes** — dry-matter percentage, crude protein, starch, ADF/NDF, lignin, ash, and yield nitrogen/phosphorus fractions. Defaults correspond to sorghum harvested as grain.\n\n`__post_init__` derives several flags from `plant_category`: perennial status, nitrogen-fixer status, and the `dormancy_loss_fraction` (0.1 for perennials, 0.3 for trees).\n\n### Computed properties\n\n- `heat_fraction` — `accumulated_heat_units / potential_heat_units`; the master growth clock used by most components.\n- `is_mature` — `heat_fraction >= 1.0`.\n- `in_growing_season` — alive, growing, not mature, not dormant.\n- `is_in_senescence` — `heat_fraction > senescent_heat_fraction`.\n- `water_canopy_storage_capacity` — canopy interception capacity scaled by current LAI relative to max LAI (SWAT eqn. 2:2.1.1).\n- `do_harvest_index_override` — true when a user-specified `user_harvest_index` is present.\n\n## Crop Lifecycle\n\n### Planting\n\n`Crop.create_crop(crop_reference, use_heat_scheduled_harvesting, time)` is the factory entry point. It:\n\n1. Delegates to `CropDataFactory.create_crop_data(crop_reference)` to build a configured `CropData`.\n2. Constructs a `Crop` around it.\n3. Calls `set_crop_planting_attributes(...)`, which records `use_heat_scheduling`, the crop `id`, `planting_year`, and `planting_day`.\n\nThe field layer subsequently calls `update_crop_max_root_depth(bottom_layer_depth)` to clamp the crop's `max_root_depth` to the bottom of the soil profile when the user-configured value is deeper.\n\n### Daily growth update\n\n`Crop.perform_daily_crop_update(current_conditions, field_data, soil_data, time)` runs the growth pipeline in a fixed order:\n\n1. **Heat units** — `HeatUnits.absorb_heat_units(mean, min, max)` accumulates heat and sets `is_growing`. If `use_heat_unit_temperature` is enabled, min/max air temperatures are clamped to the crop's growth thresholds and averaged; otherwise the mean air temperature is used directly.\n2. **Roots** — `RootDevelopment.develop_roots(time)` advances root depth and updates `root_fraction`.\n3. **Nutrients** — `NitrogenUptake.uptake(soil_data)` and `PhosphorusUptake.uptake(soil_data)` extract nutrients from accessible soil layers and update plant nutrient stores.\n4. **Stress** — `GrowthConstraints.constrain_growth(...)` computes water, temperature, nitrogen, and phosphorus stress (each independently toggleable via `FieldData` flags) and sets `CropData.growth_factor = 1 - max(stresses)`.\n5. **Canopy** — `LeafAreaIndex.grow_canopy()` advances LAI toward the optimal leaf-area curve, applies senescence after `senescent_heat_fraction`, and updates canopy height.\n6. **Biomass** — `BiomassAllocation.allocate_biomass(incoming_light)` converts intercepted radiation into biomass and partitions it into above- and below-ground pools.\n\n### Water cycling\n\nWater is handled separately from the growth update, in `Crop.cycle_water_for_crop(actual_evaporation, full_evapotranspirative_demand, soil_data)`:\n\n- During the growing season, `WaterUptake.uptake(soil_data)` extracts water from soil layers, then `WaterDynamics.cycle_water(...)` computes transpiration, evaporation, and the day's `water_deficiency`.\n- Outside the growing season, all cumulative water counters are reset to zero.\n\nCanopy interception is managed by `Crop.handle_water_in_canopy(available_precipitation)`, which fills canopy storage up to `water_canopy_storage_capacity` and returns the precipitation remaining for the soil. `Crop.evaporate_from_canopy(evapotranspirative_demand)` delegates to `WaterDynamics.evaporate_from_canopy(...)`, and `Crop.set_maximum_transpiration(...)` wraps `WaterDynamics.set_maximum_transpiration(...)`.\n\n### Dormancy\n\n`Crop.assess_dormancy(daylength, dormancy_threshold_daylength, rainfall, soil_data, soil)` is called by the field layer. If daylength falls below the threshold, the crop enters dormancy; otherwise it exits.\n\n`enter_dormancy` performs three operations:\n\n1. `Dormancy.enter_dormancy(soil_data)` — sets `is_dormant = True`. Warm annuals are exempt. Trees and perennials lose a fraction of biomass (`dormancy_loss_fraction`), convert it to surface residue, and clamp LAI to `minimum_lai_during_dormancy`.\n2. `BiomassAllocation.partition_biomass()` — re-partitions the (possibly reduced) biomass into above/below-ground pools.\n3. `soil.carbon_cycling.residue_partition.add_residue_to_pools(rainfall)` — passes residue into the soil carbon cycle.\n\nThe `Dormancy` class also provides two static helpers used during field setup: `find_threshold_daylength(minimum_daylength, dormancy_threshold)` and `find_dormancy_threshold(abs_latitude)`, which implements the SWAT latitude-based dormancy threshold equations (5:1.2.2–5:1.2.4).\n\n### Harvest\n\nHarvest is driven by the field manager through `Crop.manage_crop_harvest(harvest_operation, field_name, field_size, time, soil_data)`, which delegates to `CropManagement.manage_harvest(...)`. The supported operations are defined in the `HarvestOperation` enum:\n\n- `HARVEST_KILL` — cut, collect yield, then kill the plant.\n- `HARVEST_ONLY` — cut and collect yield; the plant continues growing.\n- `KILL_ONLY` — kill the plant without collecting yield; all biomass becomes residue.\n\n`CropManagement.manage_harvest` follows this sequence:\n\n1. `determine_harvest_index()` — uses the user override if present; otherwise computes the potential harvest index from heat fraction (`_determine_potential_harvest_index`) and adjusts it for water deficiency (`_adjust_harvest_index`).\n2. `cut_crop(collected_fraction=self.data.harvest_efficiency)` — removes `harvest_index × above_ground_biomass` from the plant (or from whole-plant biomass when the harvest index exceeds 1.0), updates LAI and heat units proportionally, and splits the cut material into collected yield vs. residue. Nutrient contents are assigned using either yield-nutrient fractions or optimal-nutrient fractions depending on whether the harvest index is overridden.\n3. `kill()` for kill operations — sets `is_alive = False` and converts remaining biomass to residue.\n4. `_record_yield(...)` — emits a `harvest_yield` variable through the `OutputManager` with mass, nutrient, and timing data.\n5. `_transfer_residue(soil_data, killed)` — deposits residue into the soil profile. A non-kill harvest adds residue only to the surface layer; a kill distributes both surface and root residue across soil layers using the root-mass distribution function `_calculate_root_mass_distribution` (Fan et al. 2016, eqn. 2).\n\nFor `HARVEST_KILL` and `HARVEST_ONLY`, `_get_harvested_crop(...)` packages the yield into a `HarvestedCrop` structure (with dry-matter mass scaled by `field_size`) for the feed storage system. It returns `None` for `KILL_ONLY`.\n\nHeat-scheduled harvesting is supported via `Crop.should_harvest_based_on_heat()`, which returns true when `use_heat_scheduling` is set and `heat_fraction >= harvest_heat_fraction`.\n\n## Process Components\n\n### `BiomassAllocation`\n\nImplements the SWAT biomass production routine. The public flow is:\n\n- `allocate_biomass(light)` → `photosynthesize(light)` then `partition_biomass()`.\n- `photosynthesize` computes intercepted radiation (`_intercept_radiation`, using the Beer–Lambert law with `light_extinction`), the daily biomass ceiling (`_determine_max_accumulation`, radiation × light-use efficiency), and the actual growth (`_determine_accumulated_biomass`, scaled by `growth_factor`), then adds it to `CropData.biomass`.\n- `partition_biomass` splits total biomass into `above_ground_biomass` and `root_biomass` using `root_fraction`.\n\n### `GrowthConstraints`\n\nComputes the four SWAT stress factors and combines them into `growth_factor`:\n\n- `_determine_water_stress(water_uptake, max_transpiration)` — SWAT 5:3.1.1.\n- `_determine_temperature_stress(air_temp, min_temp, optimal_temp)` — SWAT 5:3.1.2; a piecewise function around the optimal temperature.\n- `_determine_nutrient_stress(stored, optimal)` — SWAT 5:3.1.3/5:3.1.4; a sigmoidal function of the stored-to-optimal nutrient ratio.\n- `_determine_growth_factor(...)` — `1 - max(water, temp, nitrogen, phosphorus stress)`.\n\nEach stressor can be disabled via the `simulate_*_stress` flags on `FieldData`, in which case it is set to 0.\n\n### `HeatUnits`\n\nAccumulates daily heat units and maintains `is_growing`. The standard method computes `max(air_temp - minimum_temperature, 0)`; the alternative method (`use_heat_unit_temperature`) clamps daily min/max temperatures to the crop's growth thresholds and averages them. `accumulate_heat_units` → `assign_current_heat_units` → `add_heat_units` updates `CropData.accumulated_heat_units`.\n\n### `LeafAreaIndex`\n\nGrows the canopy along a two-point optimal LAI curve defined by the crop's heat-fraction/LAI-fraction pairs. `grow_canopy()`:\n\n1. Computes curve shape coefficients (`_determine_lai_shapes`).\n2. Looks up the optimal LAI fraction for the current heat fraction (`_determine_optimal_leaf_area_fraction`).\n3. Updates canopy height (`determine_canopy_height`).\n4. Branches: senescence for annuals (`_determine_senescent_leaf_area_index`), a time-shift only for perennials in senescence, or normal growth — where the actual LAI addition is constrained by `growth_factor` (`determine_leaf_area_added`, `add_leaf_area`).\n\n`shift_leaf_area_time()` maintains the previous-day LAI values needed by the growth increment calculation.\n\n### Nutrient uptake (`NitrogenUptake`, `PhosphorusUptake`)\n\nBoth nutrient classes extend `NonWaterUptake`, which in turn extends `NutrientUptake`. They share the same stratified soil-extraction machinery:\n\n- `uptake(soil_data)` — the public entry point; determines stored nutrient, computes potential uptake per soil layer, and extracts what is available.\n- `uptake_main_process` / `determine_nutrient_shape_parameters` — build the nutrient-demand curve using shape parameters derived from emergence/half-mature/mature nutrient fractions.\n- Layer-level helpers (`determine_layer_nutrient_uptake`, `_determine_nutrient_uptake_to_depth`, `determine_layer_nutrient_uptake_potential`, `_determine_deepest_accessible_layer`, `determine_layer_extracted_resource`) handle per-layer demand and extraction, reporting errors through the `OutputManager`.\n\n`NitrogenUptake` additionally implements biological fixation via `fix_nitrogen()` / `_determine_fixed_nitrogen()` for legume categories.\n\n### `RootDevelopment`\n\n`develop_roots(time)` advances `root_depth` toward `max_root_depth` and updates `root_fraction` via `_determine_root_fraction`. The root distribution parameters (`root_distribution_param_da`, `root_distribution_param_c`) come from Fan et al. (2016) and are also used by `CropManagement._calculate_root_mass_distribution` to place root residue into soil layers at harvest.\n\n### `WaterDynamics` / `WaterUptake`\n\n`WaterUptake.uptake(soil_data)` extracts water from accessible soil layers, using `_find_stratified_max_water_uptakes` and `_determine_max_water_uptake_to_depth` to compute the depth-wise extraction profile. `WaterDynamics` then:\n\n- `set_maximum_transpiration(evapotranspirative_demand)` — sets the day's transpiration ceiling (`_determine_maximum_transpiration`).\n- `cycle_water(actual_evaporation, water_uptake, full_evapotranspirative_demand)` — partitions water between evaporation and transpiration and computes `water_deficiency` (`_determine_water_deficiency`).\n- `evaporate_from_canopy(evapotranspirative_demand)` — removes intercepted canopy water.\n\n## Crop Configuration System\n\n`CropDataFactory` manages user-defined crop configurations. At simulation startup, `setup_crop_configurations()` reads `crop_configurations.crop_configurations` from the `InputManager`, validates each entry, and stores them in a name-keyed dictionary. Duplicate names raise a `ValueError` and are reported through the `OutputManager`.\n\nEach configuration is validated by `_manufacture_crop_configuration`, which coerces the `plant_category` string into a `PlantCategory` enum and builds a `CropConfiguration` TypedDict. `create_crop_data(crop_type)` then instantiates a `CropData` from the stored configuration, raising `ValueError` for unknown crop types.\n\nThe field manager queries available crops via `get_available_crop_configurations()` and can inspect full configurations via `get_full_crop_configurations()`.\n\n## Integration with the Rest of RUFAS\n\n- **Field layer** — `Field` owns `Crop` instances, calls `perform_daily_crop_update`, `cycle_water_for_crop`, `handle_water_in_canopy`, `assess_dormancy`, and `manage_crop_harvest`, and passes `FieldData` / `SoilData` / `CurrentDayConditions` into the crop.\n- **Soil layer** — the crop reads nutrients and water from `SoilData` soil layers and writes residue back via `CropManagement._transfer_residue` and `Dormancy.enter_dormancy`. Root residue is distributed across layers using the same root-distribution function used for live root growth.\n- **Input/Output** — `CropDataFactory` consumes user input through `InputManager`; `CropManagement` and the process components report errors, warnings, and harvest-yield variables through `OutputManager`.\n- **Feed storage** — harvested material is packaged as `HarvestedCrop` and passed to the feed storage system, with dry-matter mass converted from per-hectare to field-total using `field_size`.\n- **Time** — `RufasTime` supplies planting dates, harvest dates, and the current Julian day for root development.\n\n## References\n\nThe module cites the following sources in its docstrings:\n\n- SWAT Theoretical Documentation, sections 5:1.1–5:3.3 (plant growth, heat units, dormancy, biomass, harvest, stress).\n- Fan, Jianling, et al. \"Root distribution by depth for temperate agricultural crops.\" *Field Crops Research* 189 (2016): 68–74.\n- SWAT Appendix A — Model Databases (crop parameter tables).","data-structures":"# Data Structures\n\n# Data Structures Module\n\n## Overview\n\nThe `RUFAS/data_structures` module defines the data contracts that carry information between the major simulation modules of the RUFAS (Ruminant Farm Systems) model. It contains no simulation logic itself; instead, it provides the dataclasses, enums, and helper classes that the Animal, Manure, Crop/Soil, and Feed Storage modules use to exchange data.\n\nThe module is organized around **connection points** — each file (or group of files) defines the structures that cross a specific module boundary:\n\n| File | Purpose |\n|------|---------|\n| `animal_to_manure_connection.py` | Manure streams produced by animals and passed to manure processing |\n| `manure_to_crop_soil_connection.py` | Nutrient requests from fields and the manure module's response |\n| `crop_soil_to_feed_storage_connection.py` | Harvested crop data passed to feed storage |\n| `feed_storage_to_animal_connection.py` | Feed definitions, inventories, and purchase requests |\n| `events.py` | Scheduled field management events (planting, harvest, tillage, manure, fertilizer) |\n| `manure_nutrients.py` | Accumulated manure nutrient summaries for crop/soil application |\n| `manure_types.py`, `manure_supplement_methods.py`, `tillage_implements.py` | Shared enums |\n\n```mermaid\ngraph LR\n    A[Animal Module] -->|ManureStream| M[Manure Module]\n    M -->|ManureNutrients| C[Crop/Soil Module]\n    C -->|NutrientRequest| M\n    C -->|HarvestedCrop| F[Feed Storage Module]\n    F -->|Feed / RequestedFeed| A\n    E[Events] --> C\n    E --> M\n```\n\n## Manure Streams (Animal → Manure)\n\n### `StreamType`\n\nAn enum distinguishing manure that originates in the milking parlor (`PARLOR`) from all other manure (`GENERAL`). This distinction matters because parlor manure follows a different processing path.\n\n### `PenManureData`\n\nA dataclass describing the pen context in which manure was produced. It tracks:\n\n- **Animal context**: `num_animals`, `animal_combination`, `pen_type`\n- **Manure quantities**: `manure_urine_mass`, `manure_urine_nitrogen`\n- **Deposition area**: `manure_deposition_surface_area` (m²)\n- **Stream classification**: `stream_type` (`StreamType`)\n- **Processing metadata**: `first_processor`, `total_bedding_mass`, `total_bedding_volume`\n\nValidation in `__post_init__` enforces a domain rule: parlor manure can only come from lactating cows (`AnimalCombination.LAC_COW`).\n\nTwo mutators are provided:\n\n- `set_first_processor(processor_name)` — records which manure processor first handles the stream.\n- `set_bedding_mass_and_volume(mass, volume)` — records bedding added to the stream.\n\n`__add__` combines two `PenManureData` instances, but only under strict conditions:\n\n- Neither may be `StreamType.GENERAL`.\n- The `animal_combination` values must match.\n- The `first_processor` values must match.\n\nThe combined instance has `pen_type=None` and sums all numeric fields.\n\n### `ManureStream`\n\nThe primary data carrier between the Animal and Manure modules, and between successive manure processors. It holds mass balances for:\n\n- **Nutrients**: `water`, `ammoniacal_nitrogen`, `nitrogen`, `phosphorus`, `potassium`, `ash`\n- **Solids**: `degradable_volatile_solids`, `non_degradable_volatile_solids`, `bedding_non_degradable_volatile_solids`, `total_solids`\n- **Physical properties**: `volume`, `methane_production_potential`\n- **Context**: `pen_manure_data` (optional `PenManureData`)\n\n#### Computed properties\n\n- `total_volatile_solids` — sum of all three volatile solids components.\n- `mass` — `water + total_solids`.\n- `is_empty` — `True` when all mass/volume fields are zero and `pen_manure_data` is `None`.\n\n#### Operations\n\n- **`__add__`** — Combines two streams by summing all mass fields. `methane_production_potential` is combined as a **volatile-solids-weighted average**, not a simple sum, because it is an intensive property (m³ CH₄ per kg VS). `pen_manure_data` is combined only if both operands have it.\n- **`split_stream(split_ratio, stream_type=None, manure_stream_deposition_split=None)`** — Produces a new stream containing `split_ratio` of each mass component. The split ratio must be in `(0, 1]`; invalid values raise `ValueError` and log an error via `OutputManager`. When splitting, the new stream's `pen_manure_data` (if any) receives the same `num_animals` but a scaled `manure_deposition_surface_area` — scaled by `manure_stream_deposition_split` if provided, otherwise by `split_ratio`. The `stream_type` argument overrides the type on the new stream's pen data.\n- **`make_empty_manure_stream()`** — Class factory returning a zeroed stream with `pen_manure_data=None`. Widely used by manure storage and digester code to initialize accumulators.\n- **`clear_pen_manure_data()`** — Drops the pen context from a stream.\n\n## Manure ↔ Crop/Soil Connection\n\n### `NutrientRequest`\n\nA frozen, keyword-only dataclass representing a field's request for manure nutrients. Fields:\n\n- `nitrogen`, `phosphorus` — requested masses (kg).\n- `manure_type` — `ManureType.LIQUID` or `ManureType.SOLID`.\n- `use_supplemental_manure` — whether off-farm manure may be used if on-farm supply is insufficient.\n- `use_daily_spread_source` — whether to draw first from `DailySpread` processors.\n- `spread_all_available_manure` — if `True`, take all available daily-spread manure regardless of nutrient targets.\n\nValidation in `__post_init__` requires at least one positive nutrient mass unless one of the three boolean flags is set.\n\n### `NutrientRequestResults`\n\nA frozen dataclass describing the manure that can actually be supplied. In addition to `nitrogen`, `phosphorus`, `total_manure_mass`, and `dry_matter`, it carries composition fractions:\n\n- `organic_nitrogen_fraction` / `inorganic_nitrogen_fraction` (must sum to 1)\n- `ammonium_nitrogen_fraction` (fraction of inorganic N that is ammonium)\n- `organic_phosphorus_fraction` / `inorganic_phosphorus_fraction` (must sum to 1)\n- `dry_matter_fraction`\n\n`__add__` combines two result sets, computing **mass-weighted averages** for all fraction fields rather than simple sums. All fractions are clamped to `[0, 1]` via `Utility.clamp`.\n\n### `FieldManureSupplier`\n\nA static utility that converts a `NutrientRequest` into a `NutrientRequestResults` using fixed conversion ratios defined at module level. The ratios (dry-mass-to-wet-mass, nitrogen-to-dry-mass, phosphorus-to-dry-mass) are derived from the ManureDB dataset and differ for liquid vs. solid manure (see `TYPE_TO_CONSTANTS_MAP`).\n\nThe logic in `request_nutrients`:\n\n1. Project the dry mass implied by each requested nutrient (`N × ratio_N`, `P × ratio_P`).\n2. Take the **minimum** of the two projected dry masses as the limiting factor.\n3. Back-calculate the actual N and P masses from that limiting dry mass.\n4. Convert dry mass to wet mass and compute the dry matter fraction.\n\nThis ensures the response never exceeds the requested amount of either nutrient.\n\n### Named tuples\n\n- `ManureEventNutrientRequest` — couples a `ManureEvent` with its `NutrientRequest` for a given field.\n- `ManureEventNutrientRequestResults` — couples a `ManureEvent` with the resulting `NutrientRequestResults`.\n\n## Manure Nutrients (Manure → Crop/Soil)\n\n### `ManureNutrients`\n\nA frozen, keyword-only dataclass summarizing accumulated manure nutrients for field application. Unlike `ManureStream` (which tracks detailed solids fractions), this is a simplified aggregate: `nitrogen`, `phosphorus`, `potassium`, `dry_matter`, `total_manure_mass`, plus a `manure_type`.\n\nEach field has a paired `*_unit` field (e.g., `nitrogen_unit`) holding a `MeasurementUnits` value. The `units_dict` property collects these into a dictionary.\n\nValidation in `__post_init__` rejects negative numeric values and non-`ManureType` manure types.\n\n#### Arithmetic operations\n\n- **`__add__`** — Sums all numeric fields. Both operands must have the same `manure_type`; otherwise `TypeError` is raised.\n- **`__sub__`** — Subtracts field-by-field. Raises `ValueError` if any field in the subtrahend exceeds the corresponding field in the minuend.\n- **`__mul__` / `__rmul__`** — Scales all numeric fields by a non-negative scalar.\n- **`reset_values()`** — Returns a new instance with all numeric fields zeroed but `manure_type` and units preserved.\n\nComposition properties (`dry_matter_fraction`, `nitrogen_composition`, `phosphorus_composition`) return 0.0 when `total_manure_mass` is zero.\n\n## Harvested Crop (Crop/Soil → Feed Storage)\n\n### `HarvestedCrop`\n\nA dataclass representing a crop cut from a field and delivered to feed storage. It carries:\n\n- **Identity**: `config_name`, `field_name`\n- **Timing**: `harvest_time`, `storage_time`, `last_time_degraded`\n- **Mass**: `dry_matter_mass`, `dry_matter_percentage`, plus initial values (`initial_dry_matter_mass`, `initial_dry_matter_percentage`) captured at storage time\n- **Quality**: `dry_matter_digestibility`, `crude_protein_percent`, `non_protein_nitrogen`, `starch`, `adf`, `ndf`, `lignin`, `sugar`, `ash`\n- **Storage-specific values**: `estimated_maximum_effluent` (silage), `bale_density` and `total_sensible_heat_generated` (hay)\n- **Bookkeeping**: `recorded_days` (set of simulation days on which the crop was recorded)\n\n`__post_init__` computes the storage-specific values via private methods and converts any `RufasTime` inputs to `date` objects.\n\n#### Key methods\n\n- **`fresh_mass`** (property) — `dry_matter_mass / dry_matter_fraction`.\n- **`is_alfalfa`** (property) — `True` if `\"alfalfa\"` appears in `config_name` (case-insensitive).\n- **`remove_dry_matter_mass(mass_to_remove)`** — Removes dry matter while keeping the dry matter percentage unchanged (recomputes it from the new fresh mass). Clamps at zero.\n- **`remove_feed_mass(dm_to_remove)`** — Removes dry matter, raising `ValueError` if the requested amount exceeds what is available.\n- **`estimate_maximum_effluent()`** — Computes the total effluent loss for ensiled crops. The calculation uses `EFFLUENT_MAXIMUM_DRY_MATTER_FRACTION` (0.3) as a cap: crops drier than 30% DM experience no effluent loss.\n- **`_calculate_bale_density()`** — Empirical formula for hay bale density (kg/m³) as a function of dry matter percentage.\n- **`_calculate_total_sensible_heat_generated()`** — Empirical formula for heat generation (kJ/kg) from moisture fraction and bale density.\n\n## Feed Storage ↔ Animal Connection\n\n### Feed definitions\n\n- **`Feed`** — Base dataclass with the full set of nutritional attributes (DM, CP, ADF, NDF, starch, minerals, etc.), plus economic fields (`on_farm_cost`, `purchase_cost`, `buffer`) and usage limits (`limit`, `lower_limit`).\n- **`NASEMFeed(Feed)`** — Extends `Feed` with NASEM-specific attributes (amino acids, fatty acid profiles, vitamin and mineral details, digestibility values).\n- **`NRCFeed(Feed)`** — Extends `Feed` with NRC-specific attributes (`non_fiber_carb`, `PAF`).\n\nThe `FeedCategorization`, `FeedComponentType`, and `NutrientStandard` enums classify feeds and select the nutrient standard.\n\n### `AvailableFeedsBuilder`\n\nA static utility that constructs the list of feeds available in a simulation. The pipeline in `setup_available_feeds`:\n\n1. Load the feed library (`NASEM_Comp` or `NRC_Comp`) from `InputManager`.\n2. Convert the library from a dict-of-lists to a list-of-dicts via `Utility.convert_dict_of_lists_to_list_of_dicts`.\n3. Translate string enum values into `FeedComponentType`, `FeedCategorization`, and `MeasurementUnits` instances.\n4. Validate the user's feed configuration against the library.\n5. Build `NASEMFeed` or `NRCFeed` instances, computing `on_farm_cost` as 1% of the purchase price (`ON_FARM_TO_PURCHASED_PRICE_RATIO`).\n6. Return the feeds sorted by `rufas_id`.\n\n`_validate_feed_config` enforces four rules:\n\n- Every configured feed type must exist in the selected library.\n- No duplicate feed types in the top-level `feeds` section.\n- No duplicate feed types within any individual ration.\n- Every ration feed must be defined in the top-level `feeds` section.\n\n### Inventory and purchase structures\n\n- **`TotalInventory`** — Maps `RUFAS_ID` → available mass (kg) at a given `inventory_date`.\n- **`IdealFeeds`** — Maps `RUFAS_ID` → ideal purchase amount before the next harvest.\n- **`RequestedFeed`** — Maps `RUFAS_ID` → feed amount needed by the herd. Supports `__add__` (combines two requests) and `__mul__`/`__rmul__` (scales all amounts).\n- **`FeedFulfillmentResults`** — Tracks how much feed was deducted from `purchased` vs. `farmgrown` sources. Provides class factories (`fulfill_feed_request_as_purchased`, `empty`) and mutators (`add_purchased`, `add_farmgrown`, `total_deducted_for_feed`).\n\n### Purchase allowances\n\n`PurchaseAllowance` is a base class that parses feed-config data into a `{feed_id: max_amount}` dictionary. Three subclasses differ only in which config key they read:\n\n- `PlanningCycleAllowance` — `\"planning_cycle_allowance\"` (between harvests)\n- `AdvancePurchaseAllowance` — `\"advance_purchase_allowance\"` (start of ration interval)\n- `RuntimePurchaseAllowance` — `\"runtime_purchase_allowance\"` (daily)\n\n## Field Management Events\n\n`BaseFieldManagementEvent` is the base class for scheduled operations. Each event is identified by a `(year, day)` pair (simulation year and Julian day). The base class provides:\n\n- `occurs_today(time)` — checks against a `RufasTime` object.\n- `date_occurs` — converts `(year, day)` to a `date`.\n- `__eq__` and `__hash__` based on `(year, day)`.\n\nFive concrete event types extend the base:\n\n| Event | Purpose | Distinguishing fields |\n|-------|---------|----------------------|\n| `PlantingEvent` | Schedule a crop planting | `crop_reference`, `use_heat_scheduled_harvest` |\n| `HarvestEvent` | Schedule a harvest operation | `crop_reference`, `operation` (`HarvestOperation` enum) |\n| `TillageEvent` | Schedule tillage | `tillage_depth`, `incorporation_fraction`, `mixing_fraction`, `implement` (`TillageImplement`) |\n| `ManureEvent` | Request manure application | `nitrogen_mass`, `phosphorus_mass`, `manure_type`, `manure_supplement_method`, `field_coverage`, `application_depth`, `surface_remainder_fraction`, plus daily-spread flags |\n| `FertilizerEvent` | Schedule fertilizer application | `mix_name`, `nitrogen_mass`, `phosphorus_mass`, `potassium_mass`, `depth`, `surface_remainder_fraction` |\n\nEach subclass overrides `__eq__` and `__hash__` to include its specific fields, so events with identical timing but different parameters are distinct.\n\n## Shared Enums\n\n- **`ManureType`** — `LIQUID`, `SOLID`.\n- **`ManureSupplementMethod`** — `NONE`, `SYNTHETIC_FERTILIZER`, `MANURE`, `SYNTHETIC_FERTILIZER_AND_MANURE`.\n- **`TillageImplement`** — `SUBSOILER`, `MOLDBOARD_PLOW`, `COULTER_CHISEL_PLOW`, `DISK_HARROW`, `CULTIVATOR`, `SEEDBED_CONDITIONER`.\n- **`TractorSize`** — `SMALL`, `MEDIUM`, `LARGE`.\n- **`OperationType`** — Field operation types (planting, tilling, manure/fertilizer application, mowing, collection, windrowing).\n- **`FieldOperationEvent`** — Event categories (harvest, fertilizer, manure, planting, tilling).\n\n`EnumWithStrOverride` is a small base class making `str(enum_member)` return the member's value rather than the default `EnumName.MEMBER` representation.\n\n## Design Patterns\n\nSeveral conventions recur throughout this module:\n\n- **Dataclasses with unit dictionaries** — `PenManureData`, `ManureStream`, and `ManureNutrients` each expose a `*_UNITS` class attribute or paired `*_unit` fields, allowing downstream code to report values with correct units.\n- **Arithmetic operators on data carriers** — `__add__`, `__sub__`, `__mul__` are implemented on the stream and nutrient types so that combining or splitting manure is expressed naturally. Intensive properties (fractions, methane potential) are combined as weighted averages, not sums.\n- **Frozen dataclasses for requests/results** — `NutrientRequest`, `NutrientRequestResults`, and `ManureNutrients` are frozen to prevent accidental mutation after construction.\n- **Validation in `__post_init__`** — Domain invariants (non-negative masses, matching manure types, valid enum values, fraction sums equal to 1) are enforced at construction time.\n- **Class factories** — `make_empty_manure_stream()` and `FeedFulfillmentResults.empty()` provide canonical zero-value instances used throughout the manure and feed modules.","eee":"# EEE\n\n# EEE Module Documentation\n\n## Overview\n\nThe EEE module estimates the environmental and energy impacts of farm operations. It coordinates three primary estimation workflows:\n\n- **Emissions estimation** — Estimates nitrous oxide (N₂O) and ammonia (NH₃) emissions from purchased and farmgrown feeds, plus the resources (fertilizer N, P, K, and manure N) used in their production.\n- **Energy estimation** — Estimates diesel fuel consumption for tractor-implement operations across planting, harvesting, tillage, and fertilizer/manure applications.\n\nThe module is designed to be called once per simulation day, accumulating daily values and reporting them as daily variables to the `OutputManager`.\n\n---\n\n## How It Works\n\nThe EEE module is structured as a pipeline that processes field operation data from the simulation's `OutputManager`, calculates per-hectare emissions and resource use, and reports the results back to the `OutputManager` as daily variables.\n\n### Execution Flow\n\n1. **`EEEManager.estimate_all()`** is the entry point. It calls:\n   - `EmissionsEstimator.estimate_farmgrown_feed_emissions()` — for emissions and resource estimation.\n   - `EnergyEstimator.estimate_all()` — for diesel consumption estimation.\n\n2. **`EmissionsEstimator`** parses the `OutputManager` variables pool to extract:\n   - N₂O and NH₃ emissions data.\n   - Manure and fertilizer application data.\n   - Harvest data (crop yield, harvest type).\n   - Farmgrown feed deductions and inventory data.\n\n3. **`EnergyEstimator`** parses the `OutputManager` variables pool to extract:\n   - Field operation events (planting, harvesting, tillage, fertilizer/manure application).\n   - Tractor and implement specifications.\n   - Diesel consumption rates.\n\n4. **`Tractor` and `TractorImplement`** encapsulate the physical specifications needed for the energy calculations, including tractor size, PTO power, mass, speed, and implement-specific coefficients.\n\n---\n\n## Key Components\n\n### 1. `EEEManager`\n\nThe main entry point for the EEE module. It coordinates the emissions and energy estimation pipelines.\n\n| Method | Description |\n|------|-------------|\n| `estimate_all(simulate_animals, simulate_feed, simulate_fields, simulate_manure)` | Runs all emissions and energy estimations and records the results to the `OutputManager`. |\n\n### 2. `EmissionsEstimator`\n\nHandles the estimation of emissions and resources associated with feed production.\n\n| Method | Description |\n|------|-------------|\n| `estimate_farmgrown_feed_emissions()` | Estimates N₂O and NH₃ emissions and resources for farmgrown feeds. |\n| `calculate_purchased_feed_emissions(purchased_feeds)` | Calculates emissions from purchased feeds and land use changes. |\n| `check_available_purchased_feed_data(available_feed_ids)` | Validates that all feed IDs have emissions data available. |\n\n### 3. `EnergyEstimator`\n\nHandles the estimation of diesel consumption for field operations.\n\n| Method | Description |\n|------|-------------|\n| `estimate_all(simulate_animals, simulate_feed, simulate_fields, simulate_manure)` | Runs the diesel consumption estimation for all field operations. |\n| `calculate_diesel_consumption(crop_yield, field_production_size, tractor, clay_percent, application_mass, application_dm_content)` | Calculates diesel consumption for a single tractor-implement operation. |\n| `report_diesel_consumption(...)` | Reports diesel consumption data for a specific tractor-implement operation. |\n\n### 4. `Tractor`\n\nRepresents the specifications of a tractor for a given field operation.\n\n| Property | Description |\n|---------|-------------|\n| `operation_event` | The type of field operation (e.g., `HARVEST`, `PLANTING`, `TILLING`). |\n| `crop_type` | The type of crop for which the tractor is intended. |\n| `tractor_size` | The size of the tractor (`SMALL`, `MEDIUM`, `LARGE`). |\n| `PTO_kW` | Power take-off power available from the tractor (kW). |\n| `power_available_kW` | Power available from the tractor (kW). |\n| `mass_kg` | Mass of the tractor (kg). |\n| `speed_km_hr` | Travel speed of the tractor (km/hr). |\n| `calculate_axel_power(implement)` | Calculates the total axle power required to move the tractor and implement (kW). |\n\n### 5. `TractorImplement`\n\nRepresents the specifications of a tractor implement.\n\n| Property | Description |\n|---------|-------------|\n| `field_speed_km_per_hr` | The field speed of the implement (km/hr). |\n| `field_efficiency` | The field efficiency of the implement (unitless). |\n| `field_capacity_ha_per_hr(...)` | Calculates the field capacity for a specific crop, field operation, and tractor implement (ha/hr). |\n| `calculate_operation_time_hr(...)` | Calculates the number of hours taken by a tractor to perform the operation (hr). |\n| `calculate_drawbar_power(clay_percent)` | Calculates the drawbar power required by the implement for forward propulsion (kW). |\n| `calculate_needed_PTO(...)` | Calculates the power take-off (PTO) power needed to power the implement's operation (kW). |\n\n---\n\n## Data Flow\n\nThe following diagram illustrates the flow of data through the EEE module:\n\n```mermaid\nflowchart TD\n    A[Simulation Engine] --> B[EEEManager.estimate_all]\n    B --> C[EmissionsEstimator.estimate_farmgrown_feed_emissions]\n    B --> D[EnergyEstimator.estimate_all]\n    C --> E[Parse emissions data]\n    C --> F[Parse resource data]\n    C --> G[Parse harvest data]\n    D --> H[Parse field operation data]\n    D --> I[Calculate diesel consumption]\n    E --> J[Calculate N2O emissions]\n    E --> K[Calculate NH3 emissions]\n    F --> L[Calculate fertilizer N, P, K]\n    F --> M[Calculate manure N]\n    G --> N[Calculate dry yield]\n    H --> O[Determine tractor size]\n    I --> P[Calculate total power needed]\n    J --> Q[Report daily variables]\n    K --> Q\n    L --> Q\n    M --> Q\n    N --> Q\n    O --> Q\n    P --> Q\n    Q[OutputManager]\n```\n\n---\n\n## Integration with the Rest of the Codebase\n\nThe EEE module is called from the simulation engine after all other modules have been processed. It relies on:\n\n- **`InputManager`** — to retrieve configuration data such as the simulation start date, FIPS county code, and EEE constants.\n- **`OutputManager`** — to filter the variables pool and report results as daily variables.\n- **`RufasTime`** — to convert event dates to simulation day offsets.\n- **`MeasurementUnits`** — to define the units for the reported variables.\n- **`RUFAS_ID`** — to identify feed IDs in the simulation.\n\n### Dependencies\n\n| Dependency | Purpose |\n|-----------|---------|\n| `RUFAS.input_manager.InputManager` | Retrieves configuration data. |\n| `RUFAS.output_manager.OutputManager` | Filters variables and reports results. |\n| `RUFAS.rufas_time.RufasTime` | Converts dates to simulation days. |\n| `RUFAS.units.MeasurementUnits` | Defines units for reported variables. |\n| `RUFAS.data_structures.tillage_implements` | Defines enums for field operations, tillage implements, tractor sizes, and operation types. |\n| `RUFAS.biophysical.field.crop.harvest_operations.HarvestOperation` | Defines harvest operation types. |\n| `RUFAS.util.Utility` | Provides utility functions for key generation and data conversion. |\n\n---\n\n## Usage\n\nThe EEE module is invoked once per simulation day. The simulation engine calls `EEEManager.estimate_all()` after all other modules have been processed.\n\n```python\n# Inside the simulation engine:\nfrom RUFAS.EEE.EEE_manager import EEEManager\n\n# ... after all other modules have been processed:\nEEEManager.estimate_all(\n    simulate_animals=simulate_animals,\n    simulate_feed=simulate_feed,\n    simulate_fields=simulate_fields,\n    simulate_manure=simulate_manure,\n)\n```\n\nThe `simulate_*` flags control whether the corresponding modules were initialized and used during the simulation. If a module was not simulated, its corresponding calculations are skipped.","helpful-scripts":"# Helpful Scripts\n\n# Emissions Interpolation Script\n\n## Overview\n\nThe emissions interpolation script fills gaps in county-level feed emissions data. When a county reports a zero value for a feed's emissions—interpreted as missing data rather than a true zero—the script replaces it with the average of non-zero values from neighboring counties in the same state. The search radius expands iteratively until non-zero neighbors are found, with a hard cap of 5,000 km.\n\nThe script operates on emissions spreadsheets in `input/data/EEE/`, keyed by FIPS county codes, and writes interpolated results back to the `helpful_scripts/emissions_interpolation/` directory. It also has an optional post-processing step that fills residual zeros for two wheat feed IDs using USDA regional averages.\n\n## Configuration\n\nFour user-defined settings at the top of the script control its behavior:\n\n| Setting | Purpose |\n|---|---|\n| `EEEname` | Base name of the emissions dataset to process (must correspond to a file at `input/data/EEE/{EEEname}.csv`). The script is designed to be run once per dataset—the comment notes it must be run twice, reordering the assignment, if the algorithm should be applied to both the land-use-change and base emissions files. |\n| `km_radius_start` | Starting search radius (in km) for neighbor discovery. Defaults to 50. |\n| `feed_source_choice` | Filters which feeds to interpolate, matching one of the options in the `EF_Source` column of the feed library CSV (e.g., `\"Foods3\"`). Only feeds whose `RuFaS ID` falls under this source are eligible for interpolation. |\n| `use_wheat_regional_average` | When `True`, applies regional averages for wheat feed IDs `193` and `197` to counties that still have zero values after neighbor interpolation. Output filenames use the `_regional_average` suffix. |\n\n## Input Data Files\n\nAll reference data is loaded from `helpful_scripts/emissions_interpolation/` unless otherwise noted:\n\n| File | Contents |\n|---|---|\n| `geonames_US.csv` | Zip code → latitude/longitude mapping. |\n| `COUNTY_ZIP_032010.csv` | FIPS county code → Zip code mapping. |\n| `Feed Emissions Source RuFaS_Feed_Library_Combined_Final.csv` | Feed metadata; the `EF_Source` and `RuFaS ID` columns drive the source filter. |\n| `fips_to_region.csv` | FIPS county code → USDA region mapping (used only for the wheat fallback). |\n| `{EEEname}_wheat_regional_averages.csv` | Regional wheat emissions averages (loaded from `input/data/EEE/`). |\n| `input/data/EEE/{EEEname}.csv` | The target emissions dataset: one row per county (`county_code` column), one column per feed (identified by `RuFaS ID`). |\n\n## Core Helper Functions\n\n### `get_statecode(county_code)`\nExtracts the two-digit state FIPS prefix from a five-digit county FIPS code (zero-padded).\n\n### `get_zips_from_fips(fips_to_county_sheet, fips_code)`\nReturns the list of Zip codes belonging to a county, looked up in `COUNTY_ZIP_032010.csv`.\n\n### `get_latlong_from_zip(zip_to_latlong_sheet, zipcodes)`\nComputes the average latitude/longitude of a list of Zip codes. If a Zip code is not found in the geonames sheet, it is skipped with a console message. Returns `(0.0, 0.0)` and `[(0.0, 0.0)]` if no Zip codes resolve.\n\n### `haversine(lat1, lon1, lat2, lon2)`\nGreat-circle distance between two GPS points in kilometers (Earth radius = 6371 km).\n\n### `points_within_radius(reference_point, points, radius)`\nReturns `(close_points, close_distances)` — all points strictly within `radius` km of `reference_point`. Points at distance exactly 0.0 are excluded (the reference point itself or duplicate coordinates).\n\n### `get_neighbors(fips_code, fips_code_list)`\nA stub that currently returns `[fips_code]` — unused by the main algorithm, likely a placeholder for a future neighbor-search strategy.\n\n## Interpolation Algorithm\n\nThe pipeline proceeds in four stages.\n\n### 1. Build a GPS map for every county\n\nFor each `county_code` in the emissions dataset, the script looks up Zip codes via `get_zips_from_fips`, then averages their coordinates via `get_latlong_from_zip`. The resulting `fips_gps_map` is a parallel list to `county_codes`, one averaged coordinate per row.\n\n```mermaid\nflowchart LR\n    A[Emissions CSV] --> B[county_codes]\n    B --> C[\"get_zips_from_fips<br/>for each county\"]\n    C --> D[\"get_latlong_from_zip<br/>average coordinates\"]\n    D --> E[fips_gps_map]\n```\n\n### 2. Identify feeds eligible for interpolation\n\nThe eligible feed IDs are collected from the feed library:\n\n```python\nfeed_ids_to_check = feed_source[feed_source[\"EF_Source\"] == feed_source_choice][\"RuFaS ID\"].tolist()\n```\n\nOnly rows where the feed column value is `0.0` *and* the feed ID is in this list are processed.\n\n### 3. Neighbor search and value replacement\n\nFor each county and eligible feed with a zero value:\n\n1. Build a list of GPS points for counties in the **same state**, excluding the target county.\n2. Call `points_within_radius` with the current radius (starting at `km_radius_start`).\n3. While no points were found within the radius **or** no non-zero neighbor values have been accumulated:\n   - Iterate over the found neighbor points; convert each back to a county index via `fips_gps_map.index(gps)`.\n   - If the neighbor's value for this feed is non-zero, append it (and its distance) to `neighbor_values` / `neighbor_distances`.\n   - Expand the radius by 50 km and re-run `points_within_radius`.\n   - Abort if the radius exceeds 5,000 km.\n4. If any neighbor values were found, replace the county's zero with `np.mean(neighbor_values)` in `emissions_copy`; otherwise record a \"could not find neighbor within state\" entry.\n\n**Notes on the loop semantics:** `neighbor_values` accumulates across radius expansions rather than being reset each iteration, so the final average reflects all non-zero neighbors found at or below the final radius. Neighbor values are not distance-weighted. The lookup `fips_gps_map.index(gps)` returns the *first* county with matching coordinates; duplicate coordinates across counties could therefore alias to the wrong neighbor.\n\n### 4. Wheat regional average fallback (optional)\n\nWhen `use_wheat_regional_average` is `True`, after neighbor interpolation the script scans feed columns `\"193\"` and `\"197\"` (wheat middlings) for remaining zeros. For each such county:\n\n- Look up its region in `fips_to_region.csv`.\n- Map non-standard region names: `New.England` and `Great.Lakes` → `Northeast`; `Upper.Midwest` → `Northern.Plains`.\n- Look up the region's wheat average in `{EEEname}_wheat_regional_averages.csv` and write it in.\n\n## Outputs\n\nThe script writes two files per run:\n\n| `use_wheat_regional_average` | Emissions output | Detailed diagnostics |\n|---|---|---|\n| `True` | `{EEEname}_interpolated_regional_average.csv` | `{EEEname}_interpolated_regionalavg_detailed.csv` |\n| `False` | `{EEEname}_interpolated.csv` | `{EEEname}_interpolated_detailed.csv` |\n\nAll outputs go to `helpful_scripts/emissions_interpolation/`.\n\nThe detailed file contains one row per (county, feed) replacement event with columns:\n\n- `county_code` — target county\n- `gps_county` — target county's average GPS coordinate\n- `feed_id` — feed column identifier\n- `neighbor_values` — list of non-zero neighbor values used in the average\n- `neighbor_distances` — corresponding distances (km) of those neighbors\n\nIf a county never found neighbors within the state, the row records the string `\"could not find neighbor within state\"` in the `neighbor_values` column and the final search radius in `neighbor_distances`.\n\n## Known Caveats\n\n- **Duplicate GPS lookup**: `fips_gps_map.index(gps)` picks the first matching county, so duplicate coordinates between counties in the same state will silently resolve to the first occurrence rather than the actual neighbor. Uniqueness of county coordinates is implicitly assumed.\n- **Zero values are always treated as missing**: the script cannot distinguish a true zero emissions value from a missing-data placeholder; every zero for an eligible feed is overwritten.\n- **State boundary constraint**: neighbors are restricted to the same state, so border counties with no in-state non-zero neighbors may remain zero despite nearby out-of-state data.\n- **Unused variable**: `neighbor_county_code` is assigned inside the neighbor loop but never used; likely intended for diagnostics.\n- **Stub function**: `get_neighbors` is a placeholder returning `[fips_code]` and is not called anywhere in the pipeline.\n- **FIPS increment loop**: the county-to-GPS mapping loop mutates `fips_code` locally (increments it) when a county has no Zip codes, retrying with the next integer. This handles FIPS code gaps in the Zip mapping but relies on the increment staying within the same state, as enforced by the `while` condition.","input-output-and-validation":"# Input/Output and Validation\n\n# Input/Output and Validation Module\n\n## Overview\n\nThe Input/Output and Validation module is the data backbone of the RuFaS simulation framework. It is responsible for:\n\n- Loading and validating simulation input data against metadata-defined schemas\n- Storing validated inputs in a central, singleton-managed pool\n- Providing dot-notation access to input data and metadata throughout the simulation\n- Collecting simulation outputs (variables, logs, warnings, errors) into structured pools\n- Controlling console verbosity and persisting outputs to files\n\nThe module is implemented primarily by two singleton classes:\n\n- **`InputManager`** (`RUFAS/input_manager.py`) — owns the input data lifecycle: metadata loading, properties resolution, file ingestion, validation, runtime updates, and data access.\n- **`OutputManager`** (`RUFAS/output_manager.py`) — owns the output data lifecycle: variable reporting, log/warning/error collection, verbosity control, pool overflow management, and output serialization.\n\nValidation logic itself lives in `RUFAS/data_validator.py`, which provides `DataValidator`, `CrossValidator`, `ElementsCounter`, and the `Modifiability` enum. The `InputManager` delegates all value-level and cross-variable validation to these components.\n\n## Architecture\n\nThe input pipeline is orchestrated by `InputManager.start_data_processing()`, which chains metadata loading, structural validation, properties loading, pool population, and cross-validation:\n\n```mermaid\nflowchart TD\n    A[\"start_data_processing()\"] --> B[\"_load_metadata()\"]\n    B --> C[\"_validate_required_file_blobs()\"]\n    C --> D[\"validate_metadata()\"]\n    D --> E[\"_load_properties()\"]\n    E --> F[\"validate_properties()\"]\n    F --> G[\"_populate_pool()\"]\n    G --> H[\"_load_data_from_json() / _load_data_from_csv()\"]\n    G --> I[\"validate_data_by_type()\"]\n    F --> J[\"_cross_validate_data()\"]\n    J --> K[\"cross_validate_data()\"]\n```\n\nOnce the pool is populated, model components read inputs via `InputManager.get_data()` and report outputs via `OutputManager.add_variable()`. Both managers are singletons, so all components share the same pools throughout a simulation run.\n\n## InputManager\n\n### Singleton lifecycle\n\n`InputManager` is a singleton. The first call to `InputManager()` creates the instance and initializes all internal state; subsequent calls return the existing instance. The `__init__` method guards state initialization with `if InputManager.__instance is None`, so re-invocation only updates `metadata_depth_limit` (defaulting to `7`).\n\nKey internal state:\n\n| Attribute | Purpose |\n|---|---|\n| `__metadata` | The loaded metadata document (JSON-derived dict). |\n| `__pool` | Validated input data, keyed by file blob name. |\n| `__get_data_logs_pool` | Timestamped log entries for every `get_data()` call. |\n| `__delete_data_logs_pool` | Timestamped log entries for every deletion event. |\n| `elements_counter` | `ElementsCounter` tracking validation element counts. |\n| `data_validator` | `DataValidator` instance for value-level validation. |\n| `cross_validator` | `CrossValidator` instance for cross-variable validation. |\n| `csv_report_generation_list` | File blob keys to include in CSV export. |\n\n### Data processing pipeline\n\nThe main entry point is `start_data_processing(metadata_path, input_root, task_id, cross_validation_file_paths, eager_termination)`. It performs the following steps:\n\n1. **Load metadata** — `_load_metadata()` reads the JSON metadata document from `input_root / metadata_path` into `__metadata`.\n2. **Validate required file blobs** — `_validate_required_file_blobs()` checks that every entry in `REQUIRED_FILE_BLOBS` is present under the metadata's `files` key (`ADDRESS_TO_INPUTS`). Missing blobs raise `ValueError`. This step is skipped when `task_id == \"TASK MANAGER\"`.\n3. **Validate metadata structure** — `data_validator.validate_metadata()` checks that each file entry has a valid `type` (one of `VALID_INPUT_TYPES`) and a resolvable `path` or `paths`.\n4. **Load properties** — `_load_properties()` reads the three property files in `PROPERTIES_FILE_PATHS` (default, tasks, commodity) and merges them into `__metadata[\"properties\"]`.\n5. **Validate properties** — `data_validator.validate_properties()` recursively validates the merged properties against the metadata, bounded by `metadata_depth_limit`.\n6. **Populate the pool** — `_populate_pool()` loads every input file referenced in `metadata[\"files\"]`, validates each variable against its metadata properties, attempts to fix invalid values, and stores validated data in `__pool`.\n7. **Cross-validate** — `_cross_validate_data()` loads cross-validation rule files and runs `cross_validator.cross_validate_data()` on each rule block.\n\nThe `eager_termination` flag controls failure behavior throughout: when `True`, processing halts at the first invalid element that cannot be fixed; when `False`, all data is validated and all failures are collected before returning `False`.\n\n### Metadata and properties loading\n\n- `_load_metadata(metadata_path)` — loads a JSON file into `__metadata`. Any exception is re-raised with an `\"Input Manager Error: \"` prefix.\n- `_load_properties()` — merges the three property files into a single `properties` blob. Raises `FileNotFoundError` if a properties file is missing, `json.JSONDecodeError` on malformed JSON.\n- `_load_data_from_json(file_path)` / `_load_data_from_csv(file_path)` — file loaders used both during initial pool population and runtime metadata processing. CSV files are converted to column-oriented dicts (`{column: [values...]}`) via `pandas.read_csv`.\n\n### Pool population and validation\n\n`_populate_pool()` iterates over `metadata[\"files\"]`. For each file blob:\n\n1. Resolves the file path relative to `input_root` (stored as `self.input_root` for later runtime metadata validation).\n2. Selects the loader based on `file_details[\"type\"]` (`\"json\"` or `\"csv\"`). An unknown type raises `KeyError`.\n3. Checks the `exclude_from_pool` flag — if the loaded data contains it set to `True`, the blob is skipped.\n4. Looks up the properties blob via `file_details[\"properties\"]`.\n5. For each property in the properties blob (excluding `data_collection_app_compatible`), calls `data_validator.validate_data_by_type()` with `called_during_initialization=True` and `fixable_data_types=FIXABLE_INPUT_DATA_TYPES`.\n6. Validated properties are collected into `validated_data` and stored in `__pool[file_blob_key]`.\n\nJSON file blobs are also appended to `csv_report_generation_list` so they can be exported later via `export_pool_to_csv()`.\n\n### Runtime metadata and variables\n\nThe `InputManager` supports loading additional metadata and data after the initial pipeline has completed:\n\n- `load_runtime_metadata(metadata_key, eager_termination)` — resolves a runtime metadata entry from the active metadata's `runtime_metadata` section, loads the referenced metadata document without disturbing the active metadata state (via `_load_runtime_metadata_document`, which uses `deepcopy` to snapshot and restore `__metadata`), validates it, and processes each referenced file.\n- `_process_runtime_file()` — for each runtime file definition, verifies the `properties` reference, confirms the file `type` is supported, loads the file, and calls `add_runtime_variable_to_pool()`.\n- `add_runtime_variable_to_pool(variable_name, data, properties_blob_key, eager_termination, input_path)` — the public API for adding a variable at runtime. It:\n  1. Raises `TypeError` if `data` is not a dict.\n  2. Verifies metadata properties exist via `_metadata_properties_exist()`.\n  3. Delegates to `_add_variable_to_pool()`, which prepares the data, checks modifiability, validates each property, and stores the validated subset.\n\nModifiability is enforced at runtime: `_check_modifiability()` uses `_is_modifiable_during_runtime()` to determine whether the variable's `Modifiability` status permits updates. Non-modifiable variables raise `PermissionError` under eager termination, or log a warning and return `False` otherwise.\n\n### Data access and retrieval\n\n- `get_data(data_address, required=True)` — retrieves data from the pool using dot notation (e.g., `\"animal.herd_information.calf_num\"`). Returns a `deepcopy` to prevent callers from mutating internal state. When `required=False`, missing data logs an info-level message and returns `None`; when `required=True`, missing data logs an error and returns `None`.\n- `get_metadata(metadata_address)` — retrieves metadata using the same dot-notation pattern. Raises `KeyError` with a descriptive message if the address is invalid.\n- `check_property_exists_in_pool(data_address)` — returns a boolean indicating whether the address resolves in the pool.\n- `get_data_keys_by_properties(target_properties)` — returns all file blob keys whose `properties` reference matches `target_properties`.\n\nEvery `get_data()` call is recorded in `__get_data_logs_pool` with a millisecond timestamp; `dump_get_data_logs(path)` serializes these to JSON.\n\n### Data deletion\n\n`__delete_input_and_metadata(data_address)` (name-mangled to `_InputManager__delete_input_and_metadata`) removes both the input value and its associated metadata properties. It returns a `(removed_data, removed_metadata)` tuple. Deletion events are recorded in `__delete_data_logs_pool` and can be dumped via `dump_delete_data_logs(path)`.\n\n### Export utilities\n\n- `export_pool_to_csv(output_prefix, output_path)` — flattens each property group in `csv_report_generation_list` (skipping `animal_population`) and writes a CSV with columns `property_group`, `variable_name`, and `<output_prefix>_value`.\n- `save_metadata_properties(output_dir)` — flattens the metadata properties into a CSV via `_parse_metadata_properties()` and `_create_record()`.\n- `compare_metadata_properties(properties_file_path, comparison_properties_file_path, output_directory)` — uses `DeepDiff` to compare two properties files and writes a human-readable diff report.\n\n## OutputManager\n\n`OutputManager` is the singleton output collector for the simulation. It maintains four pools:\n\n| Pool | Populated by | Purpose |\n|---|---|---|\n| `variables_pool` | `add_variable()` | Simulation output values with metadata. |\n| `warnings_pool` | `add_warning()` | Non-fatal issues. |\n| `errors_pool` | `add_error()` | Fatal or significant failures. |\n| `logs_pool` | `add_log()` | Informational messages. |\n\n### Adding variables\n\n`add_variable(name, value, info_map, ...)` is the primary reporting API. The `info_map` must contain:\n\n- `class` and `function` — provenance for the call site.\n- `units` — a `MeasurementUnits` enum member or a (possibly nested) dict of enum members. `_stringify_units()` validates and converts these to strings, raising `TypeError` for invalid unit types.\n\nOptional `info_map` keys include `prefix`, `suffix`, `suppress_prefix`, and `is_daily_variable`. The key under which the variable is stored is produced by `_generate_key()`, which applies prefix/suffix logic.\n\n`add_variable()` also:\n\n- Injects `simulation_day` into the `info_map` via `_add_simulation_day_to_info_map()` when a simulation time source is available.\n- Pre-seeds `_filtered_variable_key_counter` with subkeys for dict-valued variables, enabling post-processing filter diagnostics.\n- Triggers pool chunkification when enabled (see below).\n\n`add_variable_bulk()` accepts a list of `(variable_dict, info_map)` tuples and calls `add_variable()` for each.\n\n### Adding logs, warnings, and errors\n\n`add_log()`, `add_warning()`, and `add_error()` share the same pattern:\n\n1. Stamp the `info_map` with a timestamp from `Utility.get_timestamp(include_millis=True)`.\n2. Generate a pool key via `_generate_key()`.\n3. Store the message in the corresponding pool via `_add_to_pool()`.\n4. Conditionally write to stdout via `_handle_log_output()` based on the configured `LogVerbosity`.\n\n`_add_to_pool()` stores each entry as a pool element with `info_maps` and `values` lists. Values are `deepcopy`-ed to prevent external mutation. The `first_info_map_only` flag limits recorded provenance to the first call site.\n\n### Log verbosity\n\n`LogVerbosity` is an enum with `NONE`, `CREDITS`, `ERRORS`, `WARNINGS`, and `LOGS` levels. `set_log_verbose()` controls the threshold; `_handle_log_output()` compares the message level against the threshold using the enum's `__le__` operator and writes colorized output to stdout.\n\n### Pool overflow control\n\nFor long simulations with large output volumes, `setup_pool_overflow_control()` enables chunkification:\n\n- `output_dir` — where chunk files are saved.\n- `max_memory_usage_percent` — maximum pool size as a percentage of available system memory.\n- `max_memory_usage` — explicit byte budget (overrides the percentage).\n- `save_chunk_threshold_call_count` — save a chunk every N `add_variable()` calls.\n\nWhen the threshold is reached, `_save_current_variable_pool()` serializes `variables_pool` to a minified JSON file, resets the pool via `_set_variables_pool({})`, and increments `saved_pool_chunks_num`. Saved chunks can be reloaded later via `load_saved_pools()`.\n\n### Post-processing and export\n\nThe `OutputManager` provides filtering and serialization utilities, including:\n\n- `filter_variables_pool()` — applies configured filters to the variables pool, using `Utility.filter_dictionary()` and `Utility.expand_data_temporally()`.\n- `_parse_filtered_variables()` — converts filtered results into report-ready structures.\n- `_route_save_functions()` — dispatches filtered variables to the appropriate output channel (CSV, JSON, graph, report).\n- `report_variables_usage_counts()` — writes diagnostic CSVs (`variables_usage_counts`, `variables_reported_daily`, `variables_not_reported_daily`) describing how often variables were selected by filters.\n\n## Validation components\n\nThe validation subsystem lives in `RUFAS/data_validator.py` and is used exclusively through the `InputManager`:\n\n- **`DataValidator`** — validates individual values against metadata property definitions. Key methods used by `InputManager`:\n  - `validate_metadata()` — structural validation of the metadata document.\n  - `validate_properties()` — recursive validation of property definitions.\n  - `validate_data_by_type()` — validates (and optionally fixes) input values against a property's type, constraints, and modifiability.\n  - `extract_value_by_key_list()` — resolves a key path through a nested dict.\n- **`CrossValidator`** — validates relationships between variables. `cross_validate_data()` evaluates rule blocks containing conditions, expressions, and aggregation blocks. `check_target_and_save_block()` validates the alias resolution section of a rule.\n- **`ElementsCounter`** — tracks the number of valid, invalid, and total elements encountered during validation.\n- **`Modifiability`** — enum (`REQUIRED_LOCKED`, `REQUIRED_UNLOCKED`, `UNREQUIRED_LOCKED`, `UNREQUIRED_UNLOCKED`) that determines whether a variable requires an input at initialization and whether it can be modified at runtime. `InputManager._get_variable_modifiability()` maps string values from metadata to enum members, defaulting to `UNREQUIRED_UNLOCKED` for unknown or missing values.\n\nThe `FIXABLE_INPUT_DATA_TYPES` constant (`{\"string\", \"number\", \"bool\"}`) tells the validator which data types it may attempt to coerce into valid values during validation.\n\n## Integration with the rest of the codebase\n\n- **Simulation entry point** — `start_data_processing()` is called once at startup (from the task manager or main driver) with the metadata path, input root, task ID, and optional cross-validation files.\n- **Model components** — throughout the simulation, model code calls `InputManager.get_data()` to read inputs and `OutputManager.add_variable()` to report outputs. The singleton pattern ensures all components share the same pools.\n- **Task manager** — the `\"TASK MANAGER\"` task ID bypasses required-file-blob validation, allowing task-level metadata to omit simulation blobs.\n- **Runtime updates** — components that need to inject data mid-simulation (e.g., user-supplied feeds, tractor datasets) use `add_runtime_variable_to_pool()` or `load_runtime_metadata()`.\n- **Reporting** — `OutputManager` feeds the `ReportGenerator` and `GraphGenerator` through its filtering and routing methods. `InputManager.export_pool_to_csv()` provides input data snapshots for reproducibility
