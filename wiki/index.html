Overview\n\nThe **Other — input** module is a minimal metadata descriptor for the task manager configuration system. It contains no executable logic, no external dependencies, and no runtime calls. Its sole responsibility is to declare the location and basic characteristics of the task configuration data file used by the simulation.\n\nThis module exists at `input/task_manager_metadata.json` and acts as a pointer: it tells the broader system where to find the actual task configuration and what to expect from it.\n\n## Purpose\n\nThe file answers three questions about the simulation's task data:\n\n1. **Where is the task data?** — It resolves the path to the actual configuration file.\n2. **What kind of data is it?** — It declares the format (`json`) and the logical file type (`tasks`).\n3. **What schema governs it?** — It references a property definition (`tasks_properties`) that describes the expected fields.\n\nBecause the metadata file decouples the file location from the code that consumes it, changing the task configuration path (e.g., switching from `example_freestall_task.json` to a user-supplied file) requires editing this descriptor alone, not the importing code.\n\n## File Structure\n\nThe JSON is small and flat. It wraps a single `files` object that contains one entry, `tasks`:\n\n```json\n{\n  \"files\": {\n    \"tasks\": {\n      \"title\": \"Task manager data\",\n      \"description\": \"Configuration file for general simulation parameters.\",\n      \"path\": \"input/data/tasks/example_freestall_task.json\",\n      \"type\": \"json\",\n      \"properties\": \"tasks_properties\"\n    }\n  }\n}\n```\n\n### Field Reference\n\n| Field         | Value                                        | Meaning                                                        |\n|---------------|----------------------------------------------|----------------------------------------------------------------|\n| `title`       | `\"Task manager data\"`                        | Human-readable label for the file entry.                       |\n| `description` | `\"Configuration file for general simulation parameters.\"` | What the referenced file contains.                 |\n| `path`        | `\"input/data/tasks/example_freestall_task.json\"` | Relative path from the repository root to the actual data file. |\n| `type`        | `\"json\"`                                     | Serialization format of the target file.                       |\n| `properties`  | `\"tasks_properties\"`                         | Logical name of the schema/property set that validates the data. |\n\nThe `files` wrapper suggests the design supports multiple named file entries; only `tasks` is defined here, but the structure is extensible if other input descriptors are added in the future.\n\n## Relationship to the Task Configuration Data\n\nThe referenced file, `input/data/tasks/example_freestall_task.json`, holds the actual simulation parameters. The metadata does not validate or parse that file itself — it only supplies the pointer. Consumers of this metadata are expected to:\n\n1. Read `task_manager_metadata.json`.\n2. Extract `files.tasks.path`.\n3. Load and parse the JSON at that path.\n4. Optionally use `files.tasks.properties` to look up the validation rules for the file's contents.\n\n## Connections to the Rest of the Codebase\n\nThis module has no direct callers or callees detected in the codebase call graph. It is a static data asset, not a runtime component. Its integration is indirect:\n\n- A configuration loader (or bootstrap routine) somewhere in the simulation startup sequence reads this metadata file to discover where task data lives.\n- The `properties` value (`tasks_properties`) is a logical key that must be recognized by whatever schema registry or property-validation service the codebase uses. If that registry does not contain an entry for `tasks_properties`, validation of the task file will fail or be skipped, depending on the loader's behavior.\n\nBecause the metadata carries no import statements or function calls, understanding its contract requires looking at the loader that consumes it. If you are modifying this file, the two invariants to preserve are:\n\n- The `path` must remain resolvable relative to the repository root.\n- The `type` and `properties` values must match what the consuming loader expects.\n\n## Summary\n\n`task_manager_metadata.json` is a static declaration file. It is the entry point for locating task configuration data and the first piece a developer should inspect when tasked with changing which task file the simulation loads. Altering the simulation's task parameters means editing the data file it points to; altering *which* file is used means editing the `path` field here.","other-pyproject-toml":"# Other — pyproject.toml\n\n# RuFaS `pyproject.toml` — Project Configuration\n\n## Purpose\n\nThe `pyproject.toml` file is the central configuration manifest for the **RuFaS** (Ruminant Farm Systems Model) package. It defines the build system, project metadata, runtime dependencies, optional feature sets, development tooling, and packaging rules. It is the single source of truth for how the project is built, installed, and linted/type-checked.\n\n## Build System\n\n```toml\n[build-system]\nrequires = [\"setuptools>=68.0\", \"wheel\"]\nbuild-backend = \"setuptools.build_meta\"\n```\n\n- **Backend**: `setuptools.build_meta` — the standard setuptools PEP 517 backend.\n- **Isolated build requirements**: `setuptools>=68.0` and `wheel` are fetched into an isolated environment when building the package (e.g., via `pip install .` or `python -m build`).\n\n## Project Metadata\n\n```toml\n[project]\nname = \"RuFaS\"\nversion = \"1.0.3\"\ndescription = \"Ruminant Farm Systems Model\"\nreadme = \"README.md\"\nlicense = \"GPL-3.0-only\"\nauthors = [{\"name\" = \"RuFaS Team\", \"email\" = \"contact@rufas.org\"}]\nrequires-python = \">=3.12, <3.14\"\n```\n\n| Field | Value | Notes |\n|---|---|---|\n| `name` | `RuFaS` | Distribution name; case-sensitive for import (`RUFAS`). |\n| `version` | `1.0.3` | Current release. |\n| `description` | Ruminant Farm Systems Model | One-line summary. |\n| `readme` | `README.md` | Rendered on PyPI and used as long description. |\n| `license` | `GPL-3.0-only` | SPDX identifier; the project is GPL-3.0-only licensed. |\n| `authors` | RuFaS Team | Contact email for maintainers. |\n| `requires-python` | `>=3.12, <3.14` | Supports Python 3.12 and 3.13 only. |\n\n## Runtime Dependencies\n\n```toml\ndependencies = [\n    \"matplotlib>=3.10.0\",\n    \"numpy==2.2.0\",\n    \"pandas>=2.2.3\",\n    \"scipy>=1.15.1\",\n    \"typing_extensions>=4.12.2\",\n    \"salib==1.5.1\",\n    \"tqdm>=4.67.1\",\n    \"deepdiff>=8.2.0\",\n    \"psutil>=6.1.1\",\n    \"numba>=0.61.0\",\n]\n```\n\n| Package | Constraint | Purpose in RuFaS |\n|---|---|---|\n| `matplotlib` | `>=3.10.0` | Plotting and visualization of model outputs. |\n| `numpy` | `==2.2.0` | Core numerical array operations; pinned for reproducibility. |\n| `pandas` | `>=2.2.3` | Tabular data handling for inputs and results. |\n| `scipy` | `>=1.15.1` | Scientific computing (optimization, integration, stats). |\n| `typing_extensions` | `>=4.12.2` | Backported typing features for Python 3.12/3.13. |\n| `salib` | `==1.5.1` | Sensitivity analysis (Sobol, Morris, etc.). |\n| `tqdm` | `>=4.67.1` | Progress bars for long-running simulations. |\n| `deepdiff` | `>=8.2.0` | Deep comparison of model state/result structures. |\n| `psutil` | `>=6.1.1` | System/process resource monitoring. |\n| `numba` | `>=0.61.0` | JIT compilation for performance-critical loops. |\n\n> **Note**: `numpy` and `salib` are pinned with `==` to guarantee numerical reproducibility across environments. The remaining packages use minimum-version constraints to allow patch updates.\n\n## Optional Dependency Groups\n\n### `build_docs` — Documentation Build\n\n```toml\n[project.optional-dependencies]\nbuild_docs = [\n    \"sphinx==9.1.0\",\n    \"sphinxawesome-theme>=5.3.2\",\n    \"sphinxcontrib-mermaid>=2.0.1\",\n]\n```\n\nUsed to build the project documentation site:\n\n- **Sphinx** — documentation generator (pinned to 9.1.0).\n- **sphinxawesome-theme** — custom theme for the docs.\n- **sphinxcontrib-mermaid** — enables Mermaid diagrams inside Sphinx docs.\n\nInstall with: `pip install .[build_docs]`\n\n### `dev` — Development Tooling\n\n```toml\ndev = [\n    \"black>=26.5.1\",\n    \"flake8>=7.1.1\",\n    \"mypy>=1.15.0\",\n    \"coverage>=7.6.11\",\n    \"pytest>=9.0.3\",\n    \"pytest-mock>=3.14.0\",\n    \"pytest-lazy-fixtures>=1.4.0\",\n    \"freezegun>=1.5.1\",\n    \"sphinx==9.1.0\",\n    \"sphinxawesome-theme>=5.3.2\",\n    \"sphinxcontrib-mermaid>=2.0.1\",\n]\n```\n\nThe `dev` group is a superset of `build_docs` plus:\n\n| Tool | Purpose |\n|---|---|\n| `black` | Code formatting (line length 120, see `[tool.black]`). |\n| `flake8` | Linting. |\n| `mypy` | Static type checking (strict mode, see `[tool.mypy]`). |\n| `coverage` | Test coverage measurement. |\n| `pytest` | Test runner. |\n| `pytest-mock` | Mocking support for tests. |\n| `pytest-lazy-fixtures` | Lazy fixture evaluation in parametrized tests. |\n| `freezegun` | Time-travel control for tests involving dates/timestamps. |\n\nInstall with: `pip install .[dev]`\n\n## Entry Point\n\n```toml\n[project.scripts]\nrufas = \"RUFAS.main:main\"\n```\n\nInstalling the package creates a console script named `rufas` that invokes the `main()` function from the `RUFAS.main` module. This is the command-line interface for running the model.\n\n## Project URLs\n\n```toml\n[project.urls]\nHomepage = \"https://rufas.org\"\nRepository = \"https://github.com/RuminantFarmSystems/RuFaS\"\nDocumentation = \"https://ruminantfarmsystems.github.io/RuFaS/\"\n```\n\n## Tool Configuration\n\n### `[tool.setuptools]`\n\n```toml\n[tool.setuptools]\npackages = [\"RUFAS\"]\n```\n\nExplicitly declares the `RUFAS` package. Only this top-level package is included; subpackages must be listed explicitly or discovered via `find:` directives if added later.\n\n### `[tool.black]`\n\n```toml\n[tool.black]\ntarget-version = [\"py312\"]\nline-length = 120\n```\n\n- Formats code targeting Python 3.12 syntax.\n- Uses a 120-character line length (wider than Black's default 88).\n\n### `[tool.mypy]`\n\n```toml\n[tool.mypy]\npython_version = \"3.12\"\nignore_missing_imports = true\nstrict_optional = true\ndisallow_untyped_defs = true\ncheck_untyped_defs = true\ndisallow_any_generics = true\ndisallow_incomplete_defs = true\nshow_column_numbers = true\nstrict = true\nexclude = ['^(?!.*(?:RUFAS|tests|main\\.py|setup\\.py)).*']\n```\n\n- **`strict = true`** — enables all strict mypy checks.\n- **`ignore_missing_imports = true`** — suppresses errors for third-party packages without type stubs.\n- **`exclude`** — a negative lookahead regex that *keeps* `RUFAS`, `tests`, `main.py`, and `setup.py` in scope while excluding everything else. This ensures type checking is applied to the core package and tests only.\n\n### `[tool.pytest.ini_options]`\n\n```toml\n[tool.pytest.ini_options]\ntestpaths = [\"tests\"]\n```\n\n- Directs pytest to discover tests in the `tests/` directory.\n- No custom markers or fixtures are declared here; those live in `tests/conftest.py` or test modules.\n\n## Relationship to the Codebase\n\n```\npyproject.toml\n├── defines build/install → setuptools builds RUFAS package\n├── defines CLI → rufas command → RUFAS.main:main\n├── defines runtime deps → numpy, pandas, scipy, salib, numba, ...\n├── defines dev deps → black, flake8, mypy, pytest, ...\n└── configures tools → black, mypy, pytest\n```\n\nThe file is the entry point for:\n\n1. **Packaging** — `pip install .` builds and installs the `RUFAS` package.\n2. **CLI** — the `rufas` console script is the primary user-facing interface.\n3. **CI/CD** — CI pipelines typically run `pip install .[dev]`, then `black --check`, `flake8`, `mypy`, and `pytest`.\n4. **Reproducibility** — pinned versions of `numpy` and `salib` ensure numerical results are stable across environments.\n\n## Usage Examples\n\n```bash\n# Install the package with runtime dependencies\npip install .\n\n# Install with development tooling\npip install -e .[dev]\n\n# Install with documentation build dependencies\npip install .[build_docs]\n\n# Run the model via the CLI\nrufas --help\n\n# Run tests\npytest\n\n# Type-check the codebase\nmypy RUFAS\n\n# Format code\nblack RUFAS tests\n```","other-readme-md":"# Other — README.md\n\n# README.md — Project Entry Point and Overview\n\n## Purpose\n\nThe `README.md` file serves as the primary entry point for the RuFaS (Ruminant Farm Systems) repository. It is the first document a developer, researcher, or contributor encounters and provides a high-level orientation to the project's goals, scientific foundation, setup procedure, contribution guidelines, and licensing. It is a static documentation file with no executable code — it contains no functions, classes, or runtime behavior.\n\n## Role in the Codebase\n\nThe README is the hub that links outward to the rest of the project's documentation and infrastructure. It references:\n\n| Target | Purpose |\n|---|---|\n| `main.py` | The entry-point script users run to execute a simulation |\n| `output/output_filters/_csv_all_variables.txt` | A filter file that must be renamed to enable CSV output |\n| `CONTRIBUTING.md` | Contribution guidelines and standards |\n| `COPYING.md` / `COPYING.LESSER.md` | GPLv3 license texts |\n| GitHub Pages site (`ruminantfarmsystems.github.io/RuFaS/`) | Full documentation, including the GitHub Actions wiki and end-to-end testing guides |\n| YouTube onboarding playlist | Video walkthroughs for new users |\n| `rufas.org` team and partner pages | Acknowledgement of contributors and organizations |\n\nThe README also displays CI status badges (Flake8, Pytest, Coverage, Mypy) that link to the `combined_format_lint_test_mypy.yml` GitHub Actions workflow, giving readers an at-a-glance view of the repository's health.\n\n## Key Sections\n\n### Vision and Mission\n\nThe README opens with the project's vision — supporting research and sustainable decision-making in ruminant animal production — and its mission: building an integrated whole-farm modeling platform that simulates milk/meat/crop production, greenhouse gas emissions, water quality, soil health, and other sustainability outcomes. It also states quality standards for prediction accuracy, code structure, and documentation.\n\n### Scientific Foundation\n\nBriefly establishes that RuFaS is grounded in peer-reviewed science and maintained by a community of researchers, developers, and stakeholders committed to transparency and reproducibility.\n\n### Getting Started\n\nA six-step setup procedure for new users:\n\n1. Install Python 3.12 or 3.13\n2. Create and activate a virtual environment (`python -m venv venv`)\n3. Install dependencies with `pip install .`\n4. Rename `output/output_filters/_csv_all_variables.txt` to `csv_all_variables.txt` to enable output display\n5. Run the simulation with `python main.py`\n6. Consult the GitHub Pages documentation or onboarding videos for further questions\n\n### How to Contribute\n\nLists the types of contributions accepted — testing, feature suggestions, scientific discussion, code, documentation, user support, UI design, and promotion. Points readers to the Contributor Covenant code of conduct and `CONTRIBUTING.md` for full details, and to the GitHub Pages wiki for prerequisites and end-to-end testing information.\n\n### License\n\nStates that RuFaS is licensed under GPLv3, with links to the license texts.\n\n### Contact and Acknowledgements\n\nProvides the project contact email (`contact@rufas.org`) and acknowledges contributing individuals and organizations, with links to the team page, partners page, and the GitHub contributors graph.\n\n## Usage Notes for Developers\n\n- The README is not imported or executed by any code in the repository. It is purely informational.\n- When modifying the README, keep the setup steps in sync with the actual behavior of `main.py` and the output filter directory — these are the two code-adjacent details most likely to drift out of date.\n- The CI badge URLs point to the `combined_format_lint_test_mypy.yml` workflow; if that workflow is renamed or moved, the badges must be updated accordingly.\n- The Mypy badge currently reports 1134 errors, which is a known status indicator — do not assume it reflects a passing state.\n\n## Relationship to Other Modules\n\nThe README has no runtime dependencies. Its connections to the codebase are purely referential: it documents how to invoke `main.py`, how to configure output via the filter file, and where to find the contribution and licensing documents. It is the recommended starting point for anyone onboarding to the repository, after which they should read `CONTRIBUTING.md` and the GitHub Pages wiki for operational details.","other-rufas-biophysical":"# Other — RUFAS-biophysical\n\n# Module: RUFAS.biophysical\n\n## Overview\n\nThe `RUFAS.biophysical` module is the initialization file for the `biophysical` subpackage within the RUFAS project. As an `__init__.py` file, its primary role is to mark the directory as a Python package, enabling the import of submodules and the organization of biophysical-related code.\n\n## Purpose\n\nThe `biophysical` subpackage is intended to house modules and utilities related to biophysical modeling, simulation, or data processing within the RUFAS framework. The `__init__.py` file serves as the entry point for the package, potentially exposing key components, defining package-level constants, or simply acting as a placeholder for future functionality.\n\n## Current State\n\nAs of the provided source, the `__init__.py` file is **empty** (contains no executable code). This is a common and valid pattern for a package initialization file. It does not define any functions, classes, or variables, and it does not import any submodules.\n\n## Structure\n\nThe typical structure of the `biophysical` subpackage is expected to be:\n\n```\nRUFAS/\n└── biophysical/\n    ├── __init__.py          # This file\n    ├── (submodule1).py      # e.g., models.py, utils.py\n    ├── (submodule2).py\n    └── ...\n```\n\nThe `__init__.py` file may later be extended to:\n\n- Re-export public APIs from submodules (e.g., `from .models import BiophysicalModel`).\n- Define package-level constants or configuration.\n- Perform initialization tasks when the package is imported.\n\n## Usage\n\nTo use the `biophysical` package, one would import it as:\n\n```python\nimport RUFAS.biophysical\n# or\nfrom RUFAS import biophysical\n```\n\nSince the file is currently empty, importing the package has no side effects. Submodules, once added, can be imported individually:\n\n```python\nfrom RUFAS.biophysical import models\n```\n\n## Integration with RUFAS\n\nThe `biophysical` subpackage is part of the larger RUFAS project. Its exact relationship with other modules (e.g., `data`, `simulation`, `analysis`) is not defined in this file. It is expected that the package will be used by other parts of the RUFAS codebase to provide biophysical modeling capabilities.\n\n## Future Development\n\nWhen the package is populated, the `__init__.py` should be updated to:\n\n- Import and expose the most important classes/functions for convenience.\n- Document the public API in docstrings.\n- Ensure that any necessary initialization (e.g., loading data, setting up logging) occurs at import time.\n\n## Diagram\n\nThe following diagram illustrates the current minimal structure of the `biophysical` package:\n\n```mermaid\ngraph TD\n    A[RUFAS] --> B[biophysical]\n    B --> C[__init__.py (empty)]\n    B --> D[future submodules]\n```\n\n## Conclusion\n\nThe `RUFAS.biophysical` module is currently an empty package initializer. It establishes the `biophysical` namespace within RUFAS and is ready to be extended with biophysical modeling code. Developers should refer to the project's overall architecture and coding conventions when adding content to this package.","other-rufas":"# Other — RUFAS\n\n# Module: `RUFAS/main.py`\n\n## Overview\n\n`main.py` is the command-line entry point for the RuFaS (Ruminal Farm Simulation) application. It is responsible for:\n\n- Parsing user-supplied command-line arguments\n- Constructing a `TaskManager` and delegating the simulation run to it\n- Capturing and logging any fatal exceptions that occur during the run\n\nThe module is intentionally thin: it contains no simulation logic itself, but instead wires together the `TaskManager` (which orchestrates tasks) and the `OutputManager` (which handles logging and diagnostics).\n\n---\n\n## Entry Point: `main()`\n\n```python\ndef main() -> None:\n```\n\n`main()` is the sole public function. It performs the following steps:\n\n1. Calls `parse_gnu_args(sys.argv[1:])` to obtain an `argparse.Namespace` of validated options.\n2. Instantiates a `TaskManager`.\n3. Invokes `task_manager.start(...)`, passing every relevant option through.\n4. On any unhandled exception, it:\n   - Creates an `OutputManager`\n   - Logs the traceback via `add_error()`\n   - Dumps all non-data pools via `dump_all_nondata_pools()`\n   - Re-raises the error as a `RuntimeError` with a descriptive message.\n\n### Parameters passed to `TaskManager.start()`\n\n| Parameter                  | Source CLI option          | Type      | Notes                                        |\n|----------------------------|----------------------------|-----------|----------------------------------------------|\n| `metadata_path`            | `-p` / `--path-to-metadata`| `Path`    | Defaults to `input/task_manager_metadata.json` |\n| `verbosity`                | `-v` / `--verbosity`       | `LogVerbosity` or `None` | Converted from string via `LogVerbosity(...)` |\n| `exclude_info_maps`        | `-i` / `--exclude-info-maps`| `bool`    |                                              |\n| `output_directory`         | `-o` / `--output-dir`      | `Path`    | Defaults to `output/`                        |\n| `logs_directory`           | `-l` / `--logs-dir`        | `Path`    | Defaults to `output/logs`                    |\n| `clear_output_directory`   | `-c` / `--clear-output`    | `bool`    |                                              |\n| `produce_graphics`         | `-g` / `--no-graphics`     | `bool`    | Inverted: `not cmd_arguments.no_graphics`    |\n| `suppress_log_files`       | `-s` / `--suppress-log-files`| `bool`  |                                              |\n| `metadata_depth_limit`     | `-m` / `--metadata-depth-limit`| `int`  | Optional override                            |\n\n---\n\n## Command-Line Interface: `parse_gnu_args()`\n\n```python\ndef parse_gnu_args(args: Any | None = None) -> argparse.Namespace:\n```\n\nBuilds an `argparse.ArgumentParser` with the description *\"RuFaS: Whole dairy farm simulation\"* and registers the following options:\n\n| Short | Long                     | Action      | Default                          | Help text                                        |\n|-------|--------------------------|-------------|----------------------------------|--------------------------------------------------|\n| `-g`  | `--no-graphics`          | `store_true`| `False`                          | Prevents graphics from generating                |\n| `-v`  | `--verbosity`            | `store`     | `None`                           | Sets the log verbosity level (choices: `errors`, `warnings`, `logs`, `credits`, `none`) |\n| `-c`  | `--clear-output`         | `store_true`| `False`                          | Clears output directory before running           |\n| `-i`  | `--exclude-info-maps`    | `store_true`| `False`                          | Exclude info_maps from the output                |\n| `-o`  | `--output-dir`           | `store`     | `\"output/\"`                      | The saving directory for output                  |\n| `-s`  | `--suppress-log-files`   | `store_true`| `False`                          | Prevents logs from the Task Manager being written to files |\n| `-l`  | `--logs-dir`             | `store`     | `\"output/logs\"`                  | The directory for saving log files               |\n| `-m`  | `--metadata-depth-limit` | `store`     | `None`                           | Overrides the default metadata depth limit       |\n| `-p`  | `--path-to-metadata`     | `store`     | `\"input/task_manager_metadata.json\"` | Path to the task manager metadata that determines the tasks run |\n\n### `CaseInsensitiveArgumentAction`\n\nA custom `argparse.Action` subclass is defined and registered with the parser via `parser.register(\"action\", \"ci_action\", CaseInsensitiveArgumentAction)`. Its `__call__` method sets the attribute for each option string in `self.option_strings`.\n\n> **Note:** Although registered, no argument in the current parser configuration actually uses `action=\"ci_action\"`. The class is effectively dead code at present.\n\n---\n\n## Error Handling\n\nThe error-handling path in `main()` is defensive and explicit:\n\n1. **Catch-all**: Any `Exception` (not just `SystemExit` or `KeyboardInterrupt`) is caught.\n2. **Logging**: An `OutputManager` is created and `add_error()` is called with:\n   - A message containing the original exception text\n   - The full traceback via `traceback.format_exc()`\n   - An `info_map` identifying the caller as `{\"class\": \"No caller class\", \"function\": \"main\"}`\n3. **Pool dump**: `dump_all_nondata_pools()` is invoked to persist any in-memory state that is not part of the core data.\n4. **Re-raise**: The original exception is wrapped in a `RuntimeError` with a message pointing the user to the log files.\n\nThis ensures that even a catastrophic failure leaves behind diagnostic artifacts in the logs directory.\n\n---\n\n## Dependencies & Connections\n\n| Import                    | Module                  | Purpose                                                        |\n|---------------------------|-------------------------|----------------------------------------------------------------|\n| `TaskManager`             | `RUFAS.task_manager`    | Orchestrates the simulation tasks; `start()` is the main entry |\n| `OutputManager`           | `RUFAS.output_manager`  | Handles logging, error reporting, and pool dumping             |\n| `LogVerbosity`            | `RUFAS.output_manager`  | Enum used to convert the `--verbosity` string to a typed value |\n| `Path`                    | `pathlib`               | Type-safe filesystem paths for all directory arguments         |\n| `argparse`, `sys`, `traceback`, `Any` | Standard library | CLI parsing, process arguments, traceback formatting, typing   |\n\n### Execution flow\n\n```mermaid\ngraph TD\n    A[User invokes: python -m RUFAS] --> B[main.py: main]\n    B --> C[parse_gnu_args]\n    C --> D[argparse.Namespace]\n    D --> E[TaskManager.start]\n    E --> F{Exception?}\n    F -->|No| G[Simulation completes]\n    F -->|Yes| H[OutputManager.add_error]\n    H --> I[OutputManager.dump_all_nondata_pools]\n    I --> J[Raise RuntimeError]\n```\n\n---\n\n## Code Quality Notes\n\nThe source file contains **duplicate definitions** of `main()`, `CaseInsensitiveArgumentAction`, `parse_gnu_args()`, and the `if __name__ == \"__main__\"` guard. In Python, the later definitions silently override the earlier ones, so the module behaves as if only the second set exists. This is harmless at runtime but should be cleaned up to avoid confusion.\n\nAdditionally, the `CaseInsensitiveArgumentAction` class is registered but never used by any argument definition — it can be removed along with the `parser.register(...)` call unless future CLI options are planned to use it.\n\n---\n\n## Usage Example\n\n```bash\n# Run with default settings\npython -m RUFAS\n\n# Run with custom metadata, verbose logging, and no graphics\npython -m RUFAS \\\n  --path-to-metadata config/my_farm.json \\\n  --verbosity logs \\\n  --no-graphics \\\n  --output-dir results/ \\\n  --logs-dir results/logs/\n```","other-tests-test-biophysical":"# Other — tests-test_biophysical\n\n# Other — tests/test_biophysical\n\n## Overview\n\nThe `tests/test_biophysical` package contains the unit test suite for the biophysical animal simulation layer of RUFAS (Ruminant Farm Systems). It validates two core components:\n\n- **`Genetics`** — the genetic value engine that generates true breeding values (TBV), estimated breeding values (EBV), environmental effects, phenotypes, and ranking indices for individual animals.\n- **`Animal`** — the central animal entity that orchestrates daily routines (growth, milk production, reproduction, digestion, nutrient updates) and manages life-stage transitions from newborn calf through lactating/dry cow.\n\nThe tests are organized under `test_animal/`, mirroring the `RUFAS.biophysical.animal` package structure:\n\n```\ntests/test_biophysical/\n└── test_animal/\n    ├── animal_genetics/\n    │   └── test_animal_genetics.py\n    ├── test_animal/\n    │   └── test_animal.py\n    └── (additional subpackages for config, herd manager, data types, etc.)\n```\n\n## Test Infrastructure\n\n### Shared Fixtures\n\nThe `genetics` fixture in `test_animal_genetics.py` constructs a `Genetics` instance for a lactating cow born in 2020, seeding `AnimalConfig.average_phenotype` with fat and protein means for that year:\n\n```python\n@pytest.fixture\ndef genetics() -> Genetics:\n    AnimalConfig.average_phenotype[\"fat_kg\"] = {2020: 10.0}\n    AnimalConfig.average_phenotype[\"protein_kg\"] = {2020: 20.0}\n    genetics = Genetics(animal_type=AnimalType.LAC_COW, birth_year=2020)\n    return genetics\n```\n\nThe `mock_time` fixture in `test_animal.py` provides a mocked `RufasTime` with a fixed current date (`2023-01-01`) and simulation day (`18`), and populates `AnimalConfig` with semen and phenotype data covering a 10-year window around that date.\n\n### Helper Functions\n\n`test_animal.py` defines several module-level helpers:\n\n- **`_make_cow_for_305_day_milk_yield(days_in_milk, calves)`** — constructs a bare `Animal` instance (via `Animal.__new__`) with a mocked `MilkProduction` object, used to test the 305-day milk yield update logic in isolation.\n- **`mock_submodule_init(mocker)`** — patches the constructors of `Growth`, `DigestiveSystem`, `MilkProduction`, `Nutrients`, and `Reproduction` so that `Animal.__init__` can run without instantiating real submodules.\n- **`mock_animal_init_methods(mocker)`** — patches the four life-stage initialization methods (`_initialize_newborn_calf`, `_initialize_calf_or_heiferI`, `_initialize_heiferII_or_heiferIII`, `_initialize_cow`) and returns the mocks for assertion.\n- **`assert_animal_init_properties(result, args)`** — verifies that common `Animal` attributes (`id`, `breed`, `animal_type`, `days_born`, `birth_weight`, `cull_reason`) are correctly set from the typed-dict constructor argument.\n\n### Animal Fixtures\n\nFive fixtures provide `Animal` instances at each life stage for property and routine tests:\n\n| Fixture | Animal type | Notes |\n|---|---|---|\n| `mock_calf` | `Calf` | Basic calf from `CalfValuesTypedDict` |\n| `mock_heiferI` | `HeiferI` | Basic heifer I |\n| `mock_heiferII` | `HeiferII` | Includes `days_in_pregnancy=10`; `Reproduction.__init__` patched |\n| `mock_heiferIII` | `HeiferIII` | Includes `days_in_pregnancy=10`; `Reproduction.__init__` patched |\n| `mock_lactating_cow` | `LacCow` | `days_in_milk=10`; full reproduction program config |\n| `mock_dry_cow` | `DryCow` | `parity=3`; full reproduction program config |\n\n## Genetics Tests\n\n### Initialization and Value Generation\n\n`test_animal_genetics_init` is parameterized across all animal types and verifies the constructor's dispatch logic:\n\n- For a **newborn calf** (`initialize_newborn_calf=True`), `_calculate_newborn_calf_tbv_values` is called with the dam's TBV values and a `\"YYYY-MM\"` birth key; `_calculate_tbv_values` is **not** called.\n- For all other life stages, `_calculate_tbv_values` is called and the newborn path is skipped.\n- `_calculate_ep_values`, `_calculate_et_values`, and `_calculate_phenotype_values` are always called; EBV and ranking index are deferred until lactation start.\n\n### TBV Generation\n\n`_calculate_tbv_values` draws from a bivariate normal distribution via `Utility.generate_bivariate_random_numbers` with zero means and the module constants `TBV_FAT_STD`, `TBV_PROTEIN_STD`, and `TBV_CORRELATION`.\n\n`_calculate_newborn_calf_tbv_values` computes the mean of the dam's TBV and the top-listing semen value for the birth month, then draws from a bivariate normal around that midpoint. The test suite covers three scenarios:\n\n1. **In-range birth month** — uses the exact semen value for that month.\n2. **Out-of-range early date** — falls back to the earliest available semen date and logs a warning via `genetics.om.add_warning`.\n3. **Out-of-range late date** — falls back to the latest available semen date and logs a warning.\n4. **Missing in-range key** — logs an error via `genetics.om.add_error` and re-raises the `KeyError`.\n\nThe warning fallbacks are guarded by class-level flags (`set_top_semen_too_early_warning_raised`, `set_birthdate_too_recent_warning_raised`) so the warning is only emitted once per simulation.\n\n### Environmental Effects\n\n`_calculate_ep_values` and `_calculate_et_values` both draw from bivariate normals with zero means, using the permanent (`E_PERMANENT_*`) and temporary (`E_TEMPORARY_*`) standard deviations and correlations respectively.\n\n### Phenotype Calculation\n\n`_calculate_phenotype_values` sums the TBV, permanent effect, and temporary effect, then adds the year-specific population mean from `AnimalConfig.average_phenotype`. Like the newborn TBV path, it handles out-of-range birth years by clamping to the earliest/latest available year with a one-time warning, and re-raises `KeyError` (after logging) when the year is missing from the data range entirely.\n\n### EBV and Ranking Index\n\n`_calculate_ebv_values` applies a parity- and animal-type-specific reliability adjustment to the TBV. The test parameterization verifies that:\n\n- The standard deviation of the EBV noise decreases with parity (more records → higher reliability).\n- The EBV is computed as `group_mean + reliability * (TBV - group_mean) + noise`, where noise is drawn from `numpy.random.normal(0, std)`.\n\n`_calculate_ranking_index` combines fat and protein EBV into a single economic index using fixed weights.\n\n`recalculate_values_at_lactation_start` re-draws temporary effects and phenotype, and only recalculates EBV and ranking index for parities 0–3 (the test asserts `_calculate_ebv_values` is **not** called for parity ≥ 4).\n\n### Aggregation Helpers\n\nTwo static methods are tested:\n\n- **`calculate_average_genetic_values(genetics_list)`** — returns a dict of mean values for all genetic attributes; returns `None` for every key when the list is empty.\n- **`calculate_average_tbv(genetics_list)`** — returns the mean `TBV_fat` and `TBV_protein` as a tuple; returns `(0.0, 0.0)` for an empty list.\n\n### Dict Representation\n\nThe `dict_representation` property serializes all genetic attributes into a flat dict with keys `TBV_fat`, `TBV_protein`, `E_permanent_fat`, `E_permanent_protein`, `E_temporary_fat`, `E_temporary_protein`, `phenotype_fat`, `phenotype_protein`, `EBV_fat`, `EBV_protein`, and `ranking_index`.\n\n## Animal Tests\n\n### Constructor Dispatch\n\n`Animal.__init__` routes to one of four initialization methods based on the `animal_type` in the typed-dict argument. The tests verify the dispatch table:\n\n| Animal type | Initialization method |\n|---|---|\n| `Calf` (newborn, with `dam_tbv_*` fields) | `_initialize_newborn_calf` |\n| `Calf` (existing) | `_initialize_calf_or_heiferI` |\n| `HeiferI` | `_initialize_calf_or_heiferI` |\n| `HeiferII` | `_initialize_heiferII_or_heiferIII` |\n| `HeiferIII` | `_initialize_heiferII_or_heiferIII` |\n| `LacCow` / `DryCow` | `_initialize_cow` |\n\n### Newborn Calf Initialization\n\n`test_initialize_newborn_calf` is parameterized over semen type (`conventional`, `sexed`, `random`), sex, and stillbirth status. It verifies:\n\n- **Sex determination** — a random draw is compared against `AnimalConfig.male_calf_rate_conventional_semen` or `male_calf_rate_sexed_semen`; an invalid semen type raises `ValueError`.\n- **Stillbirth** — a second random draw is compared against `AnimalConfig.still_birth_rate`.\n- **Mature body weight** — drawn from a truncated normal via `truncnorm.rvs` with bounds `±STDI` around `AnimalConfig.average_mature_body_weight`.\n- **Initial phosphorus** — transferred from the dam via `initial_phosphorus` into `nutrients.total_phosphorus_in_animal`.\n\n### Life-Stage Initialization\n\n- **`_initialize_calf_or_heiferI`** — sets sex to `FEMALE`, copies body weight/wean weight/mature weight from the typed dict, and parses the event history string via `AnimalEvents.init_from_string`.\n- **`_initialize_heiferII_or_heiferIII`** — additionally initializes the `Reproduction` object with the heifer reproduction program, sub-protocol (mapped to `HeiferTAISubProtocol` or `HeiferSynchEDSubProtocol` depending on the program), and optional pregnancy state (`days_in_pregnancy`, `ai_day`, `estrus_count`, etc.).\n- **`_initialize_cow`** — initializes reproduction with both heifer and cow programs, sets `days_in_milk`, `parity` (as `reproduction.calves`), and `calving_interval` (defaulting to `AnimalConfig.calving_interval`).\n\n### Property Guards\n\nA large portion of the test file verifies that cow-only properties raise `TypeError` (and log via `OutputManager.add_error`) when accessed on non-cow animals. The pattern is consistent:\n\n```python\nmocker.patch.object(AnimalType, \"is_cow\", new_callable=PropertyMock, return_value=is_cow)\nmock_add_error = mocker.patch.object(OutputManager, \"add_error\")\nwith pytest.raises(TypeError):\n    _ = animal.days_in_milk\nmock_add_error.assert_called_once()\n```\n\nProperties covered by this guard pattern include:\n\n- `days_in_milk` (getter/setter)\n- `days_in_pregnancy` (getter/setter — also guarded by animal type)\n- `future_cull_date` (getter/setter)\n- `daily_horizontal_distance`, `daily_vertical_distance`, `daily_distance` (getters/setters)\n- `reproduction` (getter/setter)\n- `calves`, `calving_interval`, `gestation_length`, `calf_birth_weight` (getters/setters)\n- `calving_interval_history` (getter)\n- `heifer_reproduction_program`, `heifer_reproduction_sub_program` (getters/setters)\n- `cow_reproduction_program`, `cow_presynch_program`, `cow_ovsynch_program`, `cow_resynch_program` (getters/setters)\n\n`future_death_date` is the exception — it is settable for any life stage, reflecting that youngstock mortality and cow death are both modeled.\n\n### 305-Day Milk Yield\n\n`update_305_day_milk_yield` delegates to `MilkProduction.calculate_305_day_milk_yield` in all cases except one: a dry cow that already has a non-zero yield from a prior lactation retains its stored value. The tests verify:\n\n- Cows before day 305 use the calculator.\n- Cows at or past day 305 also use the calculator (unified path).\n- Dry cows with a prior yield keep it.\n- Dry cows with no prior yield (still at the `0.0` init default) get the Wood's-curve integral so they don't drag down the herd mean.\n\n### Daily Routines\n\n`daily_routines` is the main per-day entry point. The test verifies the orchestration order and that the day counter increments:\n\n```python\nresult = animal.daily_routines(MagicMock(RufasTime))\nassert animal.days_born == 11\nassert animal.days_in_pregnancy == 1\n```\n\nThe mocked sub-routines are each asserted to be called once:\n\n- `_daily_nutrients_update`\n- `_daily_digestive_system_update`\n- `daily_milking_update`\n- `daily_growth_update`\n- `daily_reproduction_update`\n- `animal_life_stage_update`\n\nThe return value is a `DailyRoutinesOutput` containing the animal status, any newborn calf config (when a birth occurred), and herd reproduction statistics.\n\n### Daily Sub-Routine Tests\n\n- **`_daily_nutrients_update`** — calls `Nutrients.perform_daily_phosphorus_update` with a `NutrientsInputs` built from current animal state.\n- **`_daily_digestive_system_update`** — calls `DigestiveSystem.process_digestion` with a `DigestiveSystemInputs` including nutrient supply and milk composition.\n- **`daily_milking_update`** — only calls `MilkProduction.perform_daily_milking_update` for cows; stores the output DIM in `_milk_production_output_days_in_milk` and merges events.\n- **`daily_milking_update_without_history`** — same guard; used for animals without milk production history.\n- **`daily_growth_update`** — calls `Growth.evaluate_body_weight_change` with a `GrowthInputs` built from current state, then applies the returned body weight and conceptus weight.\n- **`daily_reproduction_update`** — the most complex routine. For non-eligible animals (calves) it returns `(None, None)`. For eligible animals it:\n  1. Calls `Reproduction.reproduction_update`.\n  2. Determines the new DIM via `_determine_days_in_milk` (which prefers the milk-production output DIM, falling back to the reproduction output, and raises `ValueError` if the current DIM is negative).\n  3. Updates Wood's lactation curve parameters from `LactationCurve.get_wood_parameters`.\n  4. Determines future cull/death dates.\n  5. Returns a `NewBornCalfValuesTypedDict` when a calf was born.\n\n### Life-Stage Transitions\n\nEach life stage has an update method that evaluates transition criteria and returns an `AnimalStatus`:\n\n| Method | Transition condition | New status |\n|---|---|---|\n| `_calf_life_stage_update` | `_evaluate_calf_for_heiferI` (days_born ≥ threshold) | `LIFE_STAGE_CHANGED` |\n| `_heiferI_life_stage_update` | `_evaluate_heiferI_for_heiferII` | `LIFE_STAGE_CHANGED` |\n| `_heiferII_life_stage_update` | culling check first, then `_evaluate_heiferII_for_heiferIII` | `SOLD`, `LIFE_STAGE_CHANGED`, or `REMAIN` |\n| `_heiferIII_life_stage_update` | `evaluate_heiferIII_for_cow` | `LIFE_STAGE_CHANGED` (with newborn config) |\n| `_cow_life_stage_update` | `is_milking` toggles between `LAC_COW` and `DRY_COW` | `LIFE_STAGE_CHANGED` |\n\n`animal_life_stage_update` is the dispatcher. It first checks `future_cull_date` and `future_death_date` against the current simulation day — if either has arrived, the animal is marked sold or dead (with `cull_reason` set to `DEATH_CULL` for death) and the routine short-circuits. Otherwise it delegates to the stage-specific method.\n\n### Reproduction Program Determination\n\n`_determine_heifer_reproduction_programs` is tested for three outcomes:\n\n- **TAI program** — maps the sub-protocol string to `HeiferTAISubProtocol`.\n- **SynchED program** — maps to `HeiferSynchEDSubProtocol`.\n- **Invalid/NA program** — raises an error.\n\n## Relationship to the Codebase\n\nThe test suite exercises the following production modules:\n\n- `RUFAS.biophysical.animal.animal` — the `Animal` class under test.\n- `RUFAS.biophysical.animal.animal_genetics.animal_genetics` — the `Genetics` class under test.\n- `RUFAS.biophysical.animal.animal_config` — `AnimalConfig` holds simulation-wide parameters (semen rates, phenotype means, mature weights) that the tests mutate directly.\n- `RUFAS.biophysical.animal.data_types.*` — typed dicts (`NewBornCalfValuesTypedDict`, `CowValuesTypedDict`, etc.), enums (`AnimalType`, `Breed`, `Sex`, `AnimalStatus`), and event/statistics containers.\n- `RUFAS.biophysical.animal.*` submodules (`growth`, `milk`, `reproduction`, `nutrients`, `digestive_system`) — mocked in most tests but exercised through their public interfaces in the daily-routine tests.\n- `RUFAS.util.Utility` — `generate_bivariate_random_numbers` is the random-number source for all genetic value generation.\n- `RUFAS.output_manager.OutputManager` — error/warning logging is asserted throughout.\n\nThe tests follow a consistent pattern: **mutate `AnimalConfig` state → construct the object under test → assert on internal method calls and resulting attribute values**. This makes the suite sensitive to configuration-driven behavior (e.g., semen type, phenotype year ranges) and to the guard logic that restricts cow-only properties to the correct life stages.","other-tests-test-data-structures":"# Other — tests-test_data_structures\n\n# tests/test_data_structures\n\n## Overview\n\nThis package contains the test suite for the data structures that connect the major biophysical modules of the RUFAS (Ruminant Farm Systems) model. These structures are the \"plumbing\" that moves mass and nutrient data between the animal, feed storage, crop/soil, and manure management components of the simulation.\n\nThe tests are organized into four files, each corresponding to a connection point in the model's material flow:\n\n| Test File | Production Code Under Test | Connection |\n|---|---|---|\n| `test_animal_to_manure_connection.py` | `RUFAS.data_structures.animal_to_manure_connection` | Animal → Manure storage |\n| `test_crop_soil_to_feed_storage_connection.py` | `RUFAS.data_structures.crop_soil_to_feed_storage_connection` | Crop/Soil → Feed storage |\n| `test_feed_storage_to_animal_connection.py` | `RUFAS.data_structures.feed_storage_to_animal_connection` | Feed storage → Animal |\n| `test_manure_nutrients.py` | `RUFAS.data_structures.manure_nutrients` | Manure → Crop/Soil |\n\n## Test Coverage by Module\n\n### 1. Animal → Manure Connection\n\n**File:** `test_animal_to_manure_connection.py`\n\nTests the `ManureStream` and `PenManureData` classes, which represent manure as it moves from animal pens into the manure management system.\n\n#### Key Behaviors Tested\n\n- **`ManureStream` arithmetic**: The `+` operator combines two streams by summing component masses (water, nitrogen, phosphorus, etc.) and computing a mass-weighted `methane_production_potential`. The `pen_manure_data` fields are summed when both operands have compatible `PenManureData`.\n- **`split_stream(ratio, stream_type)`**: Splits a stream into a fraction (`0 < ratio < 1`) of the original, scaling all component masses proportionally. The `pen_manure_data` is also split when present.\n- **`make_empty_manure_stream()`**: Class method returning a zeroed stream with `pen_manure_data=None`.\n- **`is_empty` property**: Returns `True` only for streams created by `make_empty_manure_stream()`.\n- **`PenManureData` validation**: Raises `ValueError` when a non-lactating animal combination is assigned to a `StreamType.PARLOR` stream.\n- **`PenManureData` combination rules**:\n  - `+` sums numeric fields and sets `pen_type` to `None` (since the combined pen spans multiple types).\n  - Raises `ValueError` if the two instances have different `first_processor` values.\n  - Raises `ValueError` if either instance has `stream_type == StreamType.GENERAL`.\n- **`StreamType` enum**: Verifies `PARLOR` and `GENERAL` members with their string values.\n\n#### Test Fixtures\n\n- `manure_stream`: A `ManureStream` with positional arguments (used to lock the constructor signature).\n- `manure_stream_1`, `pen_data_1`, `pen_data_2`: Reusable `ManureStream`/`PenManureData` instances with realistic values.\n- `sample_manure_stream`: A stream with `pen_manure_data` attached, used for split tests.\n\n### 2. Crop/Soil → Feed Storage Connection\n\n**File:** `test_crop_soil_to_feed_storage_connection.py`\n\nTests the `HarvestedCrop` class, which models a crop lot from harvest through storage and feed-out.\n\n#### Key Behaviors Tested\n\n- **Initialization**: Verifies that constructor arguments are stored correctly and that derived properties (`initial_dry_matter_percentage`, `initial_dry_matter_mass`) are computed. Also verifies that `RufasTime` objects are converted to `date` objects for `harvest_time` and `storage_time`.\n- **`fresh_mass` property**: Computed as `dry_matter_mass / (dry_matter_percentage / 100)`, with a guard against division by zero.\n- **`remove_dry_matter_mass(mass)`**: Reduces dry matter and recomputes `dry_matter_percentage` based on the new fresh mass.\n- **`remove_feed_mass(mass)`**: Removes fresh mass, raising `ValueError` if the requested removal exceeds available dry matter.\n- **`estimate_maximum_effluent()`**: Returns a positive value only when `dry_matter_percentage < 30%`; otherwise returns `0.0`.\n- **`_calculate_bale_density()`**: Empirical relationship between dry matter percentage and bale density.\n- **`_calculate_total_sensible_heat_generated()`**: Heat generation model based on dry matter percentage and bale density.\n\n#### Test Fixtures\n\n- `sample_crop_data` (from `tests.test_biophysical.test_feed_storage.sample_crop_data`): A complete, valid `HarvestedCrop` configuration reused across tests.\n\n### 3. Feed Storage → Animal Connection\n\n**File:** `test_feed_storage_to_animal_connection.py`\n\nTests the feed data model and the `AvailableFeedsBuilder` factory that constructs feed objects from configuration.\n\n#### Key Behaviors Tested\n\n- **`Feed` class hierarchy**: `NASEMFeed` and `NRCFeed` subclasses accept their respective nutrient profiles via `**kwargs`.\n- **Enums**: `FeedCategorization`, `FeedComponentType`, and `NutrientStandard` members and their string values.\n- **`AvailableFeedsBuilder.setup_available_feeds(config, nutrient_standard)`**:\n  - Delegates to `_process_feed_library` to load and convert the feed library.\n  - Delegates to `_validate_feed_config` for configuration validation.\n  - Sorts feeds by `rufas_id`.\n  - Sets `amount_available=0.0` and derives `on_farm_cost` from `purchase_cost` using `ON_FARM_TO_PURCHASED_PRICE_RATIO`.\n  - Applies per-feed overrides from the config (`purchased_feed_cost`, `buffer`).\n- **`_validate_feed_config`**:\n  - Accepts a valid config without error.\n  - Raises `ValueError` when a configured `feed_type` is missing from the selected feed library.\n  - Raises `ValueError` on duplicate `feed_type` entries in the top-level `feeds` section.\n  - Raises `ValueError` on duplicate `feed_type` entries within a ration.\n  - Raises `ValueError` when a ration references a feed not in the top-level `feeds` section.\n- **`_find_feed_repeats(values)`**: Returns the set of duplicated values (or empty set).\n- **`_process_feed_library(nutrient_standard)`**: Loads the correct data key (`\"NASEM_Comp\"` or `\"NRC_Comp\"`), converts the columnar library to a list of row dicts, indexes by `rufas_id`, and converts string enum fields to their enum members.\n\n#### Test Fixtures\n\n- `mock_feed`: Base `Feed` fields.\n- `mock_NASEM_feed` / `mock_NRC_feed`: Nutrient-standard-specific fields.\n- `valid_feed_config`: A minimal but valid configuration with two feeds and one ration.\n- `feed_library`: A stub library mapping `feed_type` IDs to `{}`.\n\n### 4. Manure Nutrients\n\n**File:** `test_manure_nutrients.py`\n\nTests the `ManureNutrients` dataclass and the `NutrientRequestResults` class used for nutrient accounting between manure storage and crop application.\n\n#### Key Behaviors Tested\n\n- **`ManureNutrients` validation** (`__post_init__`):\n  - All mass fields must be non-negative.\n  - `manure_type` must be a `ManureType` enum member.\n- **Arithmetic operators**:\n  - `+` / `-`: Element-wise addition/subtraction of all mass fields. Raises `TypeError` when mixing `ManureType` values or non-`ManureNutrients` operands. Raises `ValueError` when subtraction would produce a negative result.\n  - `*` / `rmul`: Scales all mass fields by a scalar. Raises `TypeError` for non-numeric scalars and `ValueError` for negative scalars.\n- **Composition properties**: `dry_matter_fraction`, `nitrogen_composition`, and `phosphorus_composition` compute mass fractions, returning `0.0` when total mass is zero.\n- **`reset_values()`**: Returns a new zeroed `ManureNutrients` with the same `manure_type`.\n- **`NutrientRequestResults.__add__`**: Combines two requests with mass-weighted fraction averaging. When total nitrogen (or phosphorus) is zero, the first request's fractions are preserved. The `ammonium_nitrogen_fraction` is weighted by the inorganic nitrogen mass.\n\n## Test Strategy Notes\n\n- **Property-based parameterization**: The `NutrientRequestResults` addition tests use `@pytest.mark.parametrize` with boundary values (`0`, `0.01`, `0.99`) to exercise edge cases in fraction weighting.\n- **Mocking boundaries**: `InputManager` is mocked in `test_process_feed_library` to isolate the feed library conversion logic. `HarvestedCrop`'s computational methods are mocked in `test_attributes` to verify constructor-side-effect ordering.\n- **Error message contracts**: Many tests assert on exact error message text (e.g., `\"Cannot combine PenManureData instances with different first processors.\"`). Changing these messages requires updating the corresponding tests.\n- **Positional constructor calls**: `test_manure_stream` uses positional arguments to lock the `ManureStream.__init__` signature, preventing accidental reordering of parameters.\n\n## Running the Tests\n\n```bash\n# From the repository root\npytest tests/test_data_structures/ -v\n\n# Run a single file\npytest tests/test_data_structures/test_manure_nutrients.py -v\n\n# Run a single test\npytest tests/test_data_structures/test_animal_to_manure_connection.py::test_split_stream_valid -v\n```\n\n## Relationship to Other Modules\n\nThese tests depend on fixtures and utilities from sibling test packages:\n\n- `tests.test_biophysical.test_feed_storage.sample_crop_data` — shared `HarvestedCrop` configuration.\n- `RUFAS.rufas_time.RufasTime` — time conversion test in `test_harvest_and_storage_time_with_rufas_time`.\n- `RUFAS.input_manager.InputManager` — mocked in `test_process_feed_library`.\n- `RUFAS.units.MeasurementUnits` — enum used in feed library conversion.\n- `RUFAS.biophysical.animal.data_types.animal_combination.AnimalCombination` — used to construct `PenManureData` instances.","other-tests-test-eee":"# Other — tests-test_EEE\n\n# tests/test_EEE — EEE Module Test Suite\n\n## Overview\n\nThe `tests/test_EEE` package contains the unit test suite for the RUFAS **EEE** (Emissions, Energy, and Equipment) subsystem. The EEE module estimates greenhouse gas emissions and diesel fuel consumption from farm operations — including farm-grown feed production, purchased feed life-cycle assessment (LCA) and land-use change (LUC) emissions, and tractor/implement field operations.\n\nThe test suite is organized into five files, each targeting one production class:\n\n| Test file | Class under test | Production module |\n|---|---|---|\n| `test_eee_manager.py` | `EEEManager` | `RUFAS/EEE/EEE_manager.py` |\n| `test_emissions.py` | `EmissionsEstimator` | `RUFAS/EEE/emissions.py` |\n| `test_energy.py` | `EnergyEstimator` | `RUFAS/EEE/energy.py` |\n| `test_tractor.py` | `Tractor` | `RUFAS/EEE/tractor.py` |\n| `test_tractor_implement.py` | `TractorImplement` | `RUFAS/EEE/tractor_implement.py` |\n\nShared test data lives in `tests/test_EEE/fixtures.py`, which provides raw input dictionaries, parsed intermediate structures, and expected outputs used across the suite.\n\n## Test Infrastructure\n\n### Shared Fixtures\n\nThe `fixtures.py` module supplies parametrized data for the emissions and energy tests. The most important fixtures are:\n\n- **Raw input data** — `raw_nitrous_oxide_emissions_data`, `raw_ammonia_emissions_data`, `raw_fertilizer_application_data`, `raw_manure_application_data`, `raw_received_crop_data`, `raw_harvest_data`, `raw_farmgrown_feed_deductions_data`\n- **Parsed/expected outputs** — `parsed_emissions_data`, `parsed_fertilizer_and_manure_application_data`, `expected_crop_to_feed_id_mapping`, `expected_harvest_yield_data`, `expected_farmgrown_feed_deductions_data`, `expected_daily_farmgrown_feed_emissions_and_resources`, `expected_daily_farmgrown_feed_fed_emissions_and_resources_by_feed_id`\n- **Energy/equipment data** — `parsed_diesel_consumption_inputs`, `EEE_constants`, `tractor_dataset`, `filtered_variable_pool`\n- **Factory helpers** — `mock_tractor` and `mock_tractor_implement` construct fully-initialized instances with mocked `InputManager.get_data` calls\n\nEach test file begins with `assert <fixture> is not None` statements. This is a deliberate guard: if a fixture is missing or fails to load, the test module fails at import time rather than producing confusing `None`-related errors mid-test.\n\n### Mocking Strategy\n\nThe suite relies heavily on `pytest-mock` (`MockerFixture`) and follows consistent patterns:\n\n- **`InputManager` and `OutputManager` are mocked at the class level** — e.g., `mocker.patch(\"RUFAS.EEE.emissions.InputManager\")` — so tests can control `get_data` responses and capture `add_variable`, `add_variable_bulk`, `add_log`, `add_warning`, and `add_error` calls.\n- **`OutputManager.filter_variables_pool` is mocked with `side_effect` lists** to simulate sequential reads of different variable pools (e.g., nitrous oxide data followed by ammonia data).\n- **Private methods are patched with `mocker.patch.object`** to isolate a single method under test. For example, `test_estimate_emissions` patches all ten internal parsing/calculation methods of `EmissionsEstimator` and asserts each is called exactly once.\n- **`__init__` is sometimes patched to return `None`** (e.g., `mocker.patch.object(EmissionsEstimator, \"__init__\", return_value=None)`) so tests can construct an instance and then manually set attributes like `em.im`, `em.om`, and `em.crop_species_to_purchased_feed_id` without triggering real initialization logic.\n\n## test_eee_manager.py — EEEManager Orchestration\n\n`EEEManager.estimate_all` is the entry point that dispatches to the emissions and energy estimators. The tests verify two things:\n\n1. **Conditional dispatch** — emissions estimation runs only when `simulate_fields=True`; energy estimation runs unconditionally.\n2. **Logging behavior** — the number of `OutputManager.add_log` calls varies by simulation flags.\n\nThe parametrized test `test_estimate_all` covers six flag combinations:\n\n| `simulate_animals` | `simulate_feed` | `simulate_fields` | `simulate_manure` | Expected log count | Emissions run? | Energy run? |\n|---|---|---|---|---|---|---|\n| True | True | True | True | 4 | Yes | Yes |\n| False | True | True | True | 4 | Yes | Yes |\n| True | False | True | True | 4 | Yes | Yes |\n| True | True | True | False | 4 | Yes | Yes |\n| True | True | False | True | 1 | No | Yes |\n| False | False | False | False | 1 | No | Yes |\n\nThe test asserts that `EmissionsEstimator.__init__` and `estimate_farmgrown_feed_emissions` are called **only** when `simulate_fields` is true, and that `EnergyEstimator.estimate_all` is always invoked with the same flag arguments.\n\n## test_emissions.py — EmissionsEstimator\n\nThis is the largest test file, covering the full emissions pipeline. The `em` fixture builds an `EmissionsEstimator` with pre-populated state:\n\n- `crop_species_to_purchased_feed_id` — maps crop species to lists of RUFAS feed IDs (e.g., `\"corn_silage\" → [\"50\", \"51\", \"52\"]`)\n- `purchased_feed_emissions_by_location` and `land_use_change_emissions_by_location` — emission factors keyed by feed ID\n- `_missing_purchased_ids` and `_missing_land_use_ids` — sets tracking feeds with missing data\n\n### Initialization\n\n`test_emissions_estimator_init` verifies that the constructor builds the `crop_species_to_purchased_feed_id` mapping from `feed_storage_configurations` filtered by `feed_storage_instances`. Only storage types present in the instances (e.g., `\"freestall\"`) contribute their `rufas_ids`. The companion test `test_emissions_estimator_init_without_feed_storage_data` confirms that when `simulate_feed=False`, feed storage inputs are never read and the mapping stays empty.\n\n### Purchased Feed Emissions\n\n`calculate_purchased_feed_emissions` multiplies feed amounts by emission factors and reports two variables via `OutputManager.add_variable`:\n\n- `purchased_feed_emissions` — LCA emissions\n- `land_use_change_emissions` — LUC emissions\n\nTests cover:\n- **String keys** — known IDs are multiplied by their factors; unknown IDs are silently ignored\n- **Integer keys** — int feed IDs are stringified for factor lookup, but the output dict preserves original key types\n- **Empty input** — still logs both variables with empty dicts\n\n`check_available_purchased_feed_data` validates that all feed IDs have emission factors. When IDs are missing, it emits warnings via `om.add_warning` and accumulates the missing IDs in `_missing_purchased_ids` / `_missing_land_use_ids`. The tests verify both the warning titles/messages and that the missing-ID sets accumulate across multiple calls (set union).\n\n### Farm-Grown Feed Emissions Pipeline\n\n`estimate_farmgrown_feed_emissions` orchestrates the full pipeline. `test_estimate_emissions` mocks all ten internal methods and asserts the call order and single invocation of each:\n\n```\nestimate_farmgrown_feed_emissions\n├── im.get_data(\"config\")                    # get simulation date range\n├── _parse_farmgrown_feeds_emission_data     # N2O + NH3 emission factors\n├── _parse_manure_and_fertilizer_application_data\n├── _parse_crop_to_feed_id_mapping\n├── _parse_harvest_data\n├── _parse_farmgrown_feed_deductions_data\n├── _calculate_daily_farmgrown_feed_emissions_and_resources\n├── _calculate_daily_farmgrown_feed_fed_emissions_and_resources\n├── _report_daily_farmgrown_feed_fed_emissions_and_resources\n└── _calculate_and_report_lca_emissions\n```\n\nThe individual parsing methods are tested against the shared fixtures:\n\n- **`_parse_farmgrown_feeds_emission_data`** — calls `filter_variables_pool` twice (N2O then ammonia) and returns a nested dict keyed by emission type → crop → day\n- **`_parse_manure_and_fertilizer_application_data`** — same pattern; returns `defaultdict(dict)` when both pools are empty\n- **`_parse_crop_to_feed_id_mapping`** — maps `(crop_name, year)` tuples to `RUFAS_ID` values\n- **`_parse_harvest_data`** — combines raw harvest data with the crop-to-feed mapping\n- **`_parse_farmgrown_feed_deductions_data`** — returns `defaultdict(dict)` on empty input\n\nThe calculation methods are verified against expected outputs with `pytest.approx(..., rel=1e-3)`:\n\n- **`_calculate_daily_farmgrown_feed_emissions_and_resources`** — computes per-feed, per-day emissions and resource use from emission factors, application data, and harvest yields\n- **`_calculate_daily_farmgrown_feed_fed_emissions_and_resources`** — applies feed deductions to get actual fed amounts\n- **`_report_daily_farmgrown_feed_fed_emissions_and_resources`** — asserts `add_variable_bulk` is called `2 * 6` times (two variable types × six feeds)\n- **`_calculate_and_report_lca_emissions`** — asserts `add_variable_bulk` is called `2 * 2` times\n\n### Farm-Grown Feed Inventory\n\n`_gather_farmgrown_feed_inventory_data` reads daily storage levels from the variable pool and builds a `{dry_matter_percent: {day: amount}}` structure, zero-filling all simulation days. Two tests cover:\n\n- **Success** — storage levels for DM 12% and 7% are merged into the zero-filled day range\n- **Bad key** — a variable name that doesn't match the expected `stored_feed_<id>_dm.daily_storage_levels` pattern triggers `om.add_error` with title `\"Farmgrown Feed Data Parsing Error\"` and then raises `ValueError` with a message pointing to `emissions.py` filters\n\n### Data Lookup\n\n`_get_feed_emissions_data` selects the emission factor row matching the county code. Tests cover a valid match and a `ValueError` for an unknown county code, which also logs an error via `om.add_error` (note: the test message contains a typo — \"country code\" — that is asserted verbatim).\n\n## test_energy.py — EnergyEstimator\n\n### estimate_all\n\n`test_estimate_all` verifies the orchestration of diesel consumption estimation. It parametrizes over `tractor_size` being a valid `TractorSize` value or `None`. The test mocks `parse_inputs_for_diesel_consumption_calculation`, `calculate_diesel_consumption`, `report_diesel_consumption`, and the `Tractor` class, then asserts:\n\n- `parse_inputs_for_diesel_consumption_calculation` is called once\n- `calculate_diesel_consumption`, `report_diesel_consumption`, and `Tractor` are each called once **per operation** in the parsed inputs\n- Each `Tractor` call receives `herd_size=10` and the expected `tractor_size` (or `None` when no size is configured)\n- `om.add_variable` is called once per unique `(field_name, operation_year)` pair plus once per unique `operation_year` (field-level and year-level aggregation)\n\n### report_diesel_consumption\n\nParametrized over five `FieldOperationEvent` types (HARVEST, PLANTING, MANURE_APPLICATION, FERTILIZER_APPLICATION, TILLING), this test verifies the number of `add_variable` calls. The expected count is `5 + N` where 5 is the base variable count and `N` depends on the operation type (1 for planting, 2 for the others).\n\n### parse_inputs_for_diesel_consumption_calculation\n\nMocks `filter_variables_pool` with a `side_effect` list and asserts the parsed result matches `parsed_diesel_consumption_inputs`.\n\n### calculate_diesel_consumption\n\nUses `MagicMock(auto_spec=Tractor)` and two `MagicMock(auto_spec=TractorImplement)` instances. The test patches `calculate_operation_time_hr` to return 1.8 for both implements and `_calculate_total_power_needed` to return 18, then verifies the diesel consumption formula produces the expected value. The expected results scale with `crop_yield / field_production_size` and `clay_percent`, and the test confirms `_calculate_total_power_needed` is called once per implement.\n\n### _calculate_total_power_needed\n\nVerifies that total power is the sum of three components:\n\n- `tractor.calculate_axel_power(implement)`\n- `implement.calculate_drawbar_power(...)`\n- `implement.calculate_needed_PTO(...)`\n\nEach mocked component returns a fixed value, and the test asserts the sum and that each sub-method received the expected arguments.\n\n## test_tractor.py — Tractor\n\n### Tractor Size Selection\n\n`test_herd_size_to_tractor_size` verifies the herd-size → tractor-size mapping:\n\n| Herd size | Expected `TractorSize` |\n|---|---|\n| 100 | SMALL |\n| 500 | MEDIUM |\n| 1500 | MEDIUM |\n| 2000 | LARGE |\n| 3000 | LARGE |\n\n`test_tractor_size_initialization` confirms the size is preserved when explicitly passed. `test_raises_value_error_for_missing_parameters` and `test_herd_size_negative_value_error` verify validation: a `ValueError` is raised when required parameters are missing or herd size is negative.\n\n### Operation Type Determination\n\n`test_determine_operation_type` parametrizes over operation events and crop types, verifying the `operation_types` list:\n\n- **HARVEST** — forage crops (alfalfa, tall fescue in hay/silage/baleage forms) get `[MOWING, WINDROWING, COLLECTION]`; grain crops get `[COLLECTION]`\n- **FERTILIZER_APPLICATION** — depth 0 → `FERTILIZER_APPLICATION_SURFACE`; depth > 0 → `FERTILIZER_APPLICATION_BELOW_SURFACE`\n- **MANURE_APPLICATION** — same surface/below-surface split\n- **PLANTING** → `[PLANTING]`\n- **TILLING** → `[TILLING]`\n\n`test_determine_harvest_operation_types` isolates the harvest logic and additionally covers `corn_silage` and `None` crop types, both mapping to `[COLLECTION]`.\n\nInvalid application depths (`None` or negative) raise `AssertionError` in `_determine_fertilizer_application_operation_types` and `_determine_manure_application_operation_types`.\n\n### Power and Mass Properties\n\nParametrized tests verify the computed properties against expected values from the tractor dataset:\n\n- **`PTO_kW`** — 55.93 / 208.42 / 328.11 for SMALL / MEDIUM / LARGE\n- **`power_available_kW`** — `PTO_kW / 1.4`\n- **`mass_kg`** — 8400 / 12700 / 20856\n- **`speed_km_hr`** — always 10.0\n\n`test_calculate_axel_power` verifies the formula `(tractor_mass + implement_mass) * speed * 0.00022039111111`, covering edge cases like zero speed, zero implement mass, and all-zero inputs.\n\n## test_tractor_implement.py — TractorImplement\n\n### Initialization\n\n`test_init` verifies that the constructor stores the operation event, operation type, crop type, tractor size, and tillage implement, and that it reads `EEE_constants.constants` via `InputManager.get_data` to populate `field_speed_km_per_hr` (10.0) and `field_efficiency` (0.9). It also confirms `determine_implement_parameters` is called with the application depth.\n\n### Implement Parameter Tables\n\nThe bulk of this file is a large parametrized test (`test_determine_implement_parameters`) covering the implement parameter lookup for every combination of:\n\n- **Operation type** — PLANTING, MOWING, WINDROWING, COLLECTION\n- **Crop type** — alfalfa, cereal rye, corn, soybean, tall fescue, triticale, winter wheat (each in hay/silage/baleage/grain forms where applicable)\n- **Tractor size** — SMALL, MEDIUM, LARGE\n\nFor each combination, the test asserts the full set of implement parameters: coefficients A, B, C, E, F, G, implement width, mass, throughput, application depth, whether depth is relevant, and the associated `HarvestOperation` type.\n\nThe data reveals the underlying model structure:\n\n- **PLANTING** operations use coefficient A (e.g., 200 for small-seeded crops, 900 for corn/soybean) and have a depth-relevant parameter (1.27 for alfalfa, 3.18 for cereal rye/wheat, 4.45 for corn, 3.81 for triticale)\n- **MOWING** uses coefficient E=5 and has no throughput\n- **WINDROWING** uses coefficient E=1\n- **COLLECTION** uses coefficients C and F, with throughput varying by crop (e.g., 6.0 for hay, 8.0 for silage, 20.0 for corn grain)\n- Implement width and mass scale with tractor size (e.g., planting width 3.7 → 4.9 → 6.1 for SMALL → MEDIUM → LARGE)\n\n## Relationship to the Production Code\n\nThe test suite exercises the EEE subsystem's interaction with the broader RUFAS architecture:\n\n```mermaid\ngraph LR\n    subgraph \"Production\"\n        IM[InputManager] -->|get_data| EE[EEEManager]\n        EE --> EM[EmissionsEstimator]\n        EE --> EN[EnergyEstimator]\n        EN --> TR[Tractor]\n        TR --> TI[TractorImplement]\n        EM --> OM[OutputManager]\n        EN --> OM\n    end\n    subgraph \"Tests\"\n        T1[test_eee_manager] --> EE\n        T2[test_emissions] --> EM\n        T3[test_energy] --> EN\n        T4[test_tractor] --> TR\n        T5[test_tractor_implement] --> TI\n        FX[fixtures.py] --> T2\n        FX --> T3\n        FX --> T4\n        FX --> T5\n    end\n```\n\nKey integration points verified by the tests:\n\n- **`InputManager.get_data`** — the single data access point, mocked with `side_effect` functions that dispatch on data address strings (`\"config.FIPS_county_code\"`, `\"EEE_constants.constants\"`, `\"tractor_dataset\"`, `\"feed_storage_configurations\"`, etc.)\n- **`OutputManager`** — the reporting sink. Tests assert on `add_variable`, `add_variable_bulk`, `add_log`, `add_warning`, and `add_error` call counts, arguments, and metadata (function name, units)\n- **`RUFAS.data_structures`** — enums like `TractorSize`, `FieldOperationEvent`, `OperationType`, `TillageImplement`, and `RUFAS_ID` are used throughout the tests to construct realistic inputs\n- **`RUFAS.biophysical.field.crop.harvest_operations.HarvestOperation`** — used in the implement parameter tests to verify harvest-type classification\n\n## Running the Tests\n\n```bash\npytest tests/test_EEE/ -v\n```\n\nThe suite is designed to run in isolation — all external dependencies (`InputManager`, `OutputManager`, data files) are mocked, so no real input data or county-level datasets are required.","other-tests":"# Other — tests\n\n# RUFAS Test Suite\n\n## Overview\n\nThe `tests/` module contains the unit and integration test suite for the RUFAS (Ruminant Farm Systems) model. It validates the behavior of three core subsystems: environmental condition calculations, Data Collection App schema generation, and input data validation. The suite uses `pytest` with `pytest-mock` for mocking, and is organized by the production module each test file targets.\n\n## Test Files and Coverage\n\n| File | Production Module Under Test | Focus |\n|---|---|---|\n| `test_current_day_conditions.py` | `RUFAS.current_day_conditions` | Day length, solar declination, precipitation partitioning |\n| `test_data_collection_app_updater.py` | `RUFAS.data_collection_app_updater` | JSON schema generation for the Data Collection App |\n| `test_data_validator.py` | `RUFAS.data_validator` | Type validation, data fixing, metadata validation, cross-validation |\n\n## Current Day Conditions Tests\n\n`test_current_day_conditions.py` verifies the `CurrentDayConditions` class, which computes daily environmental inputs for the simulation.\n\n### Precipitation Partitioning\n\nThe `test_current_weather_snowfall` test is parameterized with three scenarios verifying that total precipitation is correctly split into `snowfall` and `rainfall` based on `mean_air_temperature`. When the mean temperature is at or above freezing (1°C), precipitation falls as rain; when below freezing (−1°C), it falls as snow.\n\n### Day Length Calculation\n\n`test_determine_daylength` validates the `determine_daylength` method against known geographic cases:\n\n- **Madison, Wisconsin** (43.073°N) — no polar day/night possible; day length ≈ 9 hours on day 15\n- **Barrow, Alaska** (68°N) — polar night (0 hours) in winter, polar day (24 hours) in summer\n- **Southern hemisphere** (−68°N) — inverted polar behavior\n\nThe test mocks `calculate_solar_declination_radians` and `Utility.convert_ordinal_date_to_month_date` to assert call counts. Notably, the date conversion utility is only invoked for polar locations, confirming that the polar-day/night branch requires calendar lookup while the general case uses a direct formula.\n\n### Solar Declination\n\n`test_calculate_solar_declination_radians` verifies the trigonometric formula:\n\n```\nsin_param = (2π / 365) × (day_number − 82)\ndeclination = asin(0.4 × sin(sin_param))\n```\n\n## Data Collection App Updater Tests\n\n`test_data_collection_app_updater.py` tests the `DataCollectionAppUpdater` class, which generates JSON schemas consumed by the RUFAS Data Collection App (a web-based data entry interface).\n\n### Schema Generation by Type\n\nThe class maintains a `_type_to_schema_map` dispatching to type-specific schema builders. Tests cover each builder:\n\n- **`_create_number_schema`** — maps `minimum`/`maximum` constraints, handles `nullable` by emitting `[\"number\", \"null\"]` as the JSON type\n- **`_create_bool_schema`** — maps to JSON `boolean` with a `checkbox` format\n- **`_create_string_schema`** — converts regex `pattern` constraints into `enum` dropdown options via `_get_list_of_options`; falls back to a plain text input with a warning when the pattern is not a valid option list\n- **`_create_array_schema`** — wraps element schemas in an `items` block with a `grid` format\n- **`_create_object_schema`** — recursively builds nested property schemas\n\n### Feed Schema Updates\n\nThe `gather_feed_data` and `update_feed_schema` methods handle the special case of feed definitions. `gather_feed_data` reads a CSV of feed types and produces `{id, name}` pairs formatted as `\"Name (description) - id\"`. `update_feed_schema` injects these as dropdown options into the feed schema file, preserving the `feed_schema = {...}` JavaScript assignment syntax.\n\n### Schema Rewriting Pipeline\n\n`test_rewrite_schemas` and `test_rewrite_index_page` verify the end-to-end schema regeneration flow:\n\n1. Filter metadata properties by `data_collection_app_compatible: True`\n2. Generate a schema for each compatible property group\n3. Add a `fileName` input field to each schema\n4. Write schema files to `DataCollectionApp/schema/`\n5. Rewrite the app's index page to reference the new schema files\n\n### Regex Option Extraction\n\n`_get_list_of_options` parses anchored alternation patterns like `^(kg)$` or `^(Sand|Straw|Sawdust)$` into option lists. Tests verify both successful extraction and `ValueError` raising for malformed patterns (unanchored, invalid character classes, lookaheads).\n\n### Title Parsing\n\n`_parse_variable_name_into_title` converts snake_case identifiers into human-readable titles (`\"snake_case\"` → `\"Snake Case\"`), with tests covering mixed-case and already-readable inputs.\n\n## Data Validator Tests\n\n`test_data_validator.py` is the largest test file, covering the `DataValidator` class and its supporting types (`ElementsCounter`, `ElementState`, `CrossValidator`, `Modifiability`).\n\n### Type Validators\n\nEach primitive type validator is tested with parameterized valid/invalid inputs:\n\n- **`_bool_type_validator`** — accepts only `True`/`False` (or `None` when `nullable`)\n- **`_number_type_validator`** — enforces `minimum`/`maximum` bounds and type correctness\n- **`_string_type_validator`** — enforces `pattern`, `minimum_length`, `maximum_length`\n- **`_object_type_validator`** — recursively validates nested properties and removes extraneous keys not declared in metadata\n- **`_array_type_validator`** — validates container length constraints and each element via `validate_data_by_type`\n\n### Data Fixing\n\nThe `_fix_data` method attempts to repair invalid values using metadata defaults. Tests cover three data types (array, string, number) across two scenarios:\n\n- **Fixable** — a `default` exists in metadata; the value is replaced and a warning pair is logged (`\"Validation: invalid data found\"` followed by `\"Validation: data fixed\"`)\n- **Critical** — no default exists; an error is logged (`\"Validation: invalid data not able to be fixed\"`) and the data remains invalid\n\nTests also verify nested path traversal (e.g., `[\"element4\", \"element5\"]`) and CSV array element fixing (e.g., `[\"element1\", 4]` for a list index).\n\n### Path Utilities\n\n- **`extract_value_by_key_list`** — navigates nested dicts/lists by a key path; raises `KeyError` for missing keys\n- **`convert_variable_path_to_str`** — renders paths as `\"animal.herd_information.calf_num\"` or `\"manure_management_scenarios.[0].bedding_type\"` for log messages\n\n### Metadata Validation\n\n`validate_metadata` and its helper methods enforce the structure of metadata files:\n\n- **`_validate_metadata_keys`** — checks required and allowed keys per entry\n- **`_validate_has_path_or_paths`** — ensures at least one file path is declared\n- **`_validate_metadata_properties`** — rejects empty properties sections\n- **`_validate_metadata_type`** — restricts file types to declared valid types (e.g., `{\"json\", \"csv\"}`)\n- **`_get_paths_to_check`** — normalizes `path`/`paths` into a single list, rejecting `None`, empty lists, and non-string entries\n\n### Metadata Property Validators\n\nType-specific metadata validators (`_metadata_number_validator`, `_metadata_string_validator`, `_metadata_bool_validator`, `_metadata_array_validator`, `_metadata_object_validator`) check that declared defaults, ranges, and patterns are internally consistent. Tests cover:\n\n- Default values outside `minimum`/`maximum` bounds\n- `minimum` > `maximum` (inverted ranges)\n- Non-nullable defaults set to `None`\n- Invalid regex patterns\n- Type mismatches (e.g., string default for a number property)\n\n### Cross-Validation\n\nThe `CrossValidator` class (tested via the `cv` fixture) evaluates conditional constraints between variables. Tests verify early termination when an `apply_when` condition fails and `eager_termination` is enabled, with mocked `_target_and_save`, `_evaluate_condition_clause_array`, and `_evaluate_condition` methods.\n\n## Test Infrastructure Patterns\n\n### Mocking Strategy\n\nThe suite relies heavily on `pytest-mock`'s `MockerFixture`. Common patterns:\n\n- **`mocker.patch.object`
